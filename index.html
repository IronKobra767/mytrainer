<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<title>My Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0B0F14; --card:#131A22; --card2:#1B242F; --line:#28323F; --line2:#344050;
  --txt:#EEF2F6; --dim:#9AA6B5; --faint:#66748A;
  --acc:#C8FF4A; --acc2:#9BE02B; --acc-ink:#0B0F14; --acc-soft:rgba(200,255,74,.12);
  --teal:#3DD9C4; --teal-soft:rgba(61,217,196,.13);
  --amber:#FFB454; --amber-soft:rgba(255,180,84,.13);
  --green:#4ADE80; --yellow:#FBBF24; --red:#F87171;
  --r:18px; --rs:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Inter,sans-serif;font-size:16px;line-height:1.45;overscroll-behavior-y:contain}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 8px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .nav{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:22px}
.datebar .mid{flex:1;text-align:center}
.datebar .mid .d1{font-size:18px;font-weight:800}
.datebar .mid .d2{font-size:12.5px;color:var(--dim)}
.todaybtn{display:block;margin:8px auto 0;font-size:13px;color:var(--acc-ink);background:var(--acc);border-radius:99px;padding:6px 16px;font-weight:700}
.todaybtn.hide{display:none}
.pagetitle{font-size:22px;font-weight:800;padding:8px 0 4px}
.pagesub{color:var(--dim);font-size:13.5px;margin-bottom:6px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}
.hero{background:linear-gradient(160deg,#151E28 0%,#0F151C 100%);border:1px solid var(--line2);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,255,74,.16),transparent 65%)}
.hero .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--acc)}
.hero h2{font-size:22px;margin-top:4px;line-height:1.2}
.hero .theme{color:var(--dim);font-size:13.5px;margin-top:4px}
.hero .row{display:flex;align-items:center;gap:14px;margin-top:14px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bgc{stroke:var(--card2)}
.ring .fgc{stroke:var(--acc);transition:stroke-dashoffset .4s}
.ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:var(--card2);border-radius:var(--rs);padding:10px 12px}
.stat .v{font-size:22px;font-weight:800;line-height:1.1}
.stat .k{font-size:11.5px;color:var(--dim);margin-top:2px}
.stat.acc .v{color:var(--acc)}
.chip{display:inline-block;background:var(--card2);border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--dim);margin:2px 4px 2px 0}
.chip b{color:var(--txt);font-weight:700}
.muted{color:var(--dim);font-size:13.5px}
.tiny{color:var(--faint);font-size:12px}
.progress{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.progress.teal>div{background:var(--teal)}
.progress.amber>div{background:var(--amber)}

/* week strip */
.wstrip{display:flex;gap:6px;margin-top:12px}
.wstrip .dd{flex:1;text-align:center}
.wstrip .dot{height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.wstrip .dot.done{background:var(--acc);border-color:var(--acc)}
.wstrip .dot.part{background:var(--amber);border-color:var(--amber)}
.wstrip .dot.gap{background:transparent;border-style:dashed}
.wstrip .dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--acc)}
.wstrip .lb{font-size:10.5px;color:var(--faint);margin-top:4px}

/* component cards */
.rcard{display:flex;align-items:center;gap:14px;cursor:pointer}
.rcard .ic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.rcard.f .ic{background:var(--teal-soft)} .rcard.h .ic{background:var(--amber-soft)}
.rcard .bd{flex:1;min-width:0}
.rcard .arr{color:var(--faint);font-size:22px}
.rcard h3{font-size:17px}
.donebadge{color:var(--green);font-weight:700}

/* traffic light */
.lights{display:flex;gap:8px;margin-top:12px}
.lights button{flex:1;border-radius:12px;padding:10px 0;font-size:13px;font-weight:700;background:var(--card2);color:var(--dim);border:1.5px solid transparent}
.lights button.g.on{background:rgba(74,222,128,.14);color:var(--green);border-color:var(--green)}
.lights button.a.on{background:rgba(251,191,36,.14);color:var(--yellow);border-color:var(--yellow)}
.lights button.r.on{background:rgba(248,113,113,.14);color:var(--red);border-color:var(--red)}
.lightnote{font-size:12.5px;margin-top:8px;color:var(--dim)}

/* check-in */
.ci{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ci label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.ci input,.ci select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;text-align:center;font-size:16px;-moz-appearance:textfield}
.ci input::-webkit-outer-spin-button,.ci input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ci .full{grid-column:1/3}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;border-radius:10px;padding:10px;background:var(--card2);border:1.5px solid transparent;color:var(--dim);font-weight:700;font-size:14px}
.toggle button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}

/* postpone */
.postpone{width:100%;border-radius:14px;padding:13px;text-align:center;font-weight:600;background:var(--card);border:1px dashed var(--line2);color:var(--dim);font-size:14.5px;margin-top:6px}
.shiftbanner{background:var(--acc-soft);border:1px solid rgba(200,255,74,.35);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--acc);margin:10px 0}
.shiftbanner button{color:var(--acc);font-weight:700;text-decoration:underline}

/* exercise rows */
.exrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.exrow:last-child{border-bottom:none}
.exrow .num{width:32px;height:32px;border-radius:99px;background:var(--card2);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--dim)}
.exrow.done .num{background:rgba(74,222,128,.15);color:var(--green)}
.exrow .bd{flex:1;min-width:0}
.exrow .nm{font-weight:700;font-size:15px}
.exrow .sub{font-size:12.5px;color:var(--dim);margin-top:1px}
.exrow .arr{color:var(--faint)}

/* exercise page */
.exhead{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.exhead .nav{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:18px}
.exhead .nav[disabled]{opacity:.25}
.exhead .mid{flex:1;text-align:center}
.exhead .mid .k{font-size:12px;color:var(--dim)}
.exhead .mid h2{font-size:17px;line-height:1.25}
.chips{margin:10px 0 2px}
.setrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.setrow .sn{width:44px;flex:none;font-size:13px;font-weight:800;color:var(--dim)}
.setrow input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 6px;text-align:center;font-size:17px;-moz-appearance:textfield}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setrow .f{flex:1;min-width:0}
.setrow select{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 4px;font-size:15px;width:100%;text-align:center}
.setrow .ck{width:48px;height:48px;flex:none;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--faint)}
.setrow .ck.on{background:rgba(74,222,128,.15);border-color:var(--green);color:var(--green)}
.collabels{display:flex;gap:8px;margin:2px 0 -4px}
.collabels span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.addset{font-size:13px;color:var(--acc);font-weight:700;margin-top:6px}
.lastline{font-size:12.5px;color:var(--dim);background:var(--card2);border-radius:10px;padding:8px 11px;margin:8px 0}
textarea.note{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:14.5px;min-height:54px;resize:vertical}
.paincard{border-color:var(--line2)}
.painrow{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
.painrow input[type=range]{flex:1;accent-color:var(--acc);height:28px}
.painval{width:58px;text-align:center;font-weight:800;font-size:19px;border-radius:10px;background:var(--card2);padding:8px 0}
.painval.a{color:var(--yellow)} .painval.r{color:var(--red)}
.bigbtn{display:block;width:100%;border-radius:99px;padding:16px;text-align:center;font-size:16px;font-weight:800;background:var(--acc);color:var(--acc-ink);margin:14px 0 6px}
.bigbtn.done{background:rgba(74,222,128,.15);color:var(--green);border:1.5px solid var(--green)}
.bigbtn.sec{background:var(--card);color:var(--acc);border:1.5px solid var(--line2);font-weight:700}
.bigbtn.start{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-ink);display:flex;align-items:center;justify-content:center;gap:8px}
.spacer{height:26px}

/* timer overlay */
.tmr{position:fixed;inset:0;z-index:70;background:#080B10;display:flex;flex-direction:column;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.tmr .hd{text-align:center}
.tmr .hd .nm{font-size:16px;font-weight:800}
.tmr .hd .meta{color:var(--dim);font-size:14px;margin-top:4px}
.tmr .hd .meta b{color:var(--txt)}
.tmr .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tmr .phase{font-size:34px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.tmr .phase.rest{color:var(--teal)} .tmr .phase.ready{color:var(--amber)}
.tmr .cnt{font-size:116px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.tmr .sub{color:var(--dim);font-size:14px;text-align:center;max-width:320px}
.tmr .dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.tmr .dots span{width:9px;height:9px;border-radius:99px;background:var(--card2)}
.tmr .dots span.on{background:var(--acc)} .tmr .dots span.cur{background:var(--amber)}
.tmr .ctl{display:flex;gap:10px}
.tmr .ctl button{flex:1;border-radius:14px;padding:15px;font-size:15px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--txt)}
.tmr .ctl button.primary{background:var(--acc);color:var(--acc-ink);border:none}
.tmr .ctl button.exit{color:var(--red)}

/* metrics */
.mrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.mrow label{flex:1;font-size:14.5px}
.mrow label .u{color:var(--faint);font-size:12px}
.mrow input{width:110px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 8px;text-align:center;font-size:16px;-moz-appearance:textfield}
.mrow input::-webkit-outer-spin-button,.mrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mdate{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px 12px;font-size:15px;color-scheme:dark}
.mhist{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.mhist:last-child{border-bottom:none}
.mhist .dt{font-weight:700;font-size:13.5px;width:84px;flex:none}
.mhist .vals{flex:1;color:var(--dim);font-size:12.5px}
.mhist .del{color:var(--faint);font-size:16px;padding:6px}

/* accordions */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
details.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;font-weight:700;font-size:15px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"+";color:var(--acc);font-size:19px;font-weight:400}
details.acc[open] summary:after{content:"–"}
details.acc .bd{padding:0 15px 13px;color:#C9D2DE;font-size:14.5px;white-space:pre-wrap}

/* dictionary */
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:12px 15px;font-size:15px;margin:8px 0}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;font-size:14px;padding:8px 0}

/* progress page */
.spark{width:100%;height:70px;display:block}
.pr{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.pr:last-child{border-bottom:none}
.pr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .v{font-weight:800;color:var(--acc)}
.pr .d{color:var(--faint);font-size:12px;width:56px;text-align:right}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,15,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bnav .in{max-width:560px;margin:0 auto;display:flex}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding:5px 0;font-weight:700}
.bnav button.on{color:var(--acc)}
.bnav svg{width:23px;height:23px}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:20px;max-width:340px;width:100%}
.modal h3{font-size:17px;margin-bottom:8px}
.modal p{color:var(--dim);font-size:14px;margin:0 0 16px}
.modal .row{display:flex;gap:10px}
.modal .row button{flex:1;border-radius:12px;padding:12px;font-weight:800;font-size:14.5px}
.modal .cancel{background:var(--card2);color:var(--txt)}
.modal .ok{background:var(--acc);color:var(--acc-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.phasehead{margin:16px 0 4px;font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.weekrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.weekrow:last-child{border-bottom:none}
.weekrow .dt{width:86px;flex:none;color:var(--dim);font-size:13px}
.weekrow .st{margin-left:auto;font-size:12px;font-weight:800}
.exportbtn{display:block;width:100%;border-radius:14px;padding:14px;text-align:center;font-weight:700;font-size:15px;background:var(--card);border:1px solid var(--line);color:var(--acc);margin:10px 0}
.dangerzone{border-color:rgba(248,113,113,.3)}
.dangerzone .exportbtn{color:var(--red)}
.motiv{font-size:13.5px;color:var(--dim);font-style:italic;margin-top:10px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<nav class="bnav"><div class="in" id="bnav"></div></nav>
<div id="overlay"></div>

<script>
const DATA ={"version":"Programme 2 v2.0 - Rebuild & Grow (2026-09-18)","target":"2026-12-01","phases":[{"name":"Phase 1 - Rebuild (weeks 1-2)","next":"Phase 2 adds the trap-bar deadlift, hack squat, split squats, dead hangs, loaded carries and the bodyweight Jefferson curl."},{"name":"Phase 2 - Build (weeks 3-5)","next":"Phase 3 restarts the effort wave (week 6 easy), adds dynamic core work (chops, reverse crunches, hanging knee raises), Copenhagen planks, optional barbell RDL and a light loaded Jefferson curl."},{"name":"Phase 3 - Grow (weeks 6-8)","next":"Phase 4 is the peak: hardest effort on isolation work with drop sets, ab-wheel, cable rotations with hip drive, heaviest carries, then a 4-day finish with the final assessment on 30 Nov."},{"name":"Phase 4 - Peak & Finish (weeks 9-11)","next":"1 December: reassess, celebrate, and transition to a long-term plan built on the same rules."}],"exercises":[{"id":0,"name":"Raise: brisk walk or bike (3-5 min)","cat":"Warm-up (RAMP - Raise)","muscles":"Whole body, cardiovascular system","purpose":"Raises temperature and heart rate so the mobility work is effective and the lifts are safe. Walking itself is also the best-evidenced habit for stopping back pain coming back.","equipment":"Treadmill, bike, or a lap of the gym","setup":"Standing / seated on bike. Set an easy-to-brisk pace.","startpos":"Tall posture.","exec":"Walk briskly or pedal easily for 3-5 minutes, building to slightly breathless by the end. Swing the arms naturally.","breathing":"Natural.","rom":"Comfortable.","progression":"Extend to a separate daily 20-30 min brisk walk outside the gym (the check-in tracks it).","regression":"Slow stroll.","alternative":"Rowing machine very easy.","errors":"None significant.","lumbar":"Low risk.","shoulder":"None.","leftleg":"Note left-leg push-off.","stop":"Stop at any leg symptoms.","source":"WalkBack RCT 2024 Lancet (HR 0.72 recurrence); RAMP warm-up (Kulis 2026 SR)"},{"id":1,"name":"Thoracic extension over foam roller","cat":"Thoracic mobility","muscles":"Mid-back extension; secondary: Chest, abs (lengthening)","purpose":"Restore upper-back extension so overhead and pressing positions stop wedging the lower back and shoulders.","equipment":"Foam roller, mat","setup":"Lying on back, roller across the mid-back. Roller horizontal under the shoulder-blade area, knees bent, feet flat, hands supporting the HEAD (not pulling), hips ON the floor.","startpos":"Elbows pointing up, ribs relaxed.","exec":"1) Gently arch the UPPER back over the roller, letting the head drop back a little into the hands. 2) Pause 2-3 breaths at a comfortable stretch. 3) Return, move the roller one segment up or down, repeat over 3-4 spots between shoulder blades and lower ribs. HIPS STAY DOWN - if the hips rise, the arch has moved into the lower back.","breathing":"Long exhales as you extend.","rom":"Gentle; upper back only.","progression":"Slightly more range; add arm reach-overs (Phase 3).","regression":"Roller higher only (between the blades); smaller arch; or seated chair-back extensions.","alternative":"Cat-camel focusing on the dip phase between the shoulder blades.","errors":"Hinging at the lower back (hips lifting); rolling onto the lower back; pulling the neck.","lumbar":"NEVER position the roller under the lower back. The roller must stay above the bottom ribs at all times.","shoulder":"Great pre-press mobiliser.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Thoracic mobility literature; active drills over manipulation (2018 SR)"},{"id":2,"name":"Lat stretch on a bench (kneeling reach)","cat":"Flexibility - lats/thoracic","muscles":"Latissimus dorsi, triceps long head, thoracic extension","purpose":"Opens the lats and the upper back into the overhead position - stiff lats pull the shoulder into pinching positions and the lower back into arching.","equipment":"Flat bench or box","setup":"Kneeling in front of the bench. Kneel facing a bench, elbows on the bench shoulder-width apart, hands together or holding a dowel, palms up.","startpos":"Hips back over the knees.","exec":"1) Sink the chest toward the floor between the arms, letting the head drop and the upper back extend, until you feel the lats and the sides of the upper back stretch. 2) Keep the ribs down - the stretch is in the armpits/upper back, not the lower back. 3) Hold 30-45 s breathing into the back of the ribs. 4) Optional: gently shift the hips left then right to bias each side.","breathing":"Slow breathing into the upper back.","rom":"Moderate; stop before any front-shoulder pinch.","progression":"Longer holds; palms-up dowel; one arm at a time for a deeper single-side stretch.","regression":"Doorway/wall lat lean.","alternative":"Dead hang.","errors":"Arching the lower back to fake range; shrugging.","lumbar":"Ribs down protects the lumbar spine.","shoulder":"Skip if the shoulder pinches in the overhead position; use the wall lean instead.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm.","source":"Delphi 2025 stretch dosing; shoulder mobility rationale"},{"id":3,"name":"Doorway chest stretch","cat":"Flexibility","muscles":"Chest (pectorals); secondary: Front shoulder","purpose":"Ease pressing-day chest tightness and help the shoulders sit back naturally.","equipment":"Doorway","setup":"Standing in a doorway. Forearm on the door frame, elbow at shoulder height or slightly BELOW (kinder to painful shoulders).","startpos":"Feet staggered, ribs down.","exec":"1) Forearm on the frame, elbow at or slightly BELOW shoulder height. 2) Turn the body away until a moderate stretch (4-6/10) crosses the chest, no pinching in the shoulder. 3) Hold 30-45 s breathing slowly. 4) Optional PNF: press the forearm into the frame at 30% for 6 s, relax, sink slightly deeper, hold 20 s more. Swap sides.","breathing":"Slow.","rom":"Gentle; elbow below shoulder height reduces shoulder stress.","progression":"Slightly higher elbow position in later phases if pain-free.","regression":"Hands-behind-back gentle chest opener.","alternative":"Lying on a rolled towel along the spine, arms resting out.","errors":"Elbow too high; leaning aggressively; shrugging.","lumbar":"A painful shoulder prefers below-shoulder-height angles. Do not let the lower back arch as you lean in.","shoulder":"Skip on any day the shoulders are above 3/10 at rest; use the lying towel version instead.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Shoulder rehab literature (Lewis/Cools); Warneke 2024"},{"id":4,"name":"Standing cable external rotation (elbow at side)","cat":"Rotator cuff strength","muscles":"Rotator cuff (infraspinatus/teres minor); secondary: rear deltoid, scapular stabilisers","purpose":"Progressive cuff loading is first-line for shoulder pain like yours. The standing version with the elbow pinned replaces the side-lying version that pinched you in Week 1.","equipment":"Cable at elbow height with D-handle (or band); small folded towel","setup":"Standing side-on to the anchor. Stand with your RIGHT side toward the anchor to train the LEFT shoulder (cable crosses the body). Towel between the LEFT elbow and ribs.","startpos":"Left elbow bent 90 degrees pinned on the towel, forearm across the belly toward the anchor, blade set back and down, light tension.","exec":"1) Rotate the forearm out and away from the belly like a gate opening, elbow glued to the towel, to a comfortable pain-free end (usually 30-45 degrees past straight ahead). 2) Pause 1 s. 3) Return slowly (3 s). Complete the reps, turn around for the other shoulder. Start with the LESS irritable side.","breathing":"Exhale rotating out.","rom":"Pain-free arc only (<=3/10); a smaller pain-free arc beats a bigger painful one.","progression":"10 -> 15 reps then smallest increment; add range as the pinch-free arc grows; later do it with the elbow supported at 30-45 degrees abduction (towel on a bench).","regression":"Isometric: push the wrist outward against a doorframe at ~50-70% effort, 5 x 45 s, pain-free.","alternative":"Isometric doorframe external rotation; prone-on-bench ER.","errors":"Elbow drifting off the towel; shrugging; going heavy; pushing into a pinch.","lumbar":"Stand tall, ribs down, light brace.","shoulder":"3 sessions per week at RPE 7-8 is the evidence-based dose; pain up to 3/10 that settles by next morning is acceptable.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm.","source":"Zhang 2025 NMA (progressive cuff strengthening SUCRA 92-99%); Lafrance 2024 JOSPT; Cavaggion 2024 (pain-free = into-pain)"},{"id":5,"name":"Scaption raise (full-can, thumb-up)","cat":"Rotator cuff / delt strength","muscles":"Supraspinatus, lateral/front deltoid; secondary: upper traps, serratus","purpose":"Loads the cuff and delts in the scapular plane with the thumb UP - the position that does NOT provoke pinching (the thumb-down 'empty can' does, without any benefit).","equipment":"Light dumbbells (2-6 kg)","setup":"Standing. DBs at the sides, palms in, arms angled about 30 degrees forward of the body line (the scapular plane).","startpos":"Tall, ribs down, blades set.","exec":"1) Raise both arms forward-and-out along that 30-degree line with the thumbs pointing UP, to shoulder height (80-90 degrees) and no higher. 2) Pause 1 s. 3) Lower slowly (3 s). Slight elbow bend throughout.","breathing":"Exhale raising.","rom":"To shoulder height max; stop earlier if any pinch.","progression":"10 -> 15 reps then +1 kg.","regression":"Lighter; shorter arc; cable version.","alternative":"Cable lateral raise (lean-away).","errors":"Thumbs turning down; shrugging; swinging; going above shoulder height.","lumbar":"Light loads, strict tempo.","shoulder":"Replaces the standard lateral raise on the shoulder-foundation days; stop the arc below any pinch.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm.","source":"Timmons 2013 (empty-can provokes pain); Noteboom 2024; cuff loading evidence"},{"id":6,"name":"Wall push-up plus (serratus)","cat":"Scapular control - serratus","muscles":"Serratus anterior; secondary: Chest, core","purpose":"Teach the shoulder blade to hug the ribcage - the missing link in many painful pressing shoulders.","equipment":"Wall","setup":"Standing push-up position against wall. Hands on the wall at shoulder height/width, feet back so the body leans in at ~30 degrees.","startpos":"Body in one line, ribs down, light brace.","exec":"1) Do a slow wall push-up. 2) At the TOP, keep the elbows straight and push the upper back away from the wall an extra few centimetres, letting the shoulder blades slide around the ribs ('the plus'). 3) Pause 2 s, let the blades come back, repeat.","breathing":"Exhale on the push and the plus.","rom":"Full comfortable push-up + the extra protraction.","progression":"Steeper angle (hands on bench) -> knees push-up plus -> quadruped scap push-up.","regression":"Just the 'plus' part, no push-up.","alternative":"Quadruped scapular push-up.","errors":"Sagging hips; shrugging; bending elbows during the plus.","lumbar":"Pain-free arc only. Brace keeps the body plank-straight.","shoulder":"Builds the upward-rotation support painful shoulders lack; keep the range comfortable.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Cools 2013; serratus rehab literature"},{"id":7,"name":"Dead bug","cat":"Core - anti-extension","muscles":"Deep abdominals (transverse, rectus); secondary: Hip flexors","purpose":"Teach the ribs and pelvis to stay connected while the legs move - the anti-arching skill used in pressing.","equipment":"Mat","setup":"Lying on back, arms up, hips and knees at 90/90. Lower back gently in contact with the floor (natural, not forced flat), arms reaching to the ceiling.","startpos":"Brace so the back's contact with the floor does not change.","exec":"1) Slowly lower the RIGHT heel to tap the floor while the left stays up (option: lower the opposite arm overhead at the same time). 2) The lower back must not peel up or press down. 3) Return, swap sides. Alternate for the prescribed reps.","breathing":"Exhale slowly as the leg lowers.","rom":"Only as far as the back stays quiet - shorten if it arches.","progression":"Heel taps -> straight-leg lowers -> arm+leg together -> light band between hands and feet.","regression":"Smaller range; feet taps closer to the body.","alternative":"90/90 breathing with heels on a chair.","errors":"Back arching off the floor; holding breath; moving fast.","lumbar":"Range is dictated entirely by back stillness. Trains exactly the control that stops the back arching under presses and carries.","shoulder":"Arms can stay vertical if overhead movement irritates the shoulders.","leftleg":"Note any control difference when the LEFT leg lowers; do a couple of extra left reps if it lags.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Anti-extension core literature; Martuscello 2013"},{"id":8,"name":"Standing segmental roll-down (unloaded flexion)","cat":"Flexion ladder - step A","muscles":"Spinal mobility (segmental flexion), hamstrings; secondary: abdominals","purpose":"Step A of restoring normal bending. Your physio has cleared full flexion; this teaches the spine to bend one segment at a time with no load, rebuilding tolerance and confidence. Evidence shows bending itself is not the enemy - unpractised bending is.","equipment":"None","setup":"Standing, feet hip-width, knees soft. Stand tall, arms relaxed, knees very slightly bent.","startpos":"Chin to chest to start the movement.","exec":"1) Slowly roll down from the top: chin, then upper back, then mid back, then lower back, letting the arms hang, one segment at a time (4-5 s down). 2) Go only as far as it feels easy - hanging is fine, straining is not. 3) Pause 2 breaths at the bottom, relaxed, no bracing. 4) Roll back up from the bottom: tuck the tailbone, stack the lower back, then mid, then upper back, head last (4-5 s up).","breathing":"Breathe out on the way down, in at the bottom, out on the way up. Deliberately NO bracing - this is about relaxed movement.","rom":"Comfortable; increases week by week.","progression":"Add range -> add a 5 s bottom pause -> progress to the bodyweight Jefferson curl (Step B) after >=1 week with next-morning symptoms at or below your normal and no leg symptoms.","regression":"Seated roll-down on a chair; smaller range.","alternative":"Cat-camel (full range).","errors":"Bending from the hips only (stiff spine); bracing hard; rushing; bouncing at the bottom.","lumbar":"Advance the ladder one step per week at most. Loaded flexion never happens on the same day as heavy hinge work.","shoulder":"None.","leftleg":"None.","stop":"Stop at any leg symptom (tingling, numbness, pain below the buttock) or sharp back pain; drop back one step for a week.","source":"Saraceni 2020 SR (flexion not a proven LBP risk); RESTORE 2023 Lancet (graded exposure to bending); physio clearance"},{"id":9,"name":"Machine chest press (neutral or moderate grip)","cat":"Hypertrophy - horizontal press","muscles":"Chest (pectorals); secondary: Front deltoids, triceps","purpose":"Main chest builder with the back supported and the load path fixed - maximum stimulus, minimum spine and shoulder stress.","equipment":"Chest press machine","setup":"Seated, back on pad. Set the seat so the handles sit at mid-chest height. Choose the neutral (palms-facing) grips if available - they are kinder to the shoulders. Sit with head, upper back and hips on the pad, feet planted.","startpos":"Shoulder blades gently pulled back and down INTO the pad, holding them there for the whole set. Grip at moderate width (hands roughly in line with the shoulders, not wider than ~1.5 shoulder widths).","exec":"1) Brace lightly, exhale and press the handles until the arms are long but elbows not slammed straight. 2) Squeeze the chest 1 s. 3) Lower slowly (3 s) until a comfortable stretch crosses the chest - stop short of any shoulder pinch. 4) Press again without bouncing.","breathing":"Exhale on the press, inhale on the lower; keep a light brace so the lower back does not arch off the pad.","rom":"Deep as comfortable into the chest stretch, elbows stopping around body line if shoulders are cranky.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: floor-supported DB press.","alternative":"Flat dumbbell press (feet up, back flat) or push-up variations.","errors":"Shoulders rolling forward off the pad; bouncing at the stretch; arching the lower back; flaring elbows fully wide.","lumbar":"Blades back-and-down on the pad; stretch, don't pinch. Back stays in full contact with the pad; no arch-pressing.","shoulder":"Neutral/moderate grip and a controlled depth are your two shoulder levers; use the pain rule (<=5/10, settled by morning).","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Haugen 2023 machine equivalence; grip-width shoulder loads (2024 modelling)"},{"id":10,"name":"Incline dumbbell press (30 degrees)","cat":"Hypertrophy - incline press","muscles":"Upper chest; secondary: Front deltoids, triceps","purpose":"Upper-chest emphasis with dumbbells letting each shoulder find its own comfortable path.","equipment":"Adjustable bench at ~30 degrees, dumbbells","setup":"Seated-lying on incline bench. Bench at ~30 degrees. Sit with DBs on thighs, kick them up one at a time as you lie back. Feet flat and wide, head/shoulders/hips on the bench.","startpos":"DBs over the upper chest, palms turned slightly in (between neutral and forward - pick the angle that feels smoothest), blades back and down.","exec":"1) Lower both DBs slowly (3 s) out-and-down until a comfortable stretch crosses the upper chest, elbows at ~45-60 degrees from the body. 2) Press up and slightly in until arms are long, DBs close but not clanging. 3) Repeat. To finish the set, lower the DBs to the thighs and sit up - never drop them from the top.","breathing":"Exhale up, inhale down, light constant brace.","rom":"To comfortable stretch; shoulder pain caps depth.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: machine press or lower incline.","alternative":"Machine incline press; low-incline DB press (15 degrees).","errors":"Arching the lower back off the bench; elbows flaring to 90 degrees; clanging DBs; sloppy set-down.","lumbar":"The get-up and get-down with DBs is a real injury moment - use the thigh kick-up technique every time. Feet planted, lower back gently on the pad - do not arch-bridge to press more.","shoulder":"Adjust palm angle freely; slight tucking of elbows usually clears pinching.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Pressing angle tolerance strategy; RCRSP loading rules"},{"id":11,"name":"Cable fly (mid/low, stretched position)","cat":"Hypertrophy - chest isolation","muscles":"Chest (pectorals); secondary: front deltoids","purpose":"Constant-tension chest isolation with a loaded stretch at the start of every rep - the position where growth is cheapest.","equipment":"Cable crossover, D-handles at chest height (or low)","setup":"Standing in the middle, split stance. Handles at chest height. Grab both, step forward into a split stance until the cables pull the arms back into a chest stretch.","startpos":"Slight elbow bend locked in, chest tall, blades set, brace.","exec":"1) Bring the hands together in a wide hug until they meet in front of the chest. 2) Squeeze 1 s. 3) Open slowly (3 s) into a comfortable deep stretch - stop short of any front-shoulder pinch. 4) Repeat without letting the stacks crash.","breathing":"Exhale as the hands come together.","rom":"Deep stretch, capped by shoulder comfort.","progression":"+2.5 kg when all sets hit 15 reps at target RIR; final set may be a drop set from Week 9.","regression":"Pec-deck with the range limiter set shorter.","alternative":"Pec-deck fly.","errors":"Bending/straightening the elbows (pressing); shrugging; letting the stacks slam; arching the back.","lumbar":"Split stance + brace keeps the back quiet.","shoulder":"Set the start position slightly forward of full stretch if the shoulder pinches.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm.","source":"Long-length training principle (Wolf 2025 SR - inferential for chest)"},{"id":12,"name":"Dumbbell lateral raise","cat":"Hypertrophy - side delts","muscles":"Side (lateral) deltoids; secondary: Traps","purpose":"Direct side-delt size - the width-builder - with tiny joint stress when done strictly.","equipment":"Light dumbbells","setup":"Standing (or seated on amber back days). Stand tall, soft knees, ribs down, DBs by the sides, palms in.","startpos":"Slight forward tilt of the torso (5-10 degrees), light brace.","exec":"1) Raise both arms out to the sides, elbows very slightly bent, LEADING WITH THE ELBOWS, until the upper arms are roughly parallel with the floor (hands no higher than shoulders). 2) Pause 1 s. 3) Lower slowly (3 s) resisting the drop. 4) No swinging - if you must swing, the DBs are too heavy.","breathing":"Exhale up.","rom":"To shoulder height; below any pinch point.","progression":"Double progression 10->15 reps then +1-2 kg (small jumps; this move punishes big jumps).","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: cable lateral raise from behind the body.","alternative":"Cable lateral raise; machine lateral raise.","errors":"Shrugging; swinging the torso; hands above shoulders; thumbs pointing hard down (can pinch).","lumbar":"Keep thumbs level or slightly up if any pinch. Seated version on any amber back day.","shoulder":"Usually well tolerated even by cranky shoulders below shoulder height; a staple here.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Delt hypertrophy convention; shoulder-safe arcs"},{"id":13,"name":"Half-kneeling hip flexor stretch with pelvic tilt (PNF)","cat":"Flexibility - hip flexors","muscles":"Hip flexors (iliopsoas, rectus femoris); secondary: glute of the kneeling side","purpose":"The version that actually works: the posterior pelvic tilt is what stretches the hip flexor - the neutral-pelvis version did nothing in the trial. Hip extension you gain here stops the lower back borrowing motion.","equipment":"Mat or cushion","setup":"Half-kneeling, one knee on the cushion. LEFT knee on the cushion, right foot flat in front, both knees ~90 degrees. Hand on a post if needed.","startpos":"Tall torso, ribs down.","exec":"1) Squeeze the kneeling-side glute HARD and tuck the tailbone under (posterior tilt) - you should already feel the front of the hip. 2) Shift forward 2-5 cm only. 3) Hold 30-45 s breathing slowly. 4) PNF: at the halfway point, gently push the kneeling knee into the floor (contract the hip flexor at ~30%) for 6 s, relax, and sink slightly deeper. 5) Swap sides.","breathing":"Slow breathing; exhale as you sink.","rom":"Gentle-to-moderate stretch (4-6/10), never a back arch.","progression":"Longer holds (to 60 s); add an overhead reach on the same side; raise the rear foot on a bench (couch stretch) from Week 6.","regression":"Standing hip flexor stretch hands on a wall.","alternative":"Standing lunge stretch.","errors":"Arching the lower back instead of extending the hip; lunging too far; losing the tuck.","lumbar":"The tuck and the glute squeeze protect the spine - never skip them.","shoulder":"None.","leftleg":"Kneeling on the left: extra padding if uncomfortable.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Gonzalez-de-la-Flor 2024 (posterior tilt version effective); Ingram 2025 dose; Delphi 2025"},{"id":14,"name":"Cossack squat (adductor/hip mobility under load)","cat":"Loaded mobility - adductors/hips","muscles":"Adductors, glutes, quads; secondary: hamstrings, ankles","purpose":"Opens the inner-thigh line and hip rotation while loading one leg at a time - the best single drill for the wide-stance range you have never had.","equipment":"Bodyweight; later a light kettlebell held at the chest; a post or rack for support","setup":"Standing, very wide stance. Feet about double shoulder-width, toes pointing forward or slightly out. Hold a post or rack upright with one hand at first.","startpos":"Tall chest, weight centred.","exec":"1) Shift the hips toward the RIGHT foot and sit down over it, bending that knee deeply while the LEFT leg straightens and the left toes turn up toward the ceiling. 2) Go only as deep as the heel stays down and the back stays tall; hold 2 s feeling the inner thigh of the straight leg stretch. 3) Push back to the middle, then shift to the other side. 4) Alternate sides.","breathing":"Exhale as you sink into each side.","rom":"Depth grows week by week; keep the working heel down.","progression":"Reduce hand support -> hold a light KB at the chest -> deeper; 2 x 6/side -> 3 x 8/side.","regression":"Shallower shift; both hands on a post; or the adductor rock-back on all fours.","alternative":"Adductor rock-back; side lunge to a box.","errors":"Heel lifting; rounding forward; knee caving inward; bouncing.","lumbar":"Support with a post generously in the first weeks - this is about range, not load.","shoulder":"None.","leftleg":"Sitting over the LEFT leg is the harder side - start there and do an extra rep or two if it is much stiffer.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop at any groin pinch.","source":"Delphi consensus 2025 (loaded full-ROM as mobility alternative); Afonso 2021"},{"id":15,"name":"90/90 hip switch","cat":"Hip mobility - rotation","muscles":"Hip internal and external rotators; secondary: Glutes, adductors","purpose":"Restore hip rotation so twisting tasks come from the hips, not the operated lumbar segment.","equipment":"Mat","setup":"Sitting on the floor. Sit with the left leg in front bent 90 degrees (shin across) and the right leg to the side bent 90 degrees (shin behind).","startpos":"Sit tall on both sit-bones, hands lightly on the floor for support.","exec":"1) Keeping the chest tall, slowly lift both knees and rotate them together to the other side, so the legs swap roles. 2) Move slowly through the middle; let the feet pivot. 3) Pause 2 s each side, feeling the hips - NOT the back - rotate. 8-10 total switches.","breathing":"Exhale during the switch.","rom":"Comfortable; use hands for support as needed.","progression":"Hands off the floor -> hold torso lean over the front shin (Phase 3) -> add reach.","regression":"Lean back on both hands; smaller range.","alternative":"Supine (on back) hip rotations, feet wide.","errors":"Collapsing the chest; forcing knees to the floor; rotating from the waist.","lumbar":"Support with the hands generously in early weeks. Sitting tall keeps the lumbar spine quiet while the hips rotate.","shoulder":"None.","leftleg":"Note if the left hip feels tighter or weaker in the switch; do a couple of extra slow switches toward that side.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Hip-spine relationship SRs 2019"},{"id":16,"name":"90/90 hip lift-offs (active hip rotation)","cat":"Loaded mobility - hip rotation","muscles":"Hip external and internal rotators, glutes; secondary: core","purpose":"Turns the passive 90/90 position into active strength at end range - 'mobility you own' rather than borrowed.","equipment":"Mat","setup":"Sitting in the 90/90 position. Sit with the LEFT leg in front bent 90 degrees, right leg to the side bent 90 degrees, hands lightly on the floor behind you.","startpos":"Sit tall on both sit-bones.","exec":"1) Hold the 90/90 stretch 20 s. 2) Then, hands OFF the floor, lift the front shin/foot off the floor 2-5 cm using the hip muscles and hold 5 s (external-rotation lift-off). 3) Lower. 4) Lift the BACK knee off the floor 2-5 cm and hold 5 s (internal-rotation lift-off). 5) Repeat 3-5 lift-offs each, then switch sides.","breathing":"Exhale on each lift-off.","rom":"Small lift-offs; the height grows as the hips strengthen.","progression":"Longer holds (to 10 s); hands on the head; then combine with Cossack squats.","regression":"Hands on the floor; passive 90/90 holds only.","alternative":"90/90 hip switch.","errors":"Leaning back to cheat the lift; rounding the lower back; forcing knees to the floor.","lumbar":"Sit tall - the lumbar spine stays quiet.","shoulder":"None.","leftleg":"Note which hip lifts less well.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Loaded end-range strength principle (Favro 2025); hip rotation and LBP association"},{"id":17,"name":"Knee-to-wall ankle mobilisation","cat":"Ankle mobility","muscles":"Ankle dorsiflexion (calf, soleus, joint)","purpose":"Free the ankles so squats and stairs stop forcing the back and hips to compensate; doubles as the weekly measurement test.","equipment":"Wall, ruler or tape measure","setup":"Half-kneeling facing a wall. Left foot flat, toes ~8 cm from the wall; right knee on a cushion behind.","startpos":"Front heel firmly down.","exec":"1) Drive the front knee straight toward (or slightly outside) the wall WITHOUT the heel lifting; touch, pause 1 s, return - 10 slow reps per side. 2) LOADED HOLD version (Week 3+): rest a 5-10 kg dumbbell on the front knee and hold the knee at the wall for 30-45 s per side. 3) Every 4 weeks: find the greatest toe-to-wall distance where the knee still touches - record it (target >=10-11 cm; men 40-49 average 11 cm).","breathing":"Natural.","rom":"Heel-down range only.","progression":"Move the foot back 1 cm when 10 easy touches; add the loaded 45 s holds; real change = >=2 cm.","regression":"Move the foot closer to the wall.","alternative":"Standing calf/soleus stretch on a step (gentle).","errors":"Heel lifting; knee diving inward; forcing pain in the front of the ankle.","lumbar":"A pinch at the FRONT of the ankle means back off, not push harder. None.","shoulder":"None.","leftleg":"Expect the left ankle to differ; measure BOTH sides weekly - the gap is a progress marker.","stop":"Stop if front-ankle pinching persists; note it for the physio.","source":"WBLT validity (Hoch 2019)"},{"id":18,"name":"Side plank (progression series)","cat":"Core - anti-lateral-flexion","muscles":"Obliques, quadratus lumborum; secondary: Glute medius, shoulder stabilisers","purpose":"Build the side-core endurance that protects the spine during carries and single-leg work; key left-right symmetry measure.","equipment":"Mat","setup":"Side-lying on forearm. Elbow directly under shoulder, forearm across. PHASE 1 VERSION: knees bent 90 degrees, hips stacked. PHASE 2+: legs straight, feet staggered or stacked.","startpos":"Body in a straight line from head to knees (or feet), free hand on hip.","exec":"1) Brace, then lift the hips until head-shoulder-hip-ankle form a straight line (straight-leg version from Day 1 unless it fails at 15 s - then knees). 2) Hold the prescribed time breathing shallowly - no sagging or rolling. 3) Lower with control, swap sides. LEFT-side-down first; match the right to it. Progressions: feet stacked -> top-leg raised -> long-lever with a band around the knees (Week 7+).","breathing":"Shallow steady breathing during holds.","rom":"Straight-line hold; no movement.","progression":"Straight-leg 20 s -> 45 s -> 60 s -> add top-leg raise -> banded long-lever.","regression":"Shorter holds; back to knees version.","alternative":"Standing suitcase iso-hold against a wall.","errors":"Hips sagging; rolling forward; shoulder shrugging into the ear.","lumbar":"Shoulder must stay packed (pushed away from the ear). Targets quadratus lumborum with minimal disc compression (McGill).","shoulder":"If the support shoulder is irritable, do the wall suitcase iso-hold instead that day.","leftleg":"Track left-down vs right-down hold times weekly - aim within ~10% of each other.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Also stop if shoulder pain exceeds 3/10.","source":"McGill big three + endurance norms 1999"},{"id":19,"name":"Single-leg balance progressions","cat":"Balance / proprioception","muscles":"Foot, ankle, hip stabilisers; balance system; secondary: Core","purpose":"Rebuild the position-sense the nerve compression degraded; measured monthly as a progress test.","equipment":"None (later: pillow/foam)","setup":"Standing near support. Stand tall near a wall or counter (fingertips ready, not gripping).","startpos":"Weight on the LEFT leg, right foot lifted a few centimetres, hands free.","exec":"1) Balance for the prescribed time, eyes OPEN, gaze on a fixed point. 2) Pelvis level, knee soft. 3) Swap legs. Progressions by week: W1-2 eyes open 30-45 s -> W3-4 eyes closed 10-20 s -> W5-6 eyes closed 30 s -> W7-8 eyes closed + slow head turns -> W9+ eyes closed on a folded towel/foam. Target: 30 s eyes closed by Week 8.","breathing":"Natural.","rom":"None.","progression":"Eyes open 45 s -> eyes closed 10 s -> 20 s -> 30 s -> head turns -> soft surface.","regression":"Fingertip support; shorter holds.","alternative":"Tandem stance (heel-to-toe).","errors":"Gripping the support; holding breath; hip sagging.","lumbar":"Always near support; never progress two variables at once. Tall relaxed posture.","shoulder":"None.","leftleg":"Test both sides monthly (eyes open and closed, max 45 s cap); the L-R gap and its trend are key rehab data.","stop":"Stop and note if the left side is suddenly much worse than its own recent normal - that is reportable.","source":"Springer 2007 norms; Senol 2022 proprioception RCT"},{"id":20,"name":"Leg press (45-degree or horizontal)","cat":"Hypertrophy - quads/glutes compound","muscles":"Quadriceps, glutes; secondary: Hamstrings, adductors, calves","purpose":"The programme's main heavy leg builder - big loads for the thighs while the back rests fully supported.","equipment":"Leg press machine","setup":"Seated/reclined, back and hips on pad. Sit in, LOWER BACK AND HIPS PRESSED FULLY INTO THE PAD, feet on the platform hip-to-shoulder width, mid-height placement. Handles gripped lightly.","startpos":"Knees bent ~90 degrees at the start catch (or press to long legs first, machine depending).","exec":"1) Lower the platform slowly (3 s) by bending the knees toward the chest - ONLY as deep as the hips stay glued to the pad. The moment the tailbone starts to curl up off the pad, that is 2 cm past your depth. 2) Pause briefly. 3) Press through the whole foot to long legs WITHOUT slamming the knees straight. 4) Never fully lock and never let the safety catch slam.","breathing":"Inhale lowering, exhale pressing; keep the light brace.","rom":"Depth capped by the pelvis staying on the pad (butt-wink rule).","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 5 kg (or smallest machine increment) and restart at the bottom of the range. Add depth ONLY when the pelvis stays down.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: wall sit or goblet box squat.","alternative":"Hack squat (Phase 3+); goblet squat; wall sit.","errors":"Going so deep the pelvis curls (this flexes the lumbar spine under load - the one error to never make here); locking knees; feet too low (knee stress); half-lowering.","lumbar":"THE depth rule: hips never leave the pad. Have a phone film the first sessions. Best-tolerated heavy leg exercise post-lumbar-surgery WHEN the depth rule is obeyed; it removes axial load entirely.","shoulder":"None.","leftleg":"One-leg-at-a-time sets from Phase 2 (left first, right matches left). The strong right leg WILL try to push harder on two-leg sets - place feet symmetrically and check pressure evenly.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Spine-sparing selection; Haugen 2023; unilateral protocol"},{"id":21,"name":"Single-leg leg press (left priority)","cat":"Hypertrophy - unilateral quads/glutes","muscles":"Quadriceps, glutes (one side); secondary: hamstrings, adductors","purpose":"The left leg cannot hide here. This is the main tool for the extra left-quad volume - research shows cross-education gives the weak side strength but not size, so the left needs its own direct sets.","equipment":"Leg press machine","setup":"Seated/reclined, one foot centred on the platform. Set up as for the two-leg press. Place the LEFT foot centred on the platform, right foot on the floor or resting off the plate.","startpos":"Hips glued to the pad, light brace.","exec":"1) Lower the platform slowly (3 s) as deep as the hips stay on the pad. 2) Pause 1 s. 3) Press through the whole foot to a soft knee. 4) Complete ALL left-leg sets first (including the extra set), then the right does the same reps and load as the left achieved - no more.","breathing":"Inhale lowering, exhale pressing.","rom":"Depth capped by the pelvis staying down.","progression":"Left leg's progression drives both sides: +5 kg when the left hits the top of the range at target RIR for 2 sessions. Right is capped at left's numbers.","regression":"Lighter; shallower; step-ups.","alternative":"Split squat; step-up.","errors":"Hips rolling off the pad; knee caving in; letting the right leg 'help'; skipping the extra left set.","lumbar":"Depth rule as for the two-leg press.","shoulder":"None.","leftleg":"LEFT FIRST, LEFT +1 SET, RIGHT CAPPED. Record left load x reps every session - this number is the programme's headline metric (LSI target >=90% by Week 10).","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Altheyab 2024 (cross-education transfers strength not size); Zhang 2024 (3:1 weak-limb volume halved asymmetry in 10 wk); Kodama 2025 LSI"},{"id":22,"name":"Leg extension (machine)","cat":"Hypertrophy - quads isolation","muscles":"Quadriceps","purpose":"Direct quad isolation - the key tool for rebuilding the left thigh because nothing else can compensate.","equipment":"Leg extension machine","setup":"Seated, back on pad. Adjust so the knee joint lines up with the machine's pivot, pad on the lower shin, back firm on the rest. Set the start angle at a comfortable knee bend.","startpos":"Grip the handles lightly, sit tall, light brace.","exec":"1) Straighten the legs fully, pausing 1-2 s at the top squeezing the thighs HARD (the top squeeze is the point). 2) Lower slowly (3 s) to the start. 3) SINGLE-LEG sets: same rules, left leg first, right leg matches the left's reps and load.","breathing":"Exhale extending.","rom":"Comfortable bend to full lockout.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range. Left leg's progression drives both sides.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: TKE band work.","alternative":"Single-leg press top-half; TKE.","errors":"Kicking fast; butt lifting; half lockouts (the left needs FULL lockouts - that is where its deficit lives).","lumbar":"Smooth, full, deliberate lockouts. Back stays on the pad; no arching to heave.","shoulder":"None.","leftleg":"THE left-quad rebuilder. ALWAYS single-leg here from Week 1. Left first; right performs the left's reps/load only. Left gets the extra set when prescribed.","stop":"Stop at sharp knee pain or any leg tingling/numbness - record it.","source":"Unilateral atrophy protocol; L3-root quad focus (Ghahreman 2002)"},{"id":23,"name":"Standing calf raise (machine or single-leg DB)","cat":"Hypertrophy - calves (gastroc)","muscles":"Gastrocnemius; secondary: Soleus","purpose":"The straight-knee calf builder - pairs with the seated version for complete calves.","equipment":"Standing calf machine, or step + DB + rail","setup":"Standing, balls of feet on edge. Machine: shoulders under pads, balls of feet on the step. DB version: LEFT foot on the step edge, right foot hooked behind the left ankle, right hand holding the rail, DB in the left hand.","startpos":"Deep comfortable heel drop (stretch), knee straight but not slammed.","exec":"1) Rise as high as possible onto the toes. 2) Pause 2 s. 3) Lower slowly (3 s) into the stretch, pause 2 s. 4) Single-leg version: all reps left, then right matches left.","breathing":"Exhale up.","rom":"Full stretch to full rise.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Leg-press calf raise (very back-friendly).","errors":"Bouncing; bent knees (turns it into the seated version); tiny range.","lumbar":"Hold the rail - balance is not the goal here, calf loading is. Machine pads load the spine lightly - use the leg-press calf raise instead on any amber back day.","shoulder":"None.","leftleg":"Left first, always. The left calf is on the weekly tape measure.","stop":"Stop at Achilles pain; note any left-calf cramping or 'dead' feeling (possible neural sign - record it).","source":"Calf coverage; leg-press variant for spine-sparing"},{"id":24,"name":"Open-book thoracic rotation","cat":"Mobility","muscles":"Mid-back (thoracic) rotation; secondary: Chest, neck","purpose":"Keep the mid-back moving so the lower back and shoulders are not forced to compensate.","equipment":"Mat, pillow","setup":"Side-lying, knees stacked and bent to 90 degrees. Lie on your side, pillow under head, knees together at 90/90, arms straight in front, palms together.","startpos":"Knees pressed lightly together (they must stay together throughout).","exec":"1) Slide the top hand along the bottom arm, then open the top arm up and across toward the floor behind you, letting the mid-back and head rotate. 2) Keep both knees glued together so the rotation comes from the MID-back, not the lower back. 3) Pause 2 breaths at a comfortable end point, return. 6 slow reps per side.","breathing":"Exhale as you open.","rom":"Comfortable range; the knees staying together caps lumbar rotation automatically.","progression":"Slightly greater range and longer pauses over the weeks.","regression":"Simply reach the top arm to the ceiling and slightly back.","alternative":"Seated rotations with arms crossed.","errors":"Letting the top knee lift (that shifts rotation into the lower back); forcing the arm to the floor.","lumbar":"Knees together is the non-negotiable safety rule here. Designed to rotate the mid-back while sparing the operated segment.","shoulder":"Stay short of any shoulder pinch; a folded towel under the top arm's landing zone helps.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Hip/thoracic-spine compensation literature"},{"id":25,"name":"Wall thoracic extension (hands on wall)","cat":"Thoracic mobility","muscles":"Thoracic extension, lats, shoulders","purpose":"Ten minutes a day of thoracic extension work cut shoulder disability by a fifth to a third in a trial - the cheapest shoulder helper there is.","equipment":"Wall","setup":"Standing facing a wall, hands on it at shoulder height. Stand an arm's length from the wall, hands flat on it shoulder-width at about head height.","startpos":"Feet hip-width, ribs down.","exec":"1) Walk the feet back and hinge at the hips so the arms straighten and the chest sinks toward the floor, letting the upper back extend and the head fall between the arms. 2) Keep the lower back neutral (ribs down, no arching) - the bend is in the UPPER back and shoulders. 3) Hold 3 breaths, come up, repeat 8-10 times.","breathing":"Long exhales as you sink.","rom":"Gentle; upper back only.","progression":"Lower the hands on the wall over the weeks; add a 5 s hold.","regression":"Hands higher on the wall; smaller sink.","alternative":"Foam-roller thoracic extension.","errors":"Arching the lower back; shrugging; locking the elbows hard.","lumbar":"Ribs down = lumbar stays out of it.","shoulder":"Stop before any front-shoulder pinch.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm.","source":"Park 2020 pilot RCT (thoracic extension + shoulder exercise); JSES 2026 RCT"},{"id":26,"name":"Band pull-apart","cat":"Scapular endurance","muscles":"Mid-traps, rear deltoids; secondary: Rotator cuff","purpose":"High-rep, low-stress posture and shoulder-health work; perfect warm-up and filler.","equipment":"Light resistance band","setup":"Standing. Hold the band at shoulder height, hands shoulder-width, palms down or thumbs up (thumbs-up is shoulder-friendlier).","startpos":"Tall, ribs down, arms long.","exec":"1) Keeping arms straight, pull the hands apart until the band touches the chest, squeezing the shoulder blades together. 2) Pause 1 s. 3) Return with control - do not let the band snap back.","breathing":"Exhale as you pull apart.","rom":"Full spread to chest touch, pain-free.","progression":"15->20 reps, then thicker band.","regression":"Partial range.","alternative":"Reverse pec-deck very light.","errors":"Shrugging; bending elbows; arching the back.","lumbar":"Very low risk. Ribs down prevents back arching.","shoulder":"A daily 'vitamin' for cranky shoulders.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Scapular loading literature"},{"id":27,"name":"Cable face pull (rope)","cat":"Scapular / rear shoulder strength","muscles":"Rear deltoids, mid/lower traps; secondary: Rotator cuff (external rotators)","purpose":"Pull-apart strength at the back of the shoulders to balance all pressing; among the best tolerated shoulder builders.","equipment":"Cable with rope, set at upper-chest/eye height","setup":"Standing, split stance. Rope at eye height. Grab the rope ends thumbs-toward-you, step back until the stack lifts, split stance, ribs down, light brace.","startpos":"Arms long, shoulder blades relaxed forward.","exec":"1) Pull the rope toward the bridge of the nose, elbows high and WIDE, until hands finish beside the ears with the upper arms in line with the shoulders. 2) At the end, the shoulder blades squeeze together and the fists rotate slightly up (like flexing biceps). 3) Pause 1 s, return slowly.","breathing":"Exhale on the pull.","rom":"Full comfortable pull; no neck poking forward.","progression":"Double progression 12->15 then +2.5 kg.","regression":"Band pull-apart.","alternative":"Reverse pec-deck; band face pull.","errors":"Turning it into a row (elbows low); leaning back; jerking.","lumbar":"Smooth and controlled; the neck stays tall. Split stance + brace keeps the back quiet.","shoulder":"Usually the FIRST pulling exercise to feel good on cranky shoulders; keep it in every week.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Cools 2013; RCRSP loading"},{"id":28,"name":"Incline Y-T-W raises","cat":"Scapular control / posterior shoulder","muscles":"Lower trapezius, mid trapezius, rear deltoids; secondary: Rotator cuff","purpose":"Balanced strength for the muscles that anchor the shoulder blade in every press and pull.","equipment":"Incline bench (30-45 degrees), very light DBs or none","setup":"Chest-supported face-down on incline bench. Chest on the pad, feet planted, arms hanging, neck long (nose toward the pad).","startpos":"Shoulder blades gently drawn down away from the ears.","exec":"1) 'Y': raise both arms up-and-out at ~45 degrees, thumbs up, to shoulder line height. Lower. 2) 'T': raise straight out to the sides, thumbs up. Lower. 3) 'W': pull elbows down and back, squeezing the blades, hands making a W. Lower. That trio = 1 rep. Move slowly; the chest stays on the pad.","breathing":"Exhale on each raise.","rom":"To body line; never force height.","progression":"8->12 trios, then +1 kg.","regression":"One letter at a time; smaller range.","alternative":"Band pull-aparts + band W.","errors":"Shrugging; throwing the weights; lifting the chest off the pad.","lumbar":"Light is right - these muscles respond to precision, not load. Chest support removes all lumbar load - ideal post-surgery.","shoulder":"Cornerstone scap-control drill; skip any letter that pinches and note it.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Cools 2013; scapular loading evidence"},{"id":29,"name":"Pallof press (anti-rotation)","cat":"Core - anti-rotation","muscles":"Obliques, deep core; secondary: Glutes, shoulders","purpose":"Resist twisting forces - the skill that protects the spine in carries, rows and daily life.","equipment":"Cable at chest height or band on a rack","setup":"Half-kneeling (Phase 1-2) then standing/split stance. Anchor at chest height. Half-kneel side-on to the anchor, inside knee down, cushion under knee. Hold the handle with both hands at the chest.","startpos":"Tall, ribs down, brace; the cable wants to twist you toward the anchor.","exec":"1) Press the hands slowly straight out from the chest until the arms are long. 2) Hold 3 s while the torso stays perfectly square. 3) Return to the chest with control. Complete all reps, then face the other way. Do the side that is HARDER to resist first (usually pressing away with the left side loaded).","breathing":"Exhale during the press-out; keep the brace.","rom":"Arms chest-to-long.","progression":"Double progression 8->12 reps then +2.5 kg; progress half-kneeling -> tall-kneeling -> standing -> split stance.","regression":"Shorter press-out; lighter band.","alternative":"Band anti-rotation hold (static).","errors":"Twisting toward the anchor; shrugging; arching.","lumbar":"Smooth press, no jerk. Anti-rotation without any spinal movement - ideal post-surgery core loading.","shoulder":"Keep hands at mid-chest; lower anchor slightly if shoulders complain.","leftleg":"Half-kneeling on the left knee doubles as left-hip loading.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Anti-rotation core evidence; McGill"},{"id":30,"name":"Back-extension isometric hold (45-degree bench)","cat":"Trunk endurance - extensors","muscles":"Spinal erectors, glutes, hamstrings","purpose":"Rebuild extensor endurance - low endurance here predicts poor tolerance of loaded lifting.","equipment":"45-degree back-extension bench","setup":"Face down on the bench, pads at the hip crease. Adjust pads so the hip crease is free to bend above the pad edge. Anchor feet.","startpos":"Body in one straight line from head to heels, arms crossed on chest, neutral neck.","exec":"1) Hinge down a FEW degrees only, then return to the straight line. Phase 2 version: simply HOLD the straight line for the prescribed time. 2) Never lift beyond the straight line (no arching up past horizontal-line of the body). 3) Lower by hinging at the hips with control to rest.","breathing":"Shallow steady breathing during holds; no breath-holding.","rom":"From straight body to slightly below; NO hyperextension.","progression":"15 s -> build toward 60+ s across phases; then small ROM reps; hold a light plate at the chest in Phase 4.","regression":"Shorter holds; or glute bridge holds on the floor instead.","alternative":"Bird-dog holds (both legs alternating).","errors":"Arching past the straight line; hanging into full flexion between reps; jerky movement.","lumbar":"Weeks 1-2 version; replaced by the full-range extension from Week 3.","shoulder":"None.","leftleg":"Drive evenly through both legs into the footplate.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Biering-Sorensen literature; Aasa 2015 gating"},{"id":31,"name":"Chest-supported row (machine or incline DB)","cat":"Hypertrophy - horizontal pull","muscles":"Lats, mid-back (rhomboids, mid-traps); secondary: Rear delts, biceps, forearms","purpose":"The programme's main back-thickness builder - full rowing stimulus with the spine completely unloaded by the chest pad.","equipment":"Chest-supported row machine, or incline bench + DBs","setup":"Chest on pad, feet planted. Set the pad so the handles are reachable at full arm stretch. Chest firm on the pad, feet braced.","startpos":"Arms long, blades relaxed forward (full stretch), neutral or overhand grip - neutral is shoulder-friendlier.","exec":"1) Drive the elbows back along the body line until the hands reach the lower ribs, squeezing the blades together. 2) Pause 1 s. 3) Return slowly (3 s) to the full stretch, letting the blades glide forward WITHOUT the chest leaving the pad. 4) No heaving - the chest pressed to the pad is the honesty test.","breathing":"Exhale on the pull.","rom":"Full stretch to full squeeze.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: single-arm DB row with bench support.","alternative":"Incline-bench DB row; seal row.","errors":"Chest lifting off the pad; shrugging; half-range stroking; wrist curling.","lumbar":"If the chest leaves the pad, the set is over. THE spine-safe row: the pad absorbs what a bent-over row would send to your disc.","shoulder":"Neutral grip, elbows ~45 degrees from the body; stop range short of any front-shoulder pinch.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Haugen 2023; spine-sparing selection principle"},{"id":32,"name":"Lat pulldown (neutral grip)","cat":"Hypertrophy - vertical pull","muscles":"Lats; secondary: Biceps, mid-back, rear delts","purpose":"Back width with a stretch-loaded overhead position - the safe stand-in for pull-ups until later phases.","equipment":"Lat pulldown station, neutral-grip bar or D-handles","setup":"Seated, thighs under pads. Thigh pads snug. Grab the neutral-grip handles (palms facing) at just-outside-shoulder width.","startpos":"Arms long overhead, feeling the lats stretch, slight backward lean (10-15 degrees) held constant, chest proud, light brace.","exec":"1) Pull the handles down to the top of the chest, driving the elbows down-and-back. 2) Squeeze the lats 1 s. 3) Return slowly (3 s) to the full overhead stretch, letting the blades rise at the top. 4) The torso angle must not change - no swinging back.","breathing":"Exhale on the pull down.","rom":"Full stretch at top to upper-chest at bottom.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: single-arm kneeling cable pulldown.","alternative":"Assisted pull-up machine (Phase 3+); single-arm pulldown.","errors":"Swinging the torso; pulling behind the neck; half-range reps; death-gripping.","lumbar":"Overhead position should stretch the lats, not pinch the shoulders - neutral grip usually solves it. Constant torso angle + brace; no lumbar heaving for extra reps.","shoulder":"Neutral grip is the friendliest vertical pull; if any pinch overhead, shorten the top range slightly.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Vertical pull selection; grip modification evidence"},{"id":33,"name":"Reverse pec-deck (rear delts)","cat":"Hypertrophy - rear delts","muscles":"Rear deltoids; secondary: Mid-traps, rotator cuff","purpose":"Direct rear-delt size, fully supported, zero spine load - the pressing shoulder's best friend.","equipment":"Pec-deck machine set to reverse-fly","setup":"Seated facing the pad. Handles to the rear-fly position. Sit facing the pad, chest against it, feet planted.","startpos":"Arms long forward holding the handles at shoulder height, palms in or down, slight elbow bend.","exec":"1) Sweep the arms out and back in a wide arc, leading with the pinkies/elbows, until the arms are just behind the body line, squeezing the rear shoulders and blades. 2) Pause 1 s. 3) Return slowly, letting the blades glide forward for a stretch.","breathing":"Exhale on the sweep back.","rom":"Full sweep to just-behind-body; no jerking.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Chest-supported DB rear fly on incline bench; band pull-apart.","errors":"Turning it into a row (bending elbows); bouncing; shrugging.","lumbar":"Chest stays glued to the pad. Chest support removes lumbar involvement entirely.","shoulder":"Rear-delt and cuff-friendly; nearly always green even on cranky days.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Rear delt/scap balance; RCRSP"},{"id":34,"name":"Dumbbell shrug (seated or standing)","cat":"Hypertrophy - traps","muscles":"Upper trapezius; secondary: Grip/forearms","purpose":"Direct upper-trap size with a simple, spine-quiet vertical pull of the shoulders.","equipment":"Dumbbells; bench for seated option","setup":"Standing tall (seated on amber back days). DBs at the sides, palms in. Seated version: sit on a bench, DBs beside the hips.","startpos":"Tall, ribs down, light brace, arms long and relaxed.","exec":"1) Pull the shoulders STRAIGHT UP toward the ears as high as they go. 2) Squeeze hard 2 s. 3) Lower slowly (3 s) into a comfortable stretch. 4) No rolling the shoulders - straight up and down only.","breathing":"Exhale up.","rom":"Full shrug height to gentle stretch.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable shrug; trap-bar hold shrug (Phase 4).","errors":"Rolling; bending elbows; jutting the chin; bouncing.","lumbar":"Straight vertical path only. Seated version removes lower-body sway on amber days.","shoulder":"Usually fine even for cranky shoulders (no arm elevation).","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Trap hypertrophy convention"},{"id":35,"name":"Supine hamstring PNF stretch with strap","cat":"Flexibility - hamstrings","muscles":"Hamstrings; secondary: calves, sciatic nerve mobility","purpose":"Contract-relax stretching is at least as effective as static and gets the hamstring length you have never had - while keeping the recovering nerv
