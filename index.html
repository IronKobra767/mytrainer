e calm.","equipment":"Strap, belt or towel; mat","setup":"Lying on back. Loop the strap around the LEFT mid-foot, other leg bent with foot flat.","startpos":"Head down, shoulders relaxed, slight bend in the knee.","exec":"1) Raise the leg until a moderate stretch appears in the back of the thigh (5-6/10, no tingling). 2) Hold 20 s. 3) PNF: push the leg DOWN into the strap (contract the hamstring at ~30% effort) for 6 s. 4) Relax, breathe out, and take the leg a little higher. 5) Hold 30 s more. Swap legs.","breathing":"Slow; exhale as you take up slack.","rom":"Moderate stretch; never into nerve symptoms (tingling, buzzing, electric).","progression":"Straighter knee over the weeks; longer final hold (to 45 s); add ankle dorsiflexion at the end (Week 6+) if no nerve symptoms.","regression":"More knee bend; smaller range; the gentle strap stretch from Programme 1.","alternative":"Standing hamstring stretch on a box with a long spine.","errors":"Cranking the leg; locking the knee; stretching into tingling; pelvis lifting off the floor.","lumbar":"Pelvis and lower back stay heavy on the floor.","shoulder":"None.","leftleg":"Left leg first; if the left is more sensitive, stay gentler there and record it.","stop":"ANY tingling, numbness or electric sensation = stop and note it in the diary.","source":"Konrad 2024 (PNF = static > dynamic); Ingram 2025; neural mobilisation literature"},{"id":36,"name":"Adductor rock-back","cat":"Hip mobility - adductors","muscles":"Adductors (inner thigh); secondary: Hip flexors","purpose":"Open the inner-thigh line so squatting width and depth stop stealing motion from the spine.","equipment":"Mat","setup":"Hands and knees, one leg out to the side. From all-fours, straighten the left leg directly out to the side, foot flat on the floor pointing forward.","startpos":"Neutral spine, hands under shoulders.","exec":"1) Slowly rock the hips BACK toward the heel of the kneeling leg until a gentle stretch runs along the straight leg's inner thigh. 2) Pause 2 s. 3) Rock forward to the start. 8-10 slow rocks, then swap legs.","breathing":"Exhale as you rock back.","rom":"To a gentle 3-4/10 stretch; the back stays flat - do not tuck or round.","progression":"Slightly deeper range over weeks; later add a torso turn toward the straight leg.","regression":"Smaller rocks.","alternative":"Standing wide-stance side shift holding support.","errors":"Rounding the lower back at the bottom; bouncing.","lumbar":"Keep the movement smooth; the spine does not bend. Rock only within the range your neutral back allows.","shoulder":"Wrists sore? Make fists or use push-up handles.","leftleg":"When the LEFT leg is the straight leg, the stretch may differ - record which side is tighter.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Hip mobility literature"},{"id":37,"name":"Cat-camel (full range)","cat":"Spinal mobility - full range","muscles":"Spinal segmental movement, paraspinals; secondary: abdominals","purpose":"The full-range version now that your physio has cleared full flexion and extension: teaches every spinal segment to move through its whole range with no load.","equipment":"Mat","setup":"Hands and knees. Hands under shoulders, knees under hips.","startpos":"Neutral spine, eyes down.","exec":"1) Slowly round the whole back up toward the ceiling as far as it comfortably goes, tucking the tailbone and dropping the head (3-4 s). 2) Slowly reverse, letting the belly sink, chest lift and tailbone rise into full extension (3-4 s). 3) Move smoothly through the full range; feel each part of the spine join in. 10-12 cycles.","breathing":"Exhale as you round, inhale as you dip.","rom":"Full comfortable range - this is motion, not stretching; no forcing at the ends.","progression":"More cycles; slower; add a 3 s pause at each end.","regression":"Mid-range version (the Programme-1 exercise).","alternative":"Pelvic tilts lying on the back.","errors":"Moving from the hips only; rushing; holding breath.","lumbar":"Motion is the goal. Keep it pain-free.","shoulder":"Flat palms; make fists if wrists complain.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Physio clearance 2026-09; Short 2025 (spine tolerates flexion with a margin of safety)"},{"id":38,"name":"McGill curl-up","cat":"Core - anti-flexion endurance","muscles":"Rectus abdominis, obliques; secondary: Deep neck flexors","purpose":"Build front-core endurance with almost no load on the healing disc.","equipment":"Mat","setup":"Lying on back, one knee bent, one leg straight. Slide both hands, palms down, under the natural arch of the lower back. Bend one knee to about 90 degrees, keep the other leg straight.","startpos":"Elbows resting on the floor, neck long, tongue on the roof of the mouth.","exec":"1) Brace lightly. 2) Lift ONLY the head and shoulders a few centimetres - imagine head and chest rising as one block, the lower back does not flatten or move. 3) Hold ~10 s breathing shallowly. 4) Lower with control. Swap the bent leg halfway through the sets.","breathing":"Shallow breathing during the hold; never hold breath hard.","rom":"Tiny - a few centimetres. This is an endurance hold, not a sit-up.","progression":"Add reps per set (descending pyramid e.g. 5-3-2), then raise the elbows off the floor.","regression":"Shorter holds (5 s), head barely lifting.","alternative":"Dead bug (small range).","errors":"Doing a sit-up; flattening the back onto the hands; jutting the chin.","lumbar":"The hands under the back preserve the neutral arch - that is the point of them. Chosen precisely because it trains the abs while the lumbar spine stays still.","shoulder":"None.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill big three; Martuscello 2013"},{"id":39,"name":"Suitcase carry","cat":"Loaded carry - anti-lateral-flexion","muscles":"Obliques, quadratus lumborum, grip/forearms; secondary: Traps, glute medius","purpose":"Walk tall while one-sided load tries to bend you - real-world spine armour and forearm work in one.","equipment":"One dumbbell or kettlebell; clear 10-20 m walkway","setup":"Standing, weight in one hand. Dumbbell beside the right foot. Hinge at the hips with a braced neutral back, grip, and stand tall.","startpos":"Shoulders LEVEL, both shoulder blades gently set; do not lean away or toward the weight.","exec":"1) Walk slowly and tall for the prescribed distance/time, feet hip-width, eyes ahead. 2) The torso must look identical to unloaded walking - no lean, no hip drop. 3) Set the weight down with the same hip hinge. Swap hands and repeat. Start with the weight in the LEFT hand first each session.","breathing":"Rhythmic shallow breathing over a constant light brace.","rom":"Normal walking.","progression":"+2.5 kg when both sides complete all carries with level shoulders for 2 sessions; or add 10 s.","regression":"Lighter load, shorter distance.","alternative":"Suitcase iso-hold standing still.","errors":"Leaning; shrugging the loaded shoulder; rushing; sloppy pick-up.","lumbar":"The pick-up and set-down are hip hinges - treat them as reps in themselves. Grade A functional anti-lateral-flexion loading; obey the 10 kg-region start.","shoulder":"Loaded shoulder stays down and back; skip on days of shoulder pain >3/10 and do the iso-hold version light.","leftleg":"Watch for hip drop on the left stance phase - it flags glute medius weakness; note it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill carries; graded exposure principles"},{"id":40,"name":"Farmer carry (two hands)","cat":"Loaded carry - full-body","muscles":"Grip/forearms, traps, core; secondary: Glutes, calves","purpose":"Symmetrical carrying strength - the safest 'heavy' feeling early in rehab; builds work capacity and confidence.","equipment":"Two matching dumbbells/kettlebells","setup":"Standing, weight in both hands. Weights beside each foot. Hip-hinge with braced neutral back, grip both, stand tall.","startpos":"Tall, shoulders set, ribs down.","exec":"1) Walk controlled for the prescribed distance/time. 2) Tall posture, smooth steps, no waddling. 3) Hinge to set down. That is one carry.","breathing":"Rhythmic breathing over light brace.","rom":"Normal walking.","progression":"+2.5 kg per hand when posture stays perfect for 2 sessions; or add time.","regression":"Lighter, shorter.","alternative":"Trap-bar hold (no walk) later; suitcase carries.","errors":"Rounding to lift; craning the neck; gripping the floor with the toes.","lumbar":"The floor pick-up is the riskiest moment - hinge properly every time. Axial load through a braced neutral spine, well tolerated and progressive.","shoulder":"Neutral hanging arms are usually shoulder-friendly.","leftleg":"Even push-off both sides; note left calf/quad fatigue difference.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill; loaded carry literature"},{"id":41,"name":"Kettlebell deadlift","cat":"Hinge - loaded (physio-cleared)","muscles":"Glutes, hamstrings; secondary: spinal erectors (isometric), quads, grip","purpose":"Your physio's cleared hinge. It rebuilds the lift-from-the-floor pattern with the load between the feet (shortest lever on the spine) and is the first step of the hinge track: KB -> trap bar -> barbell RDL.","equipment":"One kettlebell (12-32 kg)","setup":"Standing, kettlebell on the floor between the feet. Feet hip-to-shoulder width, toes slightly out, kettlebell handle in line with the ankle bones. Push the hips back and bend the knees until you can grip the handle with both hands, arms straight.","startpos":"Chest up, back in its natural shape, shoulders 'packed' (pull the armpits down), shins near vertical, weight in the mid-foot. Brace.","exec":"1) Push the floor away and drive the hips forward to stand tall in one piece - hips and chest rise together. 2) Squeeze the glutes at the top; do not lean back. 3) Hinge the hips back to lower the bell to the floor under control, keeping it close to the legs. 4) Reset your brace on the floor before every rep (dead-stop reps).","breathing":"Breathe in and set a light brace (20-30% tension around the waist) before each rep; breathe out through the effort. Never hold your breath hard. Exhale through the top half of the lift.","rom":"Floor to standing. If you cannot reach the floor with a neutral back, start the bell on a low box or plates.","progression":"Add 2-4 kg (next bell) when all sets hit the top of the rep range at the target RIR for 2 sessions. When you reach 28-32 kg for crisp sets of 8, move to the trap bar (Week 3+).","regression":"Bell on a box (shorter range); fewer reps; or the dowel hinge drill if the pattern falls apart.","alternative":"Trap-bar deadlift; cable pull-through.","errors":"Rounding at the bottom; squatting it up (knees too far forward); jerking off the floor; leaning back at the top; bell drifting forward away from the legs.","lumbar":"Dead-stop reps with a fresh brace each time; sets capped at 8 so fatigue never bends the spine. Keep the bell in contact with or close to the shins. Never grind a rep.","shoulder":"Shoulders packed, arms straight - shoulder-quiet.","leftleg":"Drive evenly through both feet; if the left leg 'goes missing' at the start, pause and reset.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Next-morning back stiffness above your normal = hold the load one week.","source":"Aasa 2015 / Michaelson 2016 deadlift RCTs (start 10 kg, technique-gated); Tataryn 2021 SR posterior-chain training; physio clearance 2026-09"},{"id":42,"name":"Seated leg curl (machine)","cat":"Hypertrophy - hamstrings","muscles":"Hamstrings; secondary: Calves (slight)","purpose":"The main hamstring builder - the seated version trains them at longer length than lying curls, which grows more muscle.","equipment":"Seated leg curl machine","setup":"Seated, back on pad, thigh pad locked. Knee joint aligned with pivot, pad on the lower calf, thigh pad snug so the hips cannot lift.","startpos":"Legs long in the stretched start, toes pulled up, sit tall.","exec":"1) Curl the heels down-and-under as far as the machine allows, squeezing the hamstrings. 2) Pause 1 s. 3) Return slowly (3 s) to the long-leg stretch WITHOUT letting the stack slam. 4) Single-leg option from Phase 2 (left first, right matches).","breathing":"Exhale curling.","rom":"Full stretch to full curl.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Lying leg curl; slider leg curl (Phase 4).","errors":"Hips lifting off the seat; jerking; short-stroking the stretch.","lumbar":"The thigh pad snugness is the technique. Fully seated and supported - excellent post-op choice.","shoulder":"None.","leftleg":"Left-first single-leg sets when prescribed; hamstrings are less affected by the L3 root but symmetry data still matters.","stop":"Stop at cramping-type pain that does not release, or any nerve symptoms down the leg.","source":"Seated>lying length evidence (Maeo); machine safety"},{"id":43,"name":"Hip thrust (machine or barbell-on-pad)","cat":"Hypertrophy - glutes","muscles":"Gluteus maximus; secondary: Hamstrings, quads","purpose":"The heaviest direct glute loading available with the spine braced horizontal - glute size without spinal compression.","equipment":"Hip thrust machine (preferred) or bench + padded barbell","setup":"Upper back on bench/pad, hips free. Machine: per its pads. Barbell: shoulder blades on a bench edge, padded bar across the hip crease, feet flat hip-width, shins near vertical at the top.","startpos":"Chin tucked, ribs down, brace ON; the torso from ribs to knees will move as one rigid plank.","exec":"1) Drive through the heels and squeeze the glutes to lift the hips until the thighs and torso form one straight line - NO higher; the finish is a glute squeeze, not a back arch. 2) Hold 2 s squeezing hard. 3) Lower with control most of the way and repeat.","breathing":"Exhale hard through the lift; keep ribs down.","rom":"Top = straight line, never over-arched; depth = comfortable.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 5 kg (or smallest machine increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: feet-elevated glute bridge.","alternative":"Glute bridge (floor); cable pull-through.","errors":"Over-arching at the top (the classic error and the one your spine cannot afford); hips shooting up unevenly; heels drifting far forward.","lumbar":"Ribs down + chin tucked + glute-squeeze finish = safe top position, every rep. Horizontal loading spares the discs; the ONLY danger is the over-arch finish - film it weekly.","shoulder":"Pad the bar well; hands steady it only.","leftleg":"Watch for the right hip rising faster - drive evenly; single-leg bridge work covers the gap.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Glute loading with spine-horizontal vector; corrective priority"},{"id":44,"name":"Dumbbell Romanian deadlift","cat":"Hypertrophy - hinge","muscles":"Hamstrings, glutes; secondary: Spinal erectors (isometric), forearms, traps","purpose":"The loaded hinge - hamstring and glute size plus the exact lifting mechanics that protect your back for life.","equipment":"Two dumbbells","setup":"Standing. DBs in front of the thighs, palms facing you (or facing in). Feet hip-width, soft knees.","startpos":"Tall, shoulders set back, ribs down, brace ON - the same brace you drilled with the dowel.","exec":"1) Push the hips straight BACK, letting the DBs slide down the front of the thighs, knees staying softly bent. 2) Continue until a strong hamstring stretch appears with the back keeping its shape (DBs around mid-shin for most). 3) Squeeze the glutes to stand tall - hips finish forward, not back arching. 4) Re-brace EVERY rep.","breathing":"Breathe and brace at the top; exhale through the stand-up. Re-brace EVERY rep.","rom":"Thigh to mid-shin, limited by the back keeping its shape - never forced to the floor.","progression":"+2.5 kg per DB when all sets crisp at target RIR for 2 sessions; RANGE progresses in a separate week from LOAD (never both at once).","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: 45-degree back extension (glute style) or cable pull-through.","alternative":"Cable pull-through; 45-degree hip extension.","errors":"Rounding at the bottom; bending the knees into a squat; jerking off the turn; looking up hard; progressing load and range in the same week.","lumbar":"Loads stay >=2 RIR in this programme. Introduced from Day 1 at light loads (2 x 10-14 kg) because the hinge is now physio-cleared; the trap bar takes over as the heavy hinge from Week 3 and this becomes the hamstring-stretch accessory.","shoulder":"Long arms, set blades - shoulder-quiet.","leftleg":"Even foot pressure; note if the left hamstring stretch feels different (record, do not chase).","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Any next-morning back stiffness above your normal = hold the load 1 week.","source":"Aasa 2015 technique-gated hinge; NIOSH lever/fatigue caution"},{"id":45,"name":"Bird-dog (training version)","cat":"Core - motor control","muscles":"Multifidus, erector spinae, glutes; secondary: Shoulders, abdominals","purpose":"Anti-rotation and spine-stillness under moving limbs; direct retraining for the operated segment's stabilisers.","equipment":"Mat","setup":"Hands and knees. Hands under shoulders, knees under hips, neutral spine.","startpos":"Brace lightly; imagine balancing a water bottle on the lower back.","exec":"1) Slowly extend one arm and the opposite leg to horizontal. 2) Hold 8-10 s, completely still. 3) Sweep the elbow and knee toward each other UNDER the body without touching the floor (Phase 2+), then re-extend. 4) Return and swap. Left leg extended = harder side; start there.","breathing":"Shallow breathing in holds; exhale on transitions.","rom":"Limbs to horizontal; spine still throughout.","progression":"Longer holds -> add the sweep -> hand/foot 'square drawing' -> light ankle weight (Phase 4).","regression":"Leg-only, or arm-only versions.","alternative":"Dead bug.","errors":"Hip hiking/rotating; lumbar arching as the leg lifts; rushing transitions.","lumbar":"If balance fails repeatedly, regress rather than wobble through. A primary rehab drill for the local spinal stabilisers after discectomy.","shoulder":"Keep the supporting shoulder packed.","leftleg":"The left-leg-extended side trains the operated side's chain; do it first and match right-side reps to it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill big three; motor control evidence (Saragiotto 2016)"},{"id":46,"name":"Front plank (progression series)","cat":"Core - anti-extension endurance","muscles":"Abdominals; secondary: Shoulders, glutes, quads","purpose":"Whole-front-line endurance in a spine-neutral position.","equipment":"Mat","setup":"Forearms and toes (Phase 1: forearms and knees). Elbows under shoulders, forearms parallel. Phase 1 uses knees down.","startpos":"Straight line ear-shoulder-hip-knee/ankle; glutes and quads lightly squeezed; brace.","exec":"1) Hold the line for the prescribed time, breathing shallowly. 2) No sagging hips, no hips in the air. 3) Rest and repeat.","breathing":"Shallow steady breathing.","rom":"None - pure hold.","progression":"Toes 30 s -> 60 s -> single-leg lifts 5 s each -> body-saw (Week 5) -> ab-wheel (Week 7).","regression":"Shorter holds, knees down, or incline plank on a bench.","alternative":"Incline plank (hands on bench).","errors":"Sagging; head dropping; breath holding.","lumbar":"End the hold the moment the hips start to sag - that is the set's true end. Neutral held under tension = safe anti-extension work.","shoulder":"Incline version if shoulders are irritable that day.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill; core endurance literature"},{"id":47,"name":"Overhead cable triceps extension (rope)","cat":"Hypertrophy - triceps","muscles":"Triceps long head (stretch-biased)","purpose":"Loads the long head at full stretch - the biggest lever for total triceps size.","equipment":"Cable at chest height, rope","setup":"Standing, facing away from the stack. Anchor the cable at chest height. Grab the rope, turn away, press it overhead, then step forward into a split stance so the cable pulls from behind your head.","startpos":"Elbows beside the ears pointing forward, hands behind the head, triceps stretched, ribs down, brace ON.","exec":"1) Straighten the arms forward-up until fully long, keeping the elbows still. 2) Squeeze 1 s. 3) Bend slowly (3 s) letting the hands travel behind the head into the deep stretch. 4) The ribs stay down - do not arch the lower back as the arms straighten.","breathing":"Exhale as you extend; brace prevents rib flare.","rom":"Deep stretch to lockout.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: lying DB triceps extension.","alternative":"Lying DB triceps extension to forehead level; single-arm overhead cable.","errors":"Elbows flaring wide; lower back arching; bouncing out of the stretch.","lumbar":"The brace and rib-down rule protect the lumbar spine; skip overhead version on amber shoulder days and do lying extensions. If you cannot stop the back arching, switch to the lying version that day.","shoulder":"Requires overhead room - use the lying alternative if shoulders disagree.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Lengthened-position triceps evidence (Maeo)"},{"id":48,"name":"Incline dumbbell curl","cat":"Hypertrophy - biceps","muscles":"Biceps (long head, stretch-biased); secondary: Forearm flexors","purpose":"Biceps loaded in their most stretched position - the highest-yield curl per set.","equipment":"Incline bench ~45-60 degrees, dumbbells","setup":"Seated back on incline bench. Bench at 45-60 degrees. Sit fully back, head and shoulders on the pad, DBs hanging straight down by the sides, palms forward.","startpos":"Arms hanging slightly behind the body line (the stretch), shoulders relaxed down.","exec":"1) Curl both DBs up WITHOUT the elbows drifting forward, squeezing the biceps hard at the top. 2) Pause 1 s. 3) Lower slowly (3 s) to the full hang stretch. 4) The upper arms stay pointing at the floor throughout.","breathing":"Exhale up.","rom":"Full hang to full squeeze.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: seated (upright) DB curl.","alternative":"Cable curl from behind-body low anchor; preacher curl.","errors":"Elbows drifting forward; swinging; cutting the bottom stretch short.","lumbar":"Shoulder relaxed, not stretched painfully at the hang - reduce bench angle if the front of the shoulder complains. Fully supported back - ideal.","shoulder":"If the hang tugs the front of the shoulder, raise the bench angle a notch.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Lengthened-position hypertrophy (stretch-mediated)"},{"id":49,"name":"Cable triceps pressdown (rope)","cat":"Hypertrophy - triceps","muscles":"Triceps (lateral/medial heads)","purpose":"The staple elbow-friendly triceps builder with constant cable tension.","equipment":"Cable, high anchor, rope","setup":"Standing, slight forward lean. Rope at the top. Grip the rope ends, elbows pinned to the sides, feet hip-width, slight hinge, brace.","startpos":"Forearms just above parallel, elbows bent ~90+ degrees.","exec":"1) Press the hands down and slightly apart until the arms are straight, squeezing the triceps hard. 2) Pause 1 s. 3) Let the hands rise with control to just above 90 degrees - elbows never leave the sides.","breathing":"Exhale on the press.","rom":"90+ degrees to straight.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Straight-bar pressdown; band pressdown.","errors":"Elbows flaring/rising; leaning over the stack; shoulders rolling forward.","lumbar":"Elbows glued to the ribs is the whole technique. Slight hinge with brace; no slumping.","shoulder":"Very shoulder-quiet.","leftleg":"None.","stop":"Stop at sharp elbow pain.","source":"Triceps staple; joint-friendly selection"},{"id":50,"name":"Hammer curl (dumbbell)","cat":"Hypertrophy - biceps/forearms","muscles":"Brachialis, brachioradialis (forearm); secondary: Biceps","purpose":"Thickens the arm from the side and builds the forearm - covers what standard curls miss.","equipment":"Dumbbells","setup":"Standing or seated. DBs at the sides, PALMS FACING EACH OTHER (hammer grip).","startpos":"Tall, ribs down, elbows lightly pinned to the sides.","exec":"1) Curl both DBs up keeping the palms facing in, until the thumbs approach the shoulders. 2) Squeeze 1 s. 3) Lower slowly (3 s). 4) No swinging.","breathing":"Exhale up.","rom":"Full.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable rope hammer curl; cross-body hammer curl.","errors":"Swinging; elbows drifting; half reps.","lumbar":"Simple and joint-friendly. Seated on amber back days.","shoulder":"Neutral grip = shoulder-quiet.","leftleg":"None.","stop":"Stop at sharp elbow/wrist pain.","source":"Arm hypertrophy coverage (brachialis/forearm)"},{"id":51,"name":"Single-leg Romanian deadlift (bodyweight -> light kettlebell)","cat":"Balance + hamstring control","muscles":"Hamstrings, glutes (one side); secondary: foot/ankle stabilisers, core","purpose":"Balance, hamstring length and left-leg control in one drill - task-specific balance work transfers far better than wobble boards.","equipment":"None at first; later a light kettlebell (4-12 kg); a wall or rack nearby","setup":"Standing on one leg near support. Stand on the LEFT leg, soft knee, fingertips on a wall or rack. Optional KB in the opposite (right) hand.","startpos":"Tall, hips square, brace lightly.","exec":"1) Hinge at the hip, letting the free (right) leg travel straight back as the chest tips forward, until the torso and back leg are roughly parallel with the floor or the hamstring stretch stops you. 2) The hips stay square - do not let the free hip open to the ceiling. 3) Squeeze the glute to return to standing. 4) All reps on the LEFT, then the right matches the left's reps.","breathing":"Exhale returning to standing.","rom":"To hamstring stretch with a square pelvis - not beyond.","progression":"Remove hand support -> add the KB -> slow to 4 s down -> eyes-closed pause at the top (Week 7+).","regression":"Fingertip support throughout; shorter range; hold onto a rack with both hands.","alternative":"Single-leg glute bridge; lateral step-down.","errors":"Free hip opening upward; back rounding; rushing; the standing knee collapsing inward.","lumbar":"Support beats wobbling - use the wall any day balance is off.","shoulder":"Arms relaxed.","leftleg":"The LEFT stance leg is the priority; it sets the reps.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop and note if the left side is suddenly much worse than its own recent normal.","source":"Lesinski 2015 balance dosing; Lin 2026 task-specific transfer; Senol 2022 proprioception RCT"},{"id":52,"name":"Lateral step-down (low box)","cat":"Left-leg rehab - control","muscles":"Quadriceps, glutes (single leg); secondary: Calves, core","purpose":"Single-leg control under body weight - the bridge between rehab drills and real single-leg strength.","equipment":"Low step or box (10-15 cm to start)","setup":"Standing on the box on one leg. Stand tall on the box on the LEFT leg, right leg hanging off the side, hands out or on light support.","startpos":"Level pelvis, tall chest, left kneecap tracking over the middle toes.","exec":"1) Bend the left knee and hips to lower the right heel slowly toward the floor (3-4 s). 2) Touch the heel lightly - do NOT stand on it. 3) Push back up through the left leg. All reps left, then right matches the left's reps.","breathing":"Exhale on the way up.","rom":"Heel-touch depth; reduce box height if control is poor.","progression":"Higher box (to 20 cm) -> remove hand support -> slow to 5 s lowering -> hold a light DB at chest (Phase 4).","regression":"Lower box; fingertip support; partial range.","alternative":"Sit-to-stand from a high chair, left-leg emphasis.","errors":"Knee collapsing inward; pelvis dropping on the free side; dropping fast; pushing off the bottom foot.","lumbar":"Mirror or phone video is genuinely useful - knee-over-toes line is the thing to watch. Stay tall; no torso side-lean to cheat.","shoulder":"None.","leftleg":"Signature left-leg control exercise; the LEFT working side always goes first and sets the rep count.","stop":"Stop if the knee wobbles uncontrollably, or any back/leg nerve symptom appears.","source":"Unilateral control rehab literature"},{"id":53,"name":"Terminal knee extension with band (TKE)","cat":"Left-leg rehab - quad activation","muscles":"Quadriceps (especially inner portion, VMO)","purpose":"Re-awaken the left quad's last few degrees of straightening - the part nerve compression switches off first.","equipment":"Medium band anchored low (rack/table leg)","setup":"Standing, band behind the knee. Loop the band around a solid anchor at knee height, step the LEFT leg into it so the band sits in the crease behind the knee, then step back until the band is taut. Foot flat.","startpos":"Slight bend in the left knee against the band's pull; hands on hips or light support.","exec":"1) Squeeze the thigh to straighten the knee FULLY, feeling the muscle just above the kneecap switch on. 2) Hold the lockout 3 s, actively squeezing. 3) Let the band bend the knee slightly, repeat. All reps left, then a lighter set right for balance.","breathing":"Exhale on the squeeze.","rom":"Last 20-30 degrees of knee straightening.","progression":"Longer holds -> stronger band -> progress emphasis to leg extensions and step-downs.","regression":"Seated quad squeezes (leg straight, push knee down into a towel, hold 5 s).","alternative":"Seated straight-leg lift with 3 s quad squeeze.","errors":"Letting the hip do the work; not reaching a full, hard lockout; leaning back.","lumbar":"This should burn the thigh gently, nothing more. Stand tall; no back arching.","shoulder":"None.","leftleg":"THE foundational left-quad wake-up drill; also a daily self-test - if the lockout feels weaker than yesterday, flag it (possible neural symptom).","stop":"Stop if knee pain, or any tingling/numbness down the leg - record it.","source":"Quad activation post-radiculopathy; Ghahreman 2002 recovery windows"},{"id":54,"name":"Lateral band walk (monster walk)","cat":"Glute strength - abductors","muscles":"Glute medius, glute max; secondary: Quads","purpose":"Standing, functional version of hip-side strength - keeps knees tracking and pelvis level in squats and stairs.","equipment":"Mini-band","setup":"Standing, band above knees (easier) or at ankles (harder). Band above the knees, feet hip-width, quarter-squat position, chest tall.","startpos":"Tension always on the band; toes forward.","exec":"1) Step the left foot sideways ~20 cm, keeping toes forward and pelvis level. 2) Follow with the right foot, never letting the feet touch (band stays tight). 3) 8-10 steps left, then 8-10 back to the right, staying low throughout.","breathing":"Steady breathing, light brace.","rom":"Small controlled steps.","progression":"Heavier band -> band to ankles -> add a pause on each step.","regression":"Stand taller; band above knees; fewer steps.","alternative":"Standing banded hip abduction holding support.","errors":"Toes turning out; standing up tall between steps; knees caving in.","lumbar":"Burn in the side of the hips is the goal; knee pain is not. Stay tall through the trunk; no side-lean with each step.","shoulder":"None.","leftleg":"Lead with the LEFT foot on the first lap; if the left hip fatigues far sooner, note it in the diary.","stop":"Stop if knee pain or any back/leg symptom appears.","source":"Glute EMG literature; hip-targeted PT MA"},{"id":55,"name":"Clamshell with band","cat":"Glute activation - abductors","muscles":"Glute medius; secondary: Deep hip rotators","purpose":"Strengthen the hip's side stabilisers that keep the pelvis level on one leg - critical for the left side.","equipment":"Mini-band, mat","setup":"Side-lying, knees bent 45 degrees, band just above knees. Lie on your side, hips stacked vertically, heels in line with your bottom, band above the knees.","startpos":"Feet together, light brace so the pelvis cannot roll.","exec":"1) Keeping the feet touching, lift the top knee against the band as far as possible WITHOUT the pelvis rolling backward. 2) Pause 2 s feeling the side of the hip burn. 3) Lower slowly. All reps one side, then swap. LEFT side (left leg on top) first.","breathing":"Exhale as the knee lifts.","rom":"Only the range where the pelvis stays still - usually 20-30 cm.","progression":"Pause longer -> heavier band -> progress to side-lying leg raise then standing band walks.","regression":"No band; smaller range.","alternative":"Side-lying hip abduction (straight leg).","errors":"Rolling the pelvis back to fake range; rushing.","lumbar":"Small honest range beats big cheated range. Pelvis-still rule keeps the spine out of it.","shoulder":"None.","leftleg":"Left side first, right side matches left's reps. Expect a burn difference - track it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Glute activation literature; hip-targeted PT MA 2019"},{"id":56,"name":"Dumbbell split squat (rear-foot-elevated from Week 6)","cat":"Hypertrophy - unilateral squat","muscles":"Quads, glutes (front leg); secondary: Adductors, core, balance","purpose":"The heavy unilateral leg builder - forces the left leg to carry its own load with the spine under half the weight a squat would need.","equipment":"Dumbbells, optional bench (Phase 4)","setup":"Standing split stance. Long split stance, front foot flat, back heel up. DBs at the sides. (Phase 4 option: rear foot on a low bench.)","startpos":"Torso tall with a SLIGHT forward lean, hips square, brace on.","exec":"1) Lower straight down bending both knees until the back knee approaches the floor (or your comfortable depth). 2) Front heel stays heavy; front knee tracks over the toes. 3) Drive up through the front foot. 4) ALL reps LEFT LEG FORWARD FIRST, then right leg matches the left's reps and load.","breathing":"Exhale on the drive up; brace throughout.","rom":"Back-knee-toward-floor depth as control allows.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range. Left side gates all progression.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: split squat holding one hand support, or leg press single-leg.","alternative":"Single-leg press; step-up.","errors":"Front knee caving inward (the left will try); bouncing the back knee off the floor; leaning far forward; short range on the left while full range on the right.","lumbar":"Hold a rail with one hand any day balance is off - support beats wobble. Half the axial load of a squat at equal leg stimulus - exactly why it is here.","shoulder":"DBs hang at sides - shoulder-quiet.","leftleg":"THE flagship left-leg strength exercise of Phases 3-4. Left first, left sets the numbers, +1 set left when prescribed.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop the set if the left knee wobbles uncontrollably.","source":"Unilateral loading for asymmetry; spine-load management"},{"id":57,"name":"Hip adduction machine","cat":"Hypertrophy - adductors","muscles":"Adductors (inner thigh)","purpose":"Direct inner-thigh size - a major (and majorly neglected) contributor to overall leg mass.","equipment":"Adduction machine","setup":"Seated, pads inside knees. Sit tall, set the start width to a COMFORTABLE stretch (not maximal), pads on the inner knees.","startpos":"Legs apart at the set width.","exec":"1) Squeeze the knees together smoothly. 2) Pause 1 s. 3) Return slowly (3 s) to the stretch without slamming. Widen the start position gradually over the weeks as the stretch allows.","breathing":"Exhale squeezing in.","rom":"Comfortable stretch to full close.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range. Widen range as a separate progression.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Copenhagen plank short-lever (Phase 4); cable adduction.","errors":"Starting width too aggressive; jerking; sliding forward.","lumbar":"Set the range limiter modestly in week 1. Seated, supported, safe.","shoulder":"None.","leftleg":"Left-right effort should feel even; note if not.","stop":"Stop at groin pinching or any nerve symptom.","source":"Adductor coverage; lengthened-position principle"},{"id":58,"name":"Hip abduction machine","cat":"Hypertrophy - glute medius/abductors","muscles":"Glute medius, upper glute max","purpose":"Direct abductor size and strength - the upper-glute shelf and the pelvis-levelling muscle in one.","equipment":"Abduction machine","setup":"Seated, pads outside knees. Sit tall, back on the pad, knees inside the pads, feet on the rests.","startpos":"Legs together against the stack's resistance.","exec":"1) Push the knees apart as far as the machine allows, leading from the SIDE of the hips. 2) Pause 2 s at maximum spread. 3) Return slowly (3 s) without the stack touching down. Lean slightly forward for upper-glute bias in later phases.","breathing":"Exhale pushing apart.","rom":"Full available spread.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Banded clamshell/monster walk.","errors":"Jerking; letting the stack slam; sliding the hips forward off the pad.","lumbar":"Simple and safe seated. Seated and supported.","shoulder":"None.","leftleg":"Push evenly - the left side will want to contribute less; focus on it.","stop":"Stop at pinching hip pain.","source":"Abductor coverage requirement; pelvis stability"},{"id":59,"name":"Seated calf raise","cat":"Hypertrophy - calves (soleus)","muscles":"Soleus (deep calf); secondary: Gastrocnemius","purpose":"Builds the deep calf that bent-knee positions expose - half of complete calf development.","equipment":"Seated calf machine (or DBs on knees + step)","setup":"Seated, balls of feet on platform, pads on knees. Balls of both feet on the edge, pads snug on the lower thighs.","startpos":"Heels dropped into a FULL comfortable stretch.","exec":"1) From the deep stretch, press up onto the toes as high as possible. 2) Pause 2 s at the top squeezing. 3) Lower slowly (3 s) into the full stretch and pause 2 s there - the stretch pause is where calves grow. No bouncing, ever.","breathing":"Exhale up.","rom":"Maximum: deep stretch to full tiptoe.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Single-leg DB-on-knee version.","errors":"Bouncing out of the stretch (the universal calf error); partial reps; rushing.","lumbar":"Controlled stretch pauses; nothing else to it. Seated - spine fully quiet.","shoulder":"None.","leftleg":"SINGLE-LEG from Phase 2: left first, right matches. Calf girth is measured weekly - this is the exercise behind that number.","stop":"Stop at Achilles pain or cramping that will not release.","source":"Calf lengthened-position evidence (+14.9% vs 7.3%); L-R tracking"},{"id":60,"name":"Figure-4 glute stretch (lying)","cat":"Flexibility","muscles":"Glutes, deep hip rotators; secondary: Lower back (indirect ease)","purpose":"Release hip tension from the day's training without twisting the spine.","equipment":"Mat or bed","setup":"Lying on back. Both knees bent, feet flat.","startpos":"Cross the left ankle over the right knee.","exec":"1) Reach through and hold the back of the right thigh with both hands. 2) Gently draw the right thigh toward you until a comfortable stretch appears in the left buttock. 3) Keep the tailbone down and back relaxed on the floor. Hold 30-45 s per side, easy breathing.","breathing":"Slow, relaxed.","rom":"Gentle stretch only, 3-4/10 intensity.","progression":"Slightly deeper over the weeks as comfort allows.","regression":"Foot on a wall instead of holding the thigh.","alternative":"Seated figure-4 lean (later phases only).","errors":"Pulling so hard the pelvis lifts and the low back rounds.","lumbar":"Keep the tailbone heavy on the floor to protect the spine. Tailbone stays down = spine stays neutral.","shoulder":"None.","leftleg":"Often tighter or 'different' on the operated side; note asymmetry in the diary.","stop":"Stop if any tingling or radiating symptoms into the leg.","source":"Warneke 2024 stretch dose MA"},{"id":61,"name":"Assessment battery (every 4 weeks)","cat":"Measurement","muscles":"Whole body","purpose":"Objective progress checks so the programme steers on data: girths, mobility, trunk endurance, balance and left-leg strength.","equipment":"Tape measure, phone inclinometer app, wall + ruler, stopwatch, leg press, 45-degree bench","setup":"Various. Do the girths in the morning; the tests at the end of the foundation block.","startpos":"-","exec":"MORNING: bodyweight; chest, waist, arms L/R (flexed), thighs L/R (15 cm above kneecap), calves L/R. GYM: 1) Sit-and-reach (cm, best of 2). 2) Knee-to-wall L/R (cm). 3) Lumbar-locked thoracic rotation L/R (degrees, phone app). 4) Shoulder flexion (degrees). 5) Side plank L/R (s, to technique failure). 6) Back-extension hold on the 45-degree bench (s, max 180) - only if physio-approved. 7) Single-leg stance eyes CLOSED L/R (s, cap 45). 8) Single-leg leg press 8RM L then R (kg). Enter everything in the Metrics tab / check-in notes.","breathing":"-","rom":"-","progression":"Same tape, same landmarks, same device every time. Real change thresholds: knee-to-wall >=2 cm, thoracic rotation >=6 degrees, side plank/extension hold >=20 s, sit-and-reach >=3 cm, girth >=0.5 cm.","regression":"Skip any test that provokes symptoms and note it.","alternative":"-","errors":"Changing devices or landmarks between tests.","lumbar":"Back-extension hold only with physio approval; stop any test at pain >3/10.","shoulder":"Shoulder flexion test: stop below any pinch.","leftleg":"Left-leg 8RM and thigh girth are the headline numbers.","stop":"Stop any test at pain >3/10 or nerve symptoms.","source":"McBride 2026 WBLT norms; Yoshida 2024 thoracic rotation MDC; RehabMeasures (Sorensen, single-leg stance); Kodama 2025 LSI"},{"id":62,"name":"Landmine press (half-kneeling or standing)","cat":"Hypertrophy - shoulder press (shoulder-friendly)","muscles":"Front deltoids, upper chest; secondary: triceps, serratus, core","purpose":"The overhead-press substitute for painful shoulders: the arc travels forward-and-up (not straight overhead), the scapula can move freely and the core works to keep the ribs down.","equipment":"Barbell in a landmine sleeve or wedged in a corner, plates","setup":"Half-kneeling (inside knee down) or standing split stance, bar end at the shoulder. Load the free end. Hold it in one hand at the front of the shoulder, elbow under the wrist. Half-kneel with the SAME-side knee down as the pressing arm.","startpos":"Ribs down, glute squeezed, brace, wrist straight.","exec":"1) Press the bar end up and forward along its natural arc until the arm is long. 2) Pause 1 s. 3) Lower slowly (3 s) to the shoulder. Complete reps, swap sides. Start with the less irritable shoulder.","breathing":"Exhale on the press; keep the brace so the lower back does not arch.","rom":"Pain-free arc; the forward angle is the point.","progression":"+2.5 kg when all sets hit the top of the range at target RIR for 2 sessions; half-kneeling -> standing (Week 5+).","regression":"Lighter; higher incline neutral-grip DB press.","alternative":"Neutral-grip 75-degree incline DB press.","errors":"Arching the lower back; flaring the elbow wide; leaning away.","lumbar":"Ribs down and brace protect the lumbar spine.","shoulder":"Use this instead of any overhead press until pain-free shoulder flexion exceeds 160 degrees.","leftleg":"Kneeling on the left knee = extra left-hip loading.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Shoulder modification rules (Noteboom 2024; RCRSP loading); judgement extrapolation"},{"id":63,"name":"Cable lateral raise (single arm)","cat":"Hypertrophy - side delts","muscles":"Side deltoids","purpose":"Constant-tension side-delt work, hardest in the stretch - complements DB raises.","equipment":"Cable at lowest setting, single handle","setup":"Standing side-on to the stack. Cable at the bottom. Stand left-side away from the stack, grab the handle with the LEFT hand so the cable runs across in front of the body.","startpos":"Handle at the front of the opposite hip, slight body lean toward the stack holding it.","exec":"1) Raise the arm out and up across to shoulder height, elbow slightly bent, leading with the elbow. 2) Pause 1 s. 3) Lower slowly all the way across to the start for the full stretch. Complete reps, swap sides.","breathing":"Exhale up.","rom":"Hip to shoulder height.","progression":"Double progression 10->15 then +1 plate/2.5 kg.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"DB lateral raise.","errors":"Shrugging; twisting the torso; yanking from the hip.","lumbar":"Smooth from the very first rep. Stand tall, no side-lean grinding.","shoulder":"Great option when DB raises feel unstable.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Constant tension / lengthened bias rationale"},{"id":64,"name":"Jefferson curl (bodyweight -> light load)","cat":"Flexion ladder - steps B/C","muscles":"Spinal erectors and hamstrings through full length; secondary: glutes, abdominals","purpose":"Steps B and C of the flexion ladder: a slow, full-spine bend that builds strength and tolerance in the flexed position. Flexed postures are strong and efficient when trained; the load stays tiny and close to the shins.","equipment":"Step or low box; later a light kettlebell/plate (5-15 kg)","setup":"Standing on a low box (so the hands can travel below the feet). Feet together or hip-width on the box, knees soft. Bodyweight only for the first 2 weeks (Step B); later hold a light KB at the thighs (Step C).","startpos":"Tall, chin tucked to begin.","exec":"1) Roll down one segment at a time - chin, upper back, mid back, lower back - letting the hands (or the weight) travel straight down close to the shins, 4 s down. 2) Stop at shin level or wherever you feel a strong-but-easy stretch along the whole back and hamstrings. 3) Pause 2 s. 4) Roll back up from the bottom, stacking the spine from the tailbone up, 4 s up, head last.","breathing":"Exhale down, breathe at the bottom, exhale up. No hard bracing.","rom":"To shin level; deeper only as tolerance grows; the weight stays close to the legs.","progression":"Step B (bodyweight) 2 x 6-8 for 2 weeks -> Step C 5 kg -> 10 kg -> 15 kg (cap ~20-25% bodyweight inside this programme), 2-3 x 6-8, 2x/week max.","regression":"Standing roll-down (Step A); smaller range.","alternative":"Standing roll-down; cat-camel full range.","errors":"Weight drifting away from the shins (raises mid-lumbar shear); rushing; adding load and range in the same week; doing it on a heavy hinge day.","lumbar":"Maximum 2 sessions per week; never on the same day as heavy deadlifts; never rotate or side-bend under load while flexed. Progress one variable per week.","shoulder":"Arms hang - shoulder quiet.","leftleg":"None.","stop":"Stop at any leg symptom or sharp back pain; drop back one ladder step for a week and mention it to your physio.","source":"Mawston 2021 (flexed posture strength/efficiency); von Arx 2021 (keep load close - mid-lumbar shear); RESTORE 2023; Short 2025 review"},{"id":65,"name":"Heel-elevated goblet squat with pause (loaded mobility)","cat":"Loaded mobility - hips/ankles/knees","muscles":"Quadriceps, glutes, adductors; secondary: core, upper back","purpose":"Mobility under load: a deep, paused squat with the heels raised opens the ankles and hips through real range while building strength there. Research shows loaded full-range work improves range as well as stretching does - and builds muscle at the same time.","equipment":"Dumbbell or kettlebell; wedge, plates or a rolled mat under the heels","setup":"Standing, heels on a 2-5 cm elevation. Heels on the wedge, feet shoulder-width, toes out 10-20 degrees. Hold the weight at the chest (goblet), elbows down.","startpos":"Ribs down, light brace, weight in the mid-foot.","exec":"1) Sit straight down between the knees as deep as you can while the back keeps its shape - the heel elevation lets you go deeper than usual. 2) Hold the bottom for 2-3 s, gently pushing the knees out with the elbows. 3) Drive up through the whole foot, glutes squeezing at the top.","breathing":"Inhale at the top, brace, exhale on the way up; breathe steadily during the pause.","rom":"As deep as a neutral-ish spine allows - depth is the progression here, load is secondary.","progression":"First add depth, then pause length (to 5 s), then +2.5 kg. When you can sit at full depth pain-free, lower the heel wedge.","regression":"Higher wedge; hold a post for balance; shallower depth.","alternative":"Box squat; leg press with full depth.","errors":"Tailbone tucking hard at the bottom; heels lifting off the wedge; knees collapsing in; rushing the pause.","lumbar":"Light load (8-16 kg) - this is a mobility drill with weight, not a strength test. Never bounce out of the bottom.","shoulder":"Goblet hold is shoulder-neutral.","leftleg":"Watch the left knee tracking in the bottom; if it wobbles, hold a post.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Afonso 2021 (strength training = stretching for ROM); Favro 2025 (RT improves flexibility g=0.63)"},{"id":66,"name":"Hack squat (machine)","cat":"Hypertrophy - quads compound","muscles":"Quadriceps, glutes; secondary: adductors, calves","purpose":"Heavy quad loading with the back supported on a pad - the closest thing to a squat without a bar on your spine. Enters in Week 3.","equipment":"Hack squat machine","setup":"Back on the pad, shoulders under the pads, feet on the platform. Feet shoulder-width, mid-to-slightly-high on the platform, toes slightly out. Back and hips pressed into the pad, shoulders under the pads, hands on the handles.","startpos":"Release the safeties, legs nearly straight (not locked), brace lightly.","exec":"1) Lower slowly (3 s) bending the knees, keeping the hips glued to the pad, until the thighs are at least parallel or as deep as the pelvis stays on the pad. 2) Pause 1 s. 3) Drive through the whole foot to stand, stopping just short of locked knees. 4) No bouncing at the bottom.","breathing":"Inhale lowering, exhale driving up; light brace throughout.","rom":"Depth capped where the tailbone starts to curl off the pad (that is your neutral-spine limit).","progression":"+5 kg when all sets hit the top of the range at target RIR for 2 sessions. Add depth only when the pelvis stays down.","regression":"Leg press; shallower depth; lighter load.","alternative":"Leg press; goblet squat.","errors":"Tailbone curling at depth (loaded lumbar flexion - the one error to avoid here); heels lifting; knees caving in; locking the knees; feet too low on the platform.","lumbar":"THE depth rule: hips never leave the pad. Film a set side-on in the first week. Stays >=2 RIR (spine-loading lift).","shoulder":"Shoulders under pads are usually comfortable; add a folded towel if they pinch.","leftleg":"Even pressure; the right will try to dominate - place feet symmetrically and check.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Haugen 2023 machine equivalence; long-length quad training (Wolf 2025 SR); spine-sparing selection"},{"id":67,"name":"Dead hang (with scapular depression)","cat":"Shoulder/lat mobility + grip","muscles":"Lats, shoulder capsule (lengthening), grip/forearms; secondary: core","purpose":"Decompresses the spine, opens the shoulders and lats through range, and builds the grip you will need for heavier deadlifts and carries.","equipment":"Pull-up bar or rack; a box to step off","setup":"Hanging from the bar. Step up and grip the bar just outside shoulder-width, palms forward or neutral if available. Step off the box slowly.","startpos":"Arms straight, body relaxed, legs hanging, ribs down.","exec":"1) Hang, letting the shoulders rise to the ears for 2-3 breaths (passive stretch). 2) Then pull the shoulder blades DOWN away from the ears without bending the elbows (active hang) and hold 5 s. 3) Alternate passive/active for the prescribed time. 4) Step back onto the box to finish - do not drop.","breathing":"Slow steady breathing.","rom":"Full hang; stop the active pull if the shoulders pinch.","progression":"20 s -> 40 s -> 60 s; progress to hanging knee raises (Week 5+).","regression":"Feet on a box taking some weight; shorter holds.","alternative":"Lat stretch on a bench.","errors":"Dropping off the bar; shrugging hard into a pinch; holding breath.","lumbar":"Step off, never drop - the landing jolts the spine.","shoulder":"If the passive hang pinches, stay in the active (blades-down) position only.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Core ladder L2; shoulder loading rules"},{"id":68,"name":"45-degree back extension through full range (extensor focus)","cat":"Trunk strength - extensors (full ROM)","muscles":"Spinal erectors, glutes, hamstrings","purpose":"Direct lumbar-extensor strength through the whole bend-and-extend range - 1-2 hard sets a week of this is one of the better-evidenced ways to build a resilient, strong lower back now that flexion is cleared.","equipment":"45-degree back-extension bench; later a light plate","setup":"Face down, pads at the hip crease, feet anchored. Pads just below the hip bones so the hips can fold. Arms crossed on the chest.","startpos":"Body in a straight line, neutral neck, light brace.","exec":"1) Lower by folding at the hips AND letting the back round progressively (upper back first) until the torso hangs comfortably (3 s down). 2) Reverse: extend the hips and un-round the spine from the bottom up until the body is in one straight line - not past it. 3) Pause 1 s squeezing the glutes and back. 4) Repeat smoothly.","breathing":"Exhale on the way up.","rom":"Full comfortable flexion to body-line; no hyperextension beyond the straight line.","progression":"10 -> 15 reps, then hug a 5 kg plate, then 10 kg (Week 7+). Keep 1-2 sets, 8-12 reps, 1-2x per week.","regression":"Hips-only (neutral-spine) version; isometric hold at body line.","alternative":"Isometric back-extension hold; bird-dog.","errors":"Arching past the straight line; jerking; using momentum from the arms.","lumbar":"Introduced Week 3 (bodyweight, neutral-spine style Weeks 1-2). Never on a heavy hinge day. Stays >=2 RIR.","shoulder":"None.","leftleg":"Drive evenly through both feet.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Trybulski 2025 SR (isolated lumbar extension training); Short 2025 dosing table; Berglund 2015 (extensor endurance predicts lifting tolerance)"},{"id":69,"name":"Seated cable row (vertical torso)","cat":"Hypertrophy - horizontal pull","muscles":"Mid-back, lats; secondary: biceps, rear delts","purpose":"A second heavy row with a strict torso rule; complements the chest-supported row.","equipment":"Cable row station, V-handle or neutral handles","setup":"Seated, feet on the plate, knees soft. Sit tall, feet on the platform, grab the handle, torso VERTICAL.","startpos":"Arms long, lats stretched, chest tall, brace ON.","exec":"1) Pull the handle to the upper belly, elbows brushing the ribs, blades squeezing together. 2) Pause 1 s. 3) Return slowly (3 s) to the stretch WITHOUT the torso tipping forward more than a few degrees. 4) Strictly no body swing.","breathing":"Exhale on the pull; brace throughout.","rom":"Full stretch to handle-at-belly; torso near-still.","progression":"+2.5-5 kg when all sets hit the top of the range at target RIR for 2 sessions.","regression":"Chest-supported row.","alternative":"Chest-supported row.","errors":"Leaning back to move the stack; rounding forward in the stretch; shrugging.","lumbar":"Torso movement above ~10 degrees = load too heavy.","shoulder":"Neutral grip is shoulder-friendly.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm.","source":"Spine-managed rowing progression"},{"id":70,"name":"Trap-bar deadlift","cat":"Hinge - loaded compound","muscles":"Glutes, quads, hamstrings; secondary: spinal erectors, traps, forearms, whole core","purpose":"The main heavy hinge from Week 3. The handles sit beside you, which roughly halves the lever arm on the lumbar spine versus a straight bar and lowers erector-spinae demand - the safest way to lift heavy from the floor.","equipment":"Trap (hex) bar, plates; optional blocks for a raised start","setup":"Standing inside the bar. Stand centred in the bar, feet hip-width. Hinge down (hips back, knees bend) and grip both handles mid-way. Chest tall, back neutral, lats set, shins near vertical.","startpos":"Big breath, hard brace, arms straight, shoulders slightly in front of the handles. Weight mid-foot.","exec":"1) Push the floor away and stand up in one piece - hips and chest rise together. 2) Stand tall, glutes squeezed, no lean-back. 3) Hinge back down under control until the plates touch, reset the brace, repeat (dead-stop reps). Keep every rep identical.","breathing":"Breath and hard brace before EVERY rep; exhale through the top half.","rom":"Floor to standing (raised blocks for the first 2 sessions if the floor start rounds your back).","progression":"+5 kg when all reps are crisp at the target RIR for 2 sessions. Stays >=2 RIR for the whole programme; no 1RM testing.","regression":"Raise the start on blocks; drop to the kettlebell deadlift; or reduce to 3 reps per set.","alternative":"Kettlebell deadlift; leg press + back-extension combination.","errors":"Jerking off the floor; rounding as fatigue builds (why sets are 5-8 reps); touch-and-go bouncing; loading by memory of old numbers; hips shooting up first.","lumbar":"Sets capped at 5-8 reps, dead-stop, fresh brace each rep. Start at ~30-40% of your old working weights maximum. Never grind.","shoulder":"Neutral handles - shoulder friendly.","leftleg":"Even drive; if the left leg's push feels absent, stop the set and note it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Any next-morning symptom rise = drop one load step for a week.","source":"Martin-Fuentes 2020 SR (hex bar lowers erector demand); Swinton 2011 (lower lumbar moment); Aasa 2015 progression"},{"id":71,"name":"45-degree hip extension (glute-focused)","cat":"Hypertrophy - glutes/hamstrings","muscles":"Glutes, hamstrings; secondary: Spinal erectors (isometric)","purpose":"Hip-hinge isolation on the bench - glute and hamstring growth with a rounded-upper-back trick that keeps the lumbar spine neutral and quiet.","equipment":"45-degree back extension bench","setup":"Face down, pads at hip crease. Pads BELOW the hip bones so the hips can fold freely. Feet anchored, toes turned out slightly (glute bias).","startpos":"Arms crossed, upper back deliberately relaxed/slightly rounded, chin tucked - the hinge happens at the HIPS only.","exec":"1) Lower by folding at the hips until the hamstrings stretch (torso ~60-80 degrees down). 2) Squeeze the GLUTES to raise the torso back to the straight-body line - not a centimetre past. 3) Pause 1 s squeezing. The lumbar spine stays in the same neutral-ish shape the entire time; only the hips open and close.","breathing":"Exhale up; light brace throughout.","rom":"Hip-fold stretch to body-line; never hyperextended.","progression":"Reps 10->15, then hold a plate (+2.5-5 kg).","regression":"Reduce range; return to glute bridges. Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable pull-through; hip thrust.","errors":"Arching up past body-line; hinging from the back instead of the hips; jerking.","lumbar":"Introduced Phase 3 only, after the back-extension iso holds are established. The glute-focused (rounded-upper-back, hips-only) style specifically minimises lumbar erector strain vs the 'back extension' style.","shoulder":"None.","leftleg":"Even drive through both feet; note left hamstring/glute fatigue difference.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Glute-biased hip extension; progression from iso holds"},{"id":72,"name":"Preacher curl (EZ-bar or machine)","cat":"Hypertrophy - biceps","muscles":"Biceps; secondary: Forearms","purpose":"Strict biceps work with the upper arms locked on a pad - zero cheating, zero back involvement.","equipment":"Preacher bench + EZ-bar, or preacher machine","setup":"Seated, chest against pad, upper arms on the slope. Adjust seat so armpits sit snugly over the pad top, upper arms flat on the slope. Grip the EZ-bar at the angled grips, hands shoulder-width.","startpos":"Arms nearly straight down the pad (stop just short of fully locked), wrists neutral.","exec":"1) Curl the bar up until forearms are just past vertical. 2) Squeeze 1 s. 3) Lower slowly (3-4 s) to the near-straight start - the lowering half is where this exercise earns its keep. 4) Chest stays on the pad.","breathing":"Exhale up.","rom":"Near-straight to just-past-vertical.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Machine curl; incline DB curl.","errors":"Bouncing out of the bottom; lifting elbows off the pad; leaning back.","lumbar":"Never drop fast into the fully straight arm - control the last quarter. Chest support removes the back entirely.","shoulder":"Elbow-friendly if the bottom is controlled.","leftleg":"None.","stop":"Stop at any sharp elbow or forearm pain.","source":"Strict isolation; supported positions principle"},{"id":73,"name":"Reverse EZ-bar curl","cat":"Hypertrophy - forearms/biceps","muscles":"Forearm extensors, brachioradialis; secondary: Biceps","purpose":"Direct forearm size and elbow health balance - the overhand grip covers the forearm's neglected side.","equipment":"EZ-bar or light barbell/DBs","setup":"Standing. Hold the EZ-bar with an OVERHAND grip (palms down) at the angled grips.","startpos":"Tall, elbows at sides, wrists straight (do not let them flop).","exec":"1) Curl the bar up keeping palms down and wrists locked straight. 2) Squeeze 1 s at the top. 3) Lower slowly (3 s).","breathing":"Exhale up.","rom":"Full, wrists neutral throughout.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"DB reverse curls; wrist roller.","errors":"Wrists collapsing; swinging; going too heavy.","lumbar":"Light and strict. Tall stance.","shoulder":"Quiet.","leftleg":"None.","stop":"Stop at wrist/elbow pain.","source":"Forearm coverage requirement"},{"id":74,"name":"Single-leg glute bridge","cat":"Glute strength - unilateral","muscles":"Gluteus maximus (one side); secondary: Hamstrings, core","purpose":"Force each glute to work alone so the strong side cannot cover for the left.","equipment":"Mat","setup":"Lying on back, one foot flat, other leg held to chest. Set up as a glute bridge, then hug the right knee to the chest (this locks the pelvis and protects the back).","startpos":"Brace; left foot flat, heel close to the hips.","exec":"1) Push through the left heel and squeeze the left glute to lift the hips. 2) Rise only as high as the glute can take you with a level pelvis - no back arching, no pelvis tilting. 3) Pause 2 s, lower slowly. All reps LEFT first, then match with the right.","breathing":"Before each rep, take a breath into your belly and lightly tense your midsection as if about to be nudged (about 20-30% effort). Breathe out slowly through the effort phase without losing that tension.","rom":"Glute-determined height; level pelvis is the rule.","progression":"Add reps 8->12, then pauses to 3-4 s, then foot elevated on a step (Phase 3+).","regression":"Two-leg bridge with a 3 s left-emphasis squeeze; or smaller range.","alternative":"Hip thrust machine light, single-leg emphasis.","errors":"Arching the back to gain height; letting the pelvis tip toward the free leg; pushing through toes.","lumbar":"The hugged knee is the back's insurance - keep it snug. Hugging one knee keeps the spine neutral while the other hip works.","shoulder":"None.","leftleg":"Primary left-glute rebuilder. LEFT SIDE SETS THE STANDARD: right side performs only the reps the left achieved.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Unilateral rehab literature; cross-education MA (Manca 2017)"},{"id":75,"name":"BFR leg extension finisher - LEFT leg only (optional)","cat":"Hypertrophy - left quad accessory (optional)","muscles":"Left quadriceps","purpose":"Optional extra left-quad volume with almost no joint or spine load: low-load blood-flow-restriction training grows muscle like heavy training does in load-compromised limbs. ONLY if you have a proper cuff and your physio agrees.","equipment":"BFR cuff (10-12 cm wide) on the upper LEFT thigh; leg extension machine","setup":"Seated on the leg extension machine, cuff high on the left thigh. Cuff as high on the thigh as possible, inflated to a firm '7/10 tightness' (about 50-80% of the pressure that would stop blood flow). Load = 20-30% of your normal 10-rep weight.","startpos":"Sit tall, light brace.","exec":"1) Set 1: 30 reps. 2) Rest 30 s (cuff stays on). 3) Sets 2-4: 15 reps each with 30 s rests. 4) Remove the cuff immediately after the last set. Total cuff time under 10 minutes. Expect a deep burn - that is the point.","breathing":"Normal breathing; do not strain.","rom":"Full range, controlled.","progression":"Keep the same load; add reps only if the 30/15/15/15 scheme becomes easy, then +2.5 kg.","regression":"Skip it; do one extra normal left-leg extension set instead.","alternative":"Extra single-leg leg extension set (no cuff).","errors":"Cuff too tight (numbness in the foot), too loose (no effect), leaving the cuff on during long rests, using heavy load.","lumbar":"Screen first: no history of clots, uncontrolled blood pressure or vascular disease. Stop at any numbness, tingling or unusual pain and remove the cuff.","shoulder":"None.","leftleg":"Left leg ONLY - it is the point of the exercise.","stop":"Remove the cuff immediately at any numbness, tingling, colour change of the leg or dizziness.","source":"de Queiros 2024 MA (BFR = high-load for hypertrophy); Lin 2024 (quad size after ACLR); Patterson 2019 position stand"},{"id":76,"name":"Ab-wheel rollout from knees","cat":"Core - anti-extension (advanced)","muscles":"Abdominals, lats; secondary: shoulders, hip flexors","purpose":"The advanced anti-extension exercise: the whole front line resists the back sagging as the wheel rolls away. Enters Week 7 once planks are strong.","equipment":"Ab wheel (or a barbell with round plates); mat for knees","setup":"Kneeling, hands on the wheel. Kneel on a mat, wheel under the shoulders, arms straight.","startpos":"Ribs down, pelvis tucked slightly, glutes squeezed, brace ON.","exec":"1) Roll the wheel forward slowly, extending the hips and shoulders together, only as far as the lower back stays flat - the moment the back wants to arch, that is your range. 2) Pause 1 s. 3) Pull the wheel back by driving the arms down and the hips back, keeping the tuck. 4) Repeat.","breathing":"Exhale rolling out; keep the brace.","rom":"Range dictated by a flat lower back; grows weekly.","progression":"Short range 6 reps -> longer range -> 12 reps -> 3 s pause at the end (Week 9+).","regression":"Plank body-saw; front plank.","alternative":"Plank body-saw on forearms.","errors":"Lower back arching (the classic error - and the one to never make post-surgery); hips sagging; rolling too far too soon.","lumbar":"The tuck-and-brace is the exercise. Stop the set the moment the back arches.","shoulder":"Keep the arms straight; shorten range if the front of the shoulder pinches.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm.","source":"Core ladder L4; anti-extension progression"},{"id":77,"name":"Half-kneeling cable chop / lift","cat":"Core - dynamic anti-rotation","muscles":"Obliques, deep core, glutes; secondary: shoulders, lats","purpose":"Dynamic version of the Pallof press: the trunk now moves the load diagonally while the hips and spine stay controlled - the step toward real rotational strength.","equipment":"Cable with rope or D-handle set high (chop) or low (lift); cushion","setup":"Half-kneeling side-on to the cable. CHOP: cable high. Kneel with the INSIDE knee (nearest the cable) down, outside foot forward. Hold the rope with both hands. LIFT: cable low, same stance mirrored.","startpos":"Tall torso, ribs down, brace, glute of the kneeling side squeezed.","exec":"1) Pull the rope across the body diagonally - down and across for the chop, up and across for the lift - keeping the arms fairly straight and the hips still. 2) The torso rotates a LITTLE through the mid-back; the lower back does not bend or twist. 3) Pause 1 s. 4) Return slowly. Complete reps, switch sides.","breathing":"Exhale on the pull across.","rom":"Diagonal across the body; small controlled mid-back rotation only.","progression":"8 -> 12 reps then +2.5 kg; half-kneeling -> tall-kneeling -> standing split stance (Week 8+) -> standing with hip drive (Week 9+).","regression":"Pallof press (static); lighter load.","alternative":"Pallof press.","errors":"Twisting the lower back; leaning; yanking; hips drifting.","lumbar":"Introduced Week 5. The lower back stays quiet; rotation comes from the hips and mid-back.","shoulder":"Keep the hands at mid-chest height; lower the anchor if shoulders complain.","leftleg":"Kneeling on the left knee loads the left hip - good.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Core ladder L3; Short 2025"},{"id":78,"name":"Single-arm dumbbell row (bench supported)","cat":"Hypertrophy - horizontal pull","muscles":"Lats, mid-back (one side); secondary: Biceps, rear delt, core (anti-rotation)","purpose":"Unilateral back work with three-point support - big stimulus, braced spine, and a built-in anti-rotation challenge.","equipment":"Flat bench, dumbbell","setup":"One knee and same-side hand on bench, other foot on floor. LEFT hand and LEFT knee on the bench, right foot planted wide, back flat like a table, DB in the RIGHT hand hanging.","startpos":"Back neutral, brace on, shoulder blade relaxed down toward the floor.","exec":"1) Row the DB up to the hip crease, elbow brushing the ribs, blade squeezing back. 2) Pause 1 s. 3) Lower slowly to the full stretch without the torso twisting open. 4) All reps one side, swap. Do the side with the WEAKER-feeling lat first.","breathing":"Exhale on the row; brace holds the torso square.","rom":"Full hang to hip.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: chest-supported row.","alternative":"Chest-supported row; cable row.","errors":"Torso rotating open; yanking; rounding the back; shrugging.","lumbar":"Three points of contact stay planted; the spine stays table-flat. Bench support + brace makes this the safest heavy unilateral pull; keep the torso square.","shoulder":"Elbow path close to the body suits most shoulders.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Supported unilateral loading principle"},{"id":79,"name":"Reverse crunch (controlled flexion)","cat":"Core - dynamic flexion","muscles":"Lower abdominals (rectus), obliques; secondary: hip flexors","purpose":"Controlled spinal flexion against gravity - a safe, desirable core movement at this stage and the bridge from isometric planks to real trunk strength.","equipment":"Mat (later a bench to hold)","setup":"Lying on back, knees bent 90 degrees, hips at 90 degrees. Lie on your back, hands by the hips or holding a bench behind the head. Hips and knees bent to 90/90.","startpos":"Lower back gently on the floor.","exec":"1) Curl the pelvis up toward the ribs, lifting the tailbone off the floor and rolling the lower back up one segment at a time - the knees travel toward the chest. 2) Pause 1 s at the top. 3) Lower slowly (3 s) placing the spine back down from the top segment to the tailbone. 4) Do not swing the legs.","breathing":"Exhale as you curl up.","rom":"Pelvis lifting to lower back rolling up; controlled all the way down.","progression":"8 -> 15 reps -> straighten the legs slightly -> hanging knee raise (Week 5+).","regression":"Smaller range; dead bug.","alternative":"Dead bug; McGill curl-up.","errors":"Swinging the legs for momentum; arching the back at the bottom; pulling with the arms.","lumbar":"Introduced Week 5 after the isometric core levels are solid. Slow lowering is the point.","shoulder":"None.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Short 2025 (controlled flexion is safe and desirable); core ladder"},{"id":80,"name":"Barbell Romanian deadlift (optional, Phase 3+)","cat":"Hinge - hamstring emphasis","muscles":"Hamstrings, glutes; secondary: spinal erectors (isometric), forearms","purpose":"Hamstring and glute size through a long, loaded stretch - and the exact mechanics that protect your back when you bend for life. Optional from Week 6 if the trap-bar and KB hinges are crisp and symptom-free.","equipment":"Barbell (from rack at thigh height) or heavy dumbbells","setup":"Standing, bar in front of the thighs. Take the bar from the rack at upper-thigh height with an overhand (or mixed) grip just outside the thighs. Step back, feet hip-width, soft knees.","startpos":"Tall, shoulders set back, ribs down, brace ON.","exec":"1) Push the hips straig
