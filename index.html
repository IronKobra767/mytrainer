for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: single-arm kneeling cable pulldown.","alternative":"Assisted pull-up machine (Phase 3+); single-arm pulldown.","errors":"Swinging the torso; pulling behind the neck; half-range reps; death-gripping.","lumbar":"Overhead position should stretch the lats, not pinch the shoulders - neutral grip usually solves it. Constant torso angle + brace; no lumbar heaving for extra reps.","shoulder":"Neutral grip is the friendliest vertical pull; if any pinch overhead, shorten the top range slightly.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Vertical pull selection; grip modification evidence"},{"id":40,"name":"Reverse pec-deck (rear delts)","cat":"Hypertrophy - rear delts","muscles":"Rear deltoids; secondary: Mid-traps, rotator cuff","purpose":"Direct rear-delt size, fully supported, zero spine load - the pressing shoulder's best friend.","equipment":"Pec-deck machine set to reverse-fly","setup":"Seated facing the pad. Handles to the rear-fly position. Sit facing the pad, chest against it, feet planted.","startpos":"Arms long forward holding the handles at shoulder height, palms in or down, slight elbow bend.","exec":"1) Sweep the arms out and back in a wide arc, leading with the pinkies/elbows, until the arms are just behind the body line, squeezing the rear shoulders and blades. 2) Pause 1 s. 3) Return slowly, letting the blades glide forward for a stretch.","breathing":"Exhale on the sweep back.","rom":"Full sweep to just-behind-body; no jerking.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Chest-supported DB rear fly on incline bench; band pull-apart.","errors":"Turning it into a row (bending elbows); bouncing; shrugging.","lumbar":"Chest stays glued to the pad. Chest support removes lumbar involvement entirely.","shoulder":"Rear-delt and cuff-friendly; nearly always green even on cranky days.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Rear delt/scap balance; RCRSP"},{"id":41,"name":"Dumbbell shrug (seated or standing)","cat":"Hypertrophy - traps","muscles":"Upper trapezius; secondary: Grip/forearms","purpose":"Direct upper-trap size with a simple, spine-quiet vertical pull of the shoulders.","equipment":"Dumbbells; bench for seated option","setup":"Standing tall (seated on amber back days). DBs at the sides, palms in. Seated version: sit on a bench, DBs beside the hips.","startpos":"Tall, ribs down, light brace, arms long and relaxed.","exec":"1) Pull the shoulders STRAIGHT UP toward the ears as high as they go. 2) Squeeze hard 2 s. 3) Lower slowly (3 s) into a comfortable stretch. 4) No rolling the shoulders - straight up and down only.","breathing":"Exhale up.","rom":"Full shrug height to gentle stretch.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable shrug; trap-bar hold shrug (Phase 4).","errors":"Rolling; bending elbows; jutting the chin; bouncing.","lumbar":"Straight vertical path only. Seated version removes lower-body sway on amber days.","shoulder":"Usually fine even for cranky shoulders (no arm elevation).","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Trap hypertrophy convention"},{"id":42,"name":"Adductor rock-back","cat":"Hip mobility - adductors","muscles":"Adductors (inner thigh); secondary: Hip flexors","purpose":"Open the inner-thigh line so squatting width and depth stop stealing motion from the spine.","equipment":"Mat","setup":"Hands and knees, one leg out to the side. From all-fours, straighten the left leg directly out to the side, foot flat on the floor pointing forward.","startpos":"Neutral spine, hands under shoulders.","exec":"1) Slowly rock the hips BACK toward the heel of the kneeling leg until a gentle stretch runs along the straight leg's inner thigh. 2) Pause 2 s. 3) Rock forward to the start. 8-10 slow rocks, then swap legs.","breathing":"Exhale as you rock back.","rom":"To a gentle 3-4/10 stretch; the back stays flat - do not tuck or round.","progression":"Slightly deeper range over weeks; later add a torso turn toward the straight leg.","regression":"Smaller rocks.","alternative":"Standing wide-stance side shift holding support.","errors":"Rounding the lower back at the bottom; bouncing.","lumbar":"Keep the movement smooth; the spine does not bend. Rock only within the range your neutral back allows.","shoulder":"Wrists sore? Make fists or use push-up handles.","leftleg":"When the LEFT leg is the straight leg, the stretch may differ - record which side is tighter.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Hip mobility literature"},{"id":43,"name":"Single-leg glute bridge","cat":"Glute strength - unilateral","muscles":"Gluteus maximus (one side); secondary: Hamstrings, core","purpose":"Force each glute to work alone so the strong side cannot cover for the left.","equipment":"Mat","setup":"Lying on back, one foot flat, other leg held to chest. Set up as a glute bridge, then hug the right knee to the chest (this locks the pelvis and protects the back).","startpos":"Brace; left foot flat, heel close to the hips.","exec":"1) Push through the left heel and squeeze the left glute to lift the hips. 2) Rise only as high as the glute can take you with a level pelvis - no back arching, no pelvis tilting. 3) Pause 2 s, lower slowly. All reps LEFT first, then match with the right.","breathing":"Before each rep, take a breath into your belly and lightly tense your midsection as if about to be nudged (about 20-30% effort). Breathe out slowly through the effort phase without losing that tension.","rom":"Glute-determined height; level pelvis is the rule.","progression":"Add reps 8->12, then pauses to 3-4 s, then foot elevated on a step (Phase 3+).","regression":"Two-leg bridge with a 3 s left-emphasis squeeze; or smaller range.","alternative":"Hip thrust machine light, single-leg emphasis.","errors":"Arching the back to gain height; letting the pelvis tip toward the free leg; pushing through toes.","lumbar":"The hugged knee is the back's insurance - keep it snug. Hugging one knee keeps the spine neutral while the other hip works.","shoulder":"None.","leftleg":"Primary left-glute rebuilder. LEFT SIDE SETS THE STANDARD: right side performs only the reps the left achieved.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Unilateral rehab literature; cross-education MA (Manca 2017)"},{"id":44,"name":"Clamshell with band","cat":"Glute activation - abductors","muscles":"Glute medius; secondary: Deep hip rotators","purpose":"Strengthen the hip's side stabilisers that keep the pelvis level on one leg - critical for the left side.","equipment":"Mini-band, mat","setup":"Side-lying, knees bent 45 degrees, band just above knees. Lie on your side, hips stacked vertically, heels in line with your bottom, band above the knees.","startpos":"Feet together, light brace so the pelvis cannot roll.","exec":"1) Keeping the feet touching, lift the top knee against the band as far as possible WITHOUT the pelvis rolling backward. 2) Pause 2 s feeling the side of the hip burn. 3) Lower slowly. All reps one side, then swap. LEFT side (left leg on top) first.","breathing":"Exhale as the knee lifts.","rom":"Only the range where the pelvis stays still - usually 20-30 cm.","progression":"Pause longer -> heavier band -> progress to side-lying leg raise then standing band walks.","regression":"No band; smaller range.","alternative":"Side-lying hip abduction (straight leg).","errors":"Rolling the pelvis back to fake range; rushing.","lumbar":"Small honest range beats big cheated range. Pelvis-still rule keeps the spine out of it.","shoulder":"None.","leftleg":"Left side first, right side matches left's reps. Expect a burn difference - track it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Glute activation literature; hip-targeted PT MA 2019"},{"id":45,"name":"Seated leg curl (machine)","cat":"Hypertrophy - hamstrings","muscles":"Hamstrings; secondary: Calves (slight)","purpose":"The main hamstring builder - the seated version trains them at longer length than lying curls, which grows more muscle.","equipment":"Seated leg curl machine","setup":"Seated, back on pad, thigh pad locked. Knee joint aligned with pivot, pad on the lower calf, thigh pad snug so the hips cannot lift.","startpos":"Legs long in the stretched start, toes pulled up, sit tall.","exec":"1) Curl the heels down-and-under as far as the machine allows, squeezing the hamstrings. 2) Pause 1 s. 3) Return slowly (3 s) to the long-leg stretch WITHOUT letting the stack slam. 4) Single-leg option from Phase 2 (left first, right matches).","breathing":"Exhale curling.","rom":"Full stretch to full curl.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Lying leg curl; slider leg curl (Phase 4).","errors":"Hips lifting off the seat; jerking; short-stroking the stretch.","lumbar":"The thigh pad snugness is the technique. Fully seated and supported - excellent post-op choice.","shoulder":"None.","leftleg":"Left-first single-leg sets when prescribed; hamstrings are less affected by the L3 root but symmetry data still matters.","stop":"Stop at cramping-type pain that does not release, or any nerve symptoms down the leg.","source":"Seated>lying length evidence (Maeo); machine safety"},{"id":46,"name":"Hip thrust (machine or barbell-on-pad)","cat":"Hypertrophy - glutes","muscles":"Gluteus maximus; secondary: Hamstrings, quads","purpose":"The heaviest direct glute loading available with the spine braced horizontal - glute size without spinal compression.","equipment":"Hip thrust machine (preferred) or bench + padded barbell","setup":"Upper back on bench/pad, hips free. Machine: per its pads. Barbell: shoulder blades on a bench edge, padded bar across the hip crease, feet flat hip-width, shins near vertical at the top.","startpos":"Chin tucked, ribs down, brace ON; the torso from ribs to knees will move as one rigid plank.","exec":"1) Drive through the heels and squeeze the glutes to lift the hips until the thighs and torso form one straight line - NO higher; the finish is a glute squeeze, not a back arch. 2) Hold 2 s squeezing hard. 3) Lower with control most of the way and repeat.","breathing":"Exhale hard through the lift; keep ribs down.","rom":"Top = straight line, never over-arched; depth = comfortable.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 5 kg (or smallest machine increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: feet-elevated glute bridge.","alternative":"Glute bridge (floor); cable pull-through.","errors":"Over-arching at the top (the classic error and the one your spine cannot afford); hips shooting up unevenly; heels drifting far forward.","lumbar":"Ribs down + chin tucked + glute-squeeze finish = safe top position, every rep. Horizontal loading spares the discs; the ONLY danger is the over-arch finish - film it weekly.","shoulder":"Pad the bar well; hands steady it only.","leftleg":"Watch for the right hip rising faster - drive evenly; single-leg bridge work covers the gap.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Glute loading with spine-horizontal vector; corrective priority"},{"id":47,"name":"Hip abduction machine","cat":"Hypertrophy - glute medius/abductors","muscles":"Glute medius, upper glute max","purpose":"Direct abductor size and strength - the upper-glute shelf and the pelvis-levelling muscle in one.","equipment":"Abduction machine","setup":"Seated, pads outside knees. Sit tall, back on the pad, knees inside the pads, feet on the rests.","startpos":"Legs together against the stack's resistance.","exec":"1) Push the knees apart as far as the machine allows, leading from the SIDE of the hips. 2) Pause 2 s at maximum spread. 3) Return slowly (3 s) without the stack touching down. Lean slightly forward for upper-glute bias in later phases.","breathing":"Exhale pushing apart.","rom":"Full available spread.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Banded clamshell/monster walk.","errors":"Jerking; letting the stack slam; sliding the hips forward off the pad.","lumbar":"Simple and safe seated. Seated and supported.","shoulder":"None.","leftleg":"Push evenly - the left side will want to contribute less; focus on it.","stop":"Stop at pinching hip pain.","source":"Abductor coverage requirement; pelvis stability"},{"id":48,"name":"Standing calf raise (machine or single-leg DB)","cat":"Hypertrophy - calves (gastroc)","muscles":"Gastrocnemius; secondary: Soleus","purpose":"The straight-knee calf builder - pairs with the seated version for complete calves.","equipment":"Standing calf machine, or step + DB + rail","setup":"Standing, balls of feet on edge. Machine: shoulders under pads, balls of feet on the step. DB version: LEFT foot on the step edge, right foot hooked behind the left ankle, right hand holding the rail, DB in the left hand.","startpos":"Deep comfortable heel drop (stretch), knee straight but not slammed.","exec":"1) Rise as high as possible onto the toes. 2) Pause 2 s. 3) Lower slowly (3 s) into the stretch, pause 2 s. 4) Single-leg version: all reps left, then right matches left.","breathing":"Exhale up.","rom":"Full stretch to full rise.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Leg-press calf raise (very back-friendly).","errors":"Bouncing; bent knees (turns it into the seated version); tiny range.","lumbar":"Hold the rail - balance is not the goal here, calf loading is. Machine pads load the spine lightly - use the leg-press calf raise instead on any amber back day.","shoulder":"None.","leftleg":"Left first, always. The left calf is on the weekly tape measure.","stop":"Stop at Achilles pain; note any left-calf cramping or 'dead' feeling (possible neural sign - record it).","source":"Calf coverage; leg-press variant for spine-sparing"},{"id":49,"name":"Suitcase carry","cat":"Loaded carry - anti-lateral-flexion","muscles":"Obliques, quadratus lumborum, grip/forearms; secondary: Traps, glute medius","purpose":"Walk tall while one-sided load tries to bend you - real-world spine armour and forearm work in one.","equipment":"One dumbbell or kettlebell; clear 10-20 m walkway","setup":"Standing, weight in one hand. Dumbbell beside the right foot. Hinge at the hips with a braced neutral back, grip, and stand tall.","startpos":"Shoulders LEVEL, both shoulder blades gently set; do not lean away or toward the weight.","exec":"1) Walk slowly and tall for the prescribed distance/time, feet hip-width, eyes ahead. 2) The torso must look identical to unloaded walking - no lean, no hip drop. 3) Set the weight down with the same hip hinge. Swap hands and repeat. Start with the weight in the LEFT hand first each session.","breathing":"Rhythmic shallow breathing over a constant light brace.","rom":"Normal walking.","progression":"+2.5 kg when both sides complete all carries with level shoulders for 2 sessions; or add 10 s.","regression":"Lighter load, shorter distance.","alternative":"Suitcase iso-hold standing still.","errors":"Leaning; shrugging the loaded shoulder; rushing; sloppy pick-up.","lumbar":"The pick-up and set-down are hip hinges - treat them as reps in themselves. Grade A functional anti-lateral-flexion loading; obey the 10 kg-region start.","shoulder":"Loaded shoulder stays down and back; skip on days of shoulder pain >3/10 and do the iso-hold version light.","leftleg":"Watch for hip drop on the left stance phase - it flags glute medius weakness; note it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill carries; graded exposure principles"},{"id":50,"name":"Cable triceps pressdown (rope)","cat":"Hypertrophy - triceps","muscles":"Triceps (lateral/medial heads)","purpose":"The staple elbow-friendly triceps builder with constant cable tension.","equipment":"Cable, high anchor, rope","setup":"Standing, slight forward lean. Rope at the top. Grip the rope ends, elbows pinned to the sides, feet hip-width, slight hinge, brace.","startpos":"Forearms just above parallel, elbows bent ~90+ degrees.","exec":"1) Press the hands down and slightly apart until the arms are straight, squeezing the triceps hard. 2) Pause 1 s. 3) Let the hands rise with control to just above 90 degrees - elbows never leave the sides.","breathing":"Exhale on the press.","rom":"90+ degrees to straight.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Straight-bar pressdown; band pressdown.","errors":"Elbows flaring/rising; leaning over the stack; shoulders rolling forward.","lumbar":"Elbows glued to the ribs is the whole technique. Slight hinge with brace; no slumping.","shoulder":"Very shoulder-quiet.","leftleg":"None.","stop":"Stop at sharp elbow pain.","source":"Triceps staple; joint-friendly selection"},{"id":51,"name":"Incline dumbbell curl","cat":"Hypertrophy - biceps","muscles":"Biceps (long head, stretch-biased); secondary: Forearm flexors","purpose":"Biceps loaded in their most stretched position - the highest-yield curl per set.","equipment":"Incline bench ~45-60 degrees, dumbbells","setup":"Seated back on incline bench. Bench at 45-60 degrees. Sit fully back, head and shoulders on the pad, DBs hanging straight down by the sides, palms forward.","startpos":"Arms hanging slightly behind the body line (the stretch), shoulders relaxed down.","exec":"1) Curl both DBs up WITHOUT the elbows drifting forward, squeezing the biceps hard at the top. 2) Pause 1 s. 3) Lower slowly (3 s) to the full hang stretch. 4) The upper arms stay pointing at the floor throughout.","breathing":"Exhale up.","rom":"Full hang to full squeeze.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: seated (upright) DB curl.","alternative":"Cable curl from behind-body low anchor; preacher curl.","errors":"Elbows drifting forward; swinging; cutting the bottom stretch short.","lumbar":"Shoulder relaxed, not stretched painfully at the hang - reduce bench angle if the front of the shoulder complains. Fully supported back - ideal.","shoulder":"If the hang tugs the front of the shoulder, raise the bench angle a notch.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Lengthened-position hypertrophy (stretch-mediated)"},{"id":52,"name":"Lying dumbbell triceps extension","cat":"Hypertrophy - triceps","muscles":"Triceps (all heads)","purpose":"Heavy-feeling triceps stretch work lying fully supported - the shoulder-friendly overhead alternative.","equipment":"Flat bench, dumbbells","setup":"Lying on back on bench. Lie back with a DB in each hand pressed above the chest, palms facing each other, feet planted.","startpos":"Arms vertical, ribs down, back gently on the bench.","exec":"1) Keeping the upper arms STILL and tilted slightly back toward the head, bend the elbows to lower the DBs beside the ears/level of the forehead. 2) Feel the triceps stretch. 3) Straighten back to the top without the upper arms swinging.","breathing":"Exhale extending.","rom":"Full elbow bend to straight; upper arms still.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable pressdown; close-grip push-up (Phase 3+).","errors":"Upper arms swinging (turns it into a pullover); flaring; lowering to the chest.","lumbar":"DBs, not a bar - each arm finds its own path and there is nothing to drop on your face. Fully supported.","shoulder":"Usually comfortable even when overhead pressing is not.","leftleg":"None.","stop":"Stop at sharp elbow pain.","source":"Triceps long-head loading, supported"},{"id":53,"name":"Hammer curl (dumbbell)","cat":"Hypertrophy - biceps/forearms","muscles":"Brachialis, brachioradialis (forearm); secondary: Biceps","purpose":"Thickens the arm from the side and builds the forearm - covers what standard curls miss.","equipment":"Dumbbells","setup":"Standing or seated. DBs at the sides, PALMS FACING EACH OTHER (hammer grip).","startpos":"Tall, ribs down, elbows lightly pinned to the sides.","exec":"1) Curl both DBs up keeping the palms facing in, until the thumbs approach the shoulders. 2) Squeeze 1 s. 3) Lower slowly (3 s). 4) No swinging.","breathing":"Exhale up.","rom":"Full.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable rope hammer curl; cross-body hammer curl.","errors":"Swinging; elbows drifting; half reps.","lumbar":"Simple and joint-friendly. Seated on amber back days.","shoulder":"Neutral grip = shoulder-quiet.","leftleg":"None.","stop":"Stop at sharp elbow/wrist pain.","source":"Arm hypertrophy coverage (brachialis/forearm)"},{"id":54,"name":"Single-leg balance progressions","cat":"Balance / proprioception","muscles":"Foot, ankle, hip stabilisers; balance system; secondary: Core","purpose":"Rebuild the position-sense the nerve compression degraded; measured monthly as a progress test.","equipment":"None (later: pillow/foam)","setup":"Standing near support. Stand tall near a wall or counter (fingertips ready, not gripping).","startpos":"Weight on the LEFT leg, right foot lifted a few centimetres, hands free.","exec":"1) Balance for the prescribed time, eyes OPEN, gaze on a fixed point. 2) Keep the pelvis level and knee soft. 3) Swap legs. Progressions in later phases: eyes closed; standing on a folded towel/foam; small head turns while balancing.","breathing":"Natural.","rom":"None.","progression":"Eyes open steady 30 s -> eyes closed 10 s -> 20 s -> foam surface eyes open -> add head turns.","regression":"Fingertip support; shorter holds.","alternative":"Tandem stance (heel-to-toe).","errors":"Gripping the support; holding breath; hip sagging.","lumbar":"Always near support; never progress two variables at once. Tall relaxed posture.","shoulder":"None.","leftleg":"Test both sides monthly (eyes open and closed, max 45 s cap); the L-R gap and its trend are key rehab data.","stop":"Stop and note if the left side is suddenly much worse than its own recent normal - that is reportable.","source":"Springer 2007 norms; Senol 2022 proprioception RCT"},{"id":55,"name":"Lateral band walk (monster walk)","cat":"Glute strength - abductors","muscles":"Glute medius, glute max; secondary: Quads","purpose":"Standing, functional version of hip-side strength - keeps knees tracking and pelvis level in squats and stairs.","equipment":"Mini-band","setup":"Standing, band above knees (easier) or at ankles (harder). Band above the knees, feet hip-width, quarter-squat position, chest tall.","startpos":"Tension always on the band; toes forward.","exec":"1) Step the left foot sideways ~20 cm, keeping toes forward and pelvis level. 2) Follow with the right foot, never letting the feet touch (band stays tight). 3) 8-10 steps left, then 8-10 back to the right, staying low throughout.","breathing":"Steady breathing, light brace.","rom":"Small controlled steps.","progression":"Heavier band -> band to ankles -> add a pause on each step.","regression":"Stand taller; band above knees; fewer steps.","alternative":"Standing banded hip abduction holding support.","errors":"Toes turning out; standing up tall between steps; knees caving in.","lumbar":"Burn in the side of the hips is the goal; knee pain is not. Stay tall through the trunk; no side-lean with each step.","shoulder":"None.","leftleg":"Lead with the LEFT foot on the first lap; if the left hip fatigues far sooner, note it in the diary.","stop":"Stop if knee pain or any back/leg symptom appears.","source":"Glute EMG literature; hip-targeted PT MA"},{"id":56,"name":"Dumbbell step-up","cat":"Hypertrophy - unilateral","muscles":"Quads, glutes; secondary: Calves, balance","purpose":"Functional single-leg strength that transfers straight to stairs and daily life; honest left-leg loading.","equipment":"Sturdy box/bench 20-30 cm, dumbbells","setup":"Standing facing the box. Box at knee-below height. DBs at the sides (or none in early sessions).","startpos":"LEFT foot fully on the box, whole foot, weight in that heel.","exec":"1) Drive through the LEFT foot to stand tall on the box - do NOT spring off the bottom foot (it should land almost weightless). 2) Pause 1 s tall. 3) Lower slowly (3 s) with the same leg controlling, bottom foot kissing the floor. 4) All reps left, then right matches.","breathing":"Exhale on the drive up.","rom":"Full step to stand; lower box if the push-off cheat creeps in.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range. Or raise the box height (one variable at a time).","regression":"Lower box; hand support. Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Leg press single-leg; lateral step-down.","errors":"Springing off the floor leg (universal cheat); knee caving; leaning the torso to haul up.","lumbar":"The slow lowering is half the exercise - never just drop. Tall torso, brace; no back-lean heaving.","shoulder":"Arms hang - quiet.","leftleg":"Left leads always. The eccentric (lowering) phase is prime left-quad rebuilding.","stop":"Stop if the left leg cannot control the lowering - regress the height, and note it.","source":"Unilateral rehab-to-strength bridge; eccentric emphasis (Manca 2017)"},{"id":57,"name":"Farmer carry (two hands)","cat":"Loaded carry - full-body","muscles":"Grip/forearms, traps, core; secondary: Glutes, calves","purpose":"Symmetrical carrying strength - the safest 'heavy' feeling early in rehab; builds work capacity and confidence.","equipment":"Two matching dumbbells/kettlebells","setup":"Standing, weight in both hands. Weights beside each foot. Hip-hinge with braced neutral back, grip both, stand tall.","startpos":"Tall, shoulders set, ribs down.","exec":"1) Walk controlled for the prescribed distance/time. 2) Tall posture, smooth steps, no waddling. 3) Hinge to set down. That is one carry.","breathing":"Rhythmic breathing over light brace.","rom":"Normal walking.","progression":"+2.5 kg per hand when posture stays perfect for 2 sessions; or add time.","regression":"Lighter, shorter.","alternative":"Trap-bar hold (no walk) later; suitcase carries.","errors":"Rounding to lift; craning the neck; gripping the floor with the toes.","lumbar":"The floor pick-up is the riskiest moment - hinge properly every time. Axial load through a braced neutral spine, well tolerated and progressive.","shoulder":"Neutral hanging arms are usually shoulder-friendly.","leftleg":"Even push-off both sides; note left calf/quad fatigue difference.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill; loaded carry literature"},{"id":58,"name":"Wall sit","cat":"Left-leg / quad endurance","muscles":"Quadriceps (both legs); secondary: Glutes","purpose":"Time-under-tension for the thighs with the back fully supported - quad work with near-zero spine stress.","equipment":"Wall","setup":"Back flat against wall, knees bent. Back and head against the wall, feet ~40-50 cm from it, hip-width.","startpos":"Slide down until knees are bent 45-60 degrees (Phase 1) or ~90 degrees (later).","exec":"1) Hold the position for the prescribed time, thighs burning, back pressed comfortably to the wall. 2) Push through both heels EVENLY - it is easy to cheat toward the strong leg. 3) Slide up to rest.","breathing":"Steady shallow breathing; never hold breath.","rom":"Static; depth per phase.","progression":"Deeper angle -> longer holds -> single-leg emphasis (lift the right heel slightly, Phase 3+) -> hold a light plate (Phase 4).","regression":"Shallower angle, shorter time.","alternative":"Leg press light high-rep set.","errors":"Weight drifting to the right leg; hands on thighs; heels lifting.","lumbar":"Fully supported spine makes this an early-phase favourite. Back stays flat and comfortable on the wall throughout.","shoulder":"None.","leftleg":"Periodically lift the RIGHT heel a touch to check the left is truly working; left-emphasis versions from Phase 3.","stop":"Stop at sharp knee pain or any leg nerve symptoms.","source":"Early post-op quad loading; wall-supported loading rationale"},{"id":59,"name":"Cable lateral raise (single arm)","cat":"Hypertrophy - side delts","muscles":"Side deltoids","purpose":"Constant-tension side-delt work, hardest in the stretch - complements DB raises.","equipment":"Cable at lowest setting, single handle","setup":"Standing side-on to the stack. Cable at the bottom. Stand left-side away from the stack, grab the handle with the LEFT hand so the cable runs across in front of the body.","startpos":"Handle at the front of the opposite hip, slight body lean toward the stack holding it.","exec":"1) Raise the arm out and up across to shoulder height, elbow slightly bent, leading with the elbow. 2) Pause 1 s. 3) Lower slowly all the way across to the start for the full stretch. Complete reps, swap sides.","breathing":"Exhale up.","rom":"Hip to shoulder height.","progression":"Double progression 10->15 then +1 plate/2.5 kg.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"DB lateral raise.","errors":"Shrugging; twisting the torso; yanking from the hip.","lumbar":"Smooth from the very first rep. Stand tall, no side-lean grinding.","shoulder":"Great option when DB raises feel unstable.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Constant tension / lengthened bias rationale"},{"id":60,"name":"Incline dumbbell press (30 degrees)","cat":"Hypertrophy - incline press","muscles":"Upper chest; secondary: Front deltoids, triceps","purpose":"Upper-chest emphasis with dumbbells letting each shoulder find its own comfortable path.","equipment":"Adjustable bench at ~30 degrees, dumbbells","setup":"Seated-lying on incline bench. Bench at ~30 degrees. Sit with DBs on thighs, kick them up one at a time as you lie back. Feet flat and wide, head/shoulders/hips on the bench.","startpos":"DBs over the upper chest, palms turned slightly in (between neutral and forward - pick the angle that feels smoothest), blades back and down.","exec":"1) Lower both DBs slowly (3 s) out-and-down until a comfortable stretch crosses the upper chest, elbows at ~45-60 degrees from the body. 2) Press up and slightly in until arms are long, DBs close but not clanging. 3) Repeat. To finish the set, lower the DBs to the thighs and sit up - never drop them from the top.","breathing":"Exhale up, inhale down, light constant brace.","rom":"To comfortable stretch; shoulder pain caps depth.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: machine press or lower incline.","alternative":"Machine incline press; low-incline DB press (15 degrees).","errors":"Arching the lower back off the bench; elbows flaring to 90 degrees; clanging DBs; sloppy set-down.","lumbar":"The get-up and get-down with DBs is a real injury moment - use the thigh kick-up technique every time. Feet planted, lower back gently on the pad - do not arch-bridge to press more.","shoulder":"Adjust palm angle freely; slight tucking of elbows usually clears pinching.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Pressing angle tolerance strategy; RCRSP loading rules"},{"id":61,"name":"Supported rest pose (from Phase 2)","cat":"Flexibility / relaxation","muscles":"Back muscles (gentle lengthening), hips; secondary: Shoulders, lats","purpose":"A calming, supported position that gently decompresses the day's accumulated tension.","equipment":"Mat, cushion or pillow","setup":"Kneeling, sitting toward heels, chest supported. Kneel, big toes together, knees apart, place a large cushion or two pillows in front of you.","startpos":"Sit the hips BACK toward the heels only as far as comfortable.","exec":"1) Fold forward and rest the chest and head fully on the cushion so the back is supported, arms resting forward or by your sides. 2) Breathe slowly into the back of the ribs for 60-90 s. 3) Rise slowly using the hands.","breathing":"Slow belly breathing.","rom":"Mid-range only; the cushion deliberately prevents deep spinal bending.","progression":"Lower the support height gradually across phases if fully symptom-free.","regression":"Lie on the back, knees hugged GENTLY toward chest instead.","alternative":"Crocodile breathing face-down.","errors":"Forcing the hips to the heels; using no support (deep flexion).","lumbar":"Introduced in Phase 2, not Week 1; the support keeps the healing disc out of end-range flexion. If any back or leg symptom appears, come up and use the on-back alternative.","shoulder":"Arms by the sides if overhead position bothers the shoulders.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Judgement, consistent with graded flexion re-exposure (Saraceni 2020)"},{"id":62,"name":"World's greatest stretch (Phase 2+)","cat":"Mobility flow","muscles":"Hip flexors, hamstrings, thoracic rotation; secondary: Adductors, calves","purpose":"One flowing drill covering the day's key mobility needs before leg training.","equipment":"Mat","setup":"Long lunge position. Step the left foot far forward into a long lunge, right knee on or off the floor, both hands inside the front foot.","startpos":"Back flat-ish, hips square.","exec":"1) Drop the hips gently forward-down (hip flexor stretch, 2 s). 2) Place the RIGHT hand down and rotate the chest LEFT, reaching the left arm to the ceiling, following with the eyes (2 s). 3) Return the hand, shift the hips BACK straightening the front knee, toes up (hamstring, 2 s) - keep the back long, bend from the hips. 4) Return to the lunge. That is 1 rep; do 4-5 per side.","breathing":"Exhale into each position.","rom":"All positions gentle (3-4/10 stretch).","progression":"Deeper positions; back knee lifted throughout.","regression":"Split into separate stretches; hold support.","alternative":"Half-kneeling hip flexor + open book separately.","errors":"Rounding the back in the hamstring phase; forcing the rotation from the lower back.","lumbar":"Introduced from Phase 2 once components are familiar. Rotation comes from the MID-back with hips square.","shoulder":"Reach only as high as comfortable.","leftleg":"Left leg forward first; note stiffness differences.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Warm-up/mobility literature (RAMP)"},{"id":63,"name":"Goblet squat (Phase 2+)","cat":"Hypertrophy - squat pattern","muscles":"Quadriceps, glutes; secondary: Core, adductors, upper back (isometric)","purpose":"The first free-standing squat - the front-held weight makes the torso honest and the depth self-limiting.","equipment":"One dumbbell or kettlebell","setup":"Standing, weight held at the chest. Hold the DB vertically by one end, cupped in both hands, glued to the breastbone, elbows down.","startpos":"Feet slightly wider than hips, toes out 10-20 degrees, ribs down, brace ON.","exec":"1) Sit down-and-slightly-back, knees tracking over the toes, chest tall, until the elbows approach the insides of the knees or your comfortable depth - whichever comes first. 2) The back keeps its neutral shape the whole way; the moment the tailbone tucks under, you have passed today's depth. 3) Drive up through the whole foot, squeezing the glutes at the top. 4) No bounce at the bottom.","breathing":"Big breath and brace at the top, exhale through the drive up.","rom":"To the neutral-spine depth limit; depth grows as hips/ankles open.","progression":"+2.5 kg when all sets hit top reps at target RIR for 2 sessions; depth progresses separately (one at a time).","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: box goblet squat (sit-tap-stand) or leg press.","alternative":"Box squat to bench; leg press.","errors":"Tailbone tucking at depth (butt wink) - the key error post-surgery; heels lifting; knees caving; weight drifting to toes; leaning forward.","lumbar":"Depth is earned, not forced. Film side-on weekly. Introduced Phase 2, after the hinge pattern and core gates are passed; the front load keeps the spine tall and the load far below old barbell numbers ON PURPOSE.","shoulder":"Front-held position is shoulder-neutral.","leftleg":"Push evenly; watch the left knee tracking - it may wobble inward when tired. That wobble ends the set.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Graded squat reintroduction (Aasa gating); technique-first principle"},{"id":64,"name":"Cable face pull (rope)","cat":"Scapular / rear shoulder strength","muscles":"Rear deltoids, mid/lower traps; secondary: Rotator cuff (external rotators)","purpose":"Pull-apart strength at the back of the shoulders to balance all pressing; among the best tolerated shoulder builders.","equipment":"Cable with rope, set at upper-chest/eye height","setup":"Standing, split stance. Rope at eye height. Grab the rope ends thumbs-toward-you, step back until the stack lifts, split stance, ribs down, light brace.","startpos":"Arms long, shoulder blades relaxed forward.","exec":"1) Pull the rope toward the bridge of the nose, elbows high and WIDE, until hands finish beside the ears with the upper arms in line with the shoulders. 2) At the end, the shoulder blades squeeze together and the fists rotate slightly up (like flexing biceps). 3) Pause 1 s, return slowly.","breathing":"Exhale on the pull.","rom":"Full comfortable pull; no neck poking forward.","progression":"Double progression 12->15 then +2.5 kg.","regression":"Band pull-apart.","alternative":"Reverse pec-deck; band face pull.","errors":"Turning it into a row (elbows low); leaning back; jerking.","lumbar":"Smooth and controlled; the neck stays tall. Split stance + brace keeps the back quiet.","shoulder":"Usually the FIRST pulling exercise to feel good on cranky shoulders; keep it in every week.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Cools 2013; RCRSP loading"},{"id":65,"name":"Straight-arm cable pulldown (pullover)","cat":"Hypertrophy - lats isolation","muscles":"Lats; secondary: Triceps long head, core","purpose":"Lat isolation through a huge stretched range without heavy elbow flexor involvement - great second lat move.","equipment":"Cable, high anchor, straight or rope handle","setup":"Standing, hinged slightly at the hips. High cable. Grab the bar/rope, step back, hinge slightly (15-20 degrees) with a braced neutral back, arms long overhead-forward feeling the lat stretch.","startpos":"Arms nearly straight (soft elbows), locked at that bend.","exec":"1) Sweep the hands down in an arc to the thighs, arms staying long, feeling the lats do all of it. 2) Pause 1 s. 3) Return slowly overhead to the deep stretch. 4) The torso angle stays constant - no bowing up and down.","breathing":"Exhale on the sweep down; hold the brace.","rom":"Overhead stretch to thighs.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Machine pullover if available; single-arm lat pulldown.","errors":"Bending/straightening elbows; bowing the torso; shrugging at the stretch.","lumbar":"Brace holds the hinge angle still. Slight hinge only, brace on - if the back rounds or arches, lighten.","shoulder":"Long-lever move: keep it light and smooth; shorten the top range if pinchy.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Lengthened-position lat work"},{"id":66,"name":"Back-extension isometric hold (45-degree bench)","cat":"Trunk endurance - extensors","muscles":"Spinal erectors, glutes, hamstrings","purpose":"Rebuild extensor endurance - low endurance here predicts poor tolerance of loaded lifting.","equipment":"45-degree back-extension bench","setup":"Face down on the bench, pads at the hip crease. Adjust pads so the hip crease is free to bend above the pad edge. Anchor feet.","startpos":"Body in one straight line from head to heels, arms crossed on chest, neutral neck.","exec":"1) Hinge down a FEW degrees only, then return to the straight line. Phase 2 version: simply HOLD the straight line for the prescribed time. 2) Never lift beyond the straight line (no arching up past horizontal-line of the body). 3) Lower by hinging at the hips with control to rest.","breathing":"Shallow steady breathing during holds; no breath-holding.","rom":"From straight body to slightly below; NO hyperextension.","progression":"15 s -> build toward 60+ s across phases; then small ROM reps; hold a light plate at the chest in Phase 4.","regression":"Shorter holds; or glute bridge holds on the floor instead.","alternative":"Bird-dog holds (both legs alternating).","errors":"Arching past the straight line; hanging into full flexion between reps; jerky movement.","lumbar":"Cleared-by-physio gate applies; this loads the extensors directly over the operated area. Introduced only in Phase 2, small ranges, isometric bias; Sorensen-type endurance is a documented progression gate.","shoulder":"None.","leftleg":"Drive evenly through both legs into the footplate.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Biering-Sorensen literature; Aasa 2015 gating"},{"id":67,"name":"Dumbbell Romanian deadlift (Phase 2: short range -> Phase 3: full)","cat":"Hypertrophy - hinge","muscles":"Hamstrings, glutes; secondary: Spinal erectors (isometric), forearms, traps","purpose":"The loaded hinge - hamstring and glute size plus the exact lifting mechanics that protect your back for life.","equipment":"Two dumbbells","setup":"Standing. DBs in front of the thighs, palms facing you (or facing in). Feet hip-width, soft knees.","startpos":"Tall, shoulders set back, ribs down, brace ON - the same brace you drilled with the dowel.","exec":"1) Push the hips straight BACK, letting the DBs slide down the front of the thighs, knees staying softly bent. 2) PHASE 2 RANGE: stop at just above knee height. PHASE 3+: continue to mid-shin IF the back keeps its shape. 3) The back never rounds and never over-arches; you should feel a hamstring stretch, not back work. 4) Squeeze the glutes to stand tall - hips finish forward, not back arching.","breathing":"Breathe and brace at the top; exhale through the stand-up. Re-brace EVERY rep.","rom":"Phase-limited: to knee (P2), to mid-shin (P3+), never forced to floor.","progression":"+2.5 kg per DB when all sets crisp at target RIR for 2 sessions; RANGE progresses in a separate week from LOAD (never both at once).","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: 45-degree back extension (glute style) or cable pull-through.","alternative":"Cable pull-through; 45-degree hip extension.","errors":"Rounding at the bottom; bending the knees into a squat; jerking off the turn; looking up hard; progressing load and range in the same week.","lumbar":"If you cannot feel hamstrings stretching, the hips are not going back far enough - reset with the dowel drill. THE most important exercise to do perfectly. Introduced only after the dowel-hinge gate (15 perfect reps, 2 sessions). Loads stay 2+ RIR always in this programme.","shoulder":"Long arms, set blades - shoulder-quiet.","leftleg":"Even foot pressure; note if the left hamstring stretch feels different (record, do not chase).","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Any next-morning back stiffness above your normal = hold the load 1 week.","source":"Aasa 2015 technique-gated hinge; NIOSH lever/fatigue caution"},{"id":68,"name":"Overhead cable triceps extension (rope)","cat":"Hypertrophy - triceps","muscles":"Triceps long head (stretch-biased)","purpose":"Loads the long head at full stretch - the biggest lever for total triceps size.","equipment":"Cable at chest height, rope","setup":"Standing, facing away from the stack. Anchor the cable at chest height. Grab the rope, turn away, press it overhead, then step forward into a split stance so the cable pulls from behind your head.","startpos":"Elbows beside the ears pointing forward, hands behind the head, triceps stretched, ribs down, brace ON.","exec":"1) Straighten the arms forward-up until fully long, keeping the elbows still. 2) Squeeze 1 s. 3) Bend slowly (3 s) letting the hands travel behind the head into the deep stretch. 4) The ribs stay down - do not arch the lower back as the arms straighten.","breathing":"Exhale as you extend; brace prevents rib flare.","rom":"Deep stretch to lockout.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: lying DB triceps extension.","alternative":"Lying DB triceps extension to forehead level; single-arm overhead cable.","errors":"Elbows flaring wide; lower back arching; bouncing out of the stretch.","lumbar":"The brace and rib-down rule protect the lumbar spine; skip overhead version on amber shoulder days and do lying extensions. If you cannot stop the back arching, switch to the lying version that day.","shoulder":"Requires overhead room - use the lying alternative if shoulders disagree.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Lengthened-position triceps evidence (Maeo)"},{"id":69,"name":"Reverse EZ-bar curl","cat":"Hypertrophy - forearms/biceps","muscles":"Forearm extensors, brachioradialis; secondary: Biceps","purpose":"Direct forearm size and elbow health balance - the overhand grip covers the forearm's neglected side.","equipment":"EZ-bar or light barbell/DBs","setup":"Standing. Hold the EZ-bar with an OVERHAND grip (palms down) at the angled grips.","startpos":"Tall, elbows at sides, wrists straight (do not let them flop).","exec":"1) Curl the bar up keeping palms down and wrists locked straight. 2) Squeeze 1 s at the top. 3) Lower slowly (3 s).","breathing":"Exhale up.","rom":"Full, wrists neutral throughout.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"DB reverse curls; wrist roller.","errors":"Wrists collapsing; swinging; going too heavy.","lumbar":"Light and strict. Tall stance.","shoulder":"Quiet.","leftleg":"None.","stop":"Stop at wrist/elbow pain.","source":"Forearm coverage requirement"},{"id":70,"name":"Dumbbell split squat (Phase 3+; rear-foot-elevated Phase 4 option)","cat":"Hypertrophy - unilateral squat","muscles":"Quads, glutes (front leg); secondary: Adductors, core, balance","purpose":"The heavy unilateral leg builder - forces the left leg to carry its own load with the spine under half the weight a squat would need.","equipment":"Dumbbells, optional bench (Phase 4)","setup":"Standing split stance. Long split stance, front foot flat, back heel up. DBs at the sides. (Phase 4 option: rear foot on a low bench.)","startpos":"Torso tall with a SLIGHT forward lean, hips square, brace on.","exec":"1) Lower straight down bending both knees until the back knee approaches the floor (or your comfortable depth). 2) Front heel stays heavy; front knee tracks over the toes. 3) Drive up through the front foot. 4) ALL reps LEFT LEG FORWARD FIRST, then right leg matches the left's reps and load.","breathing":"Exhale on the drive up; brace throughout.","rom":"Back-knee-toward-floor depth as control allows.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range. Left side gates all progression.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: split squat holding one hand support, or leg press single-leg.","alternative":"Single-leg press; step-up.","errors":"Front knee caving inward (the left will try); bouncing the back knee off the floor; leaning far forward; short range on the left while full range on the right.","lumbar":"Hold a rail with one hand any day balance is off - support beats wobble. Half the axial load of a squat at equal leg stimulus - exactly why it is here.","shoulder":"DBs hang at sides - shoulder-quiet.","leftleg":"THE flagship left-leg strength exercise of Phases 3-4. Left first, left sets the numbers, +1 set left when prescribed.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop the set if the left knee wobbles uncontrollably.","source":"Unilateral loading for asymmetry; spine-load management"},{"id":71,"name":"Single-arm dumbbell row (bench supported)","cat":"Hypertrophy - horizontal pull","muscles":"Lats, mid-back (one side); secondary: Biceps, rear delt, core (anti-rotation)","purpose":"Unilateral back work with three-point support - big stimulus, braced spine, and a built-in anti-rotation challenge.","equipment":"Flat bench, dumbbell","setup":"One knee and same-side hand on bench, other foot on floor. LEFT hand and LEFT knee on the bench, right foot planted wide, back flat like a table, DB in the RIGHT hand hanging.","startpos":"Back neutral, brace on, shoulder blade relaxed down toward the floor.","exec":"1) Row the DB up to the hip crease, elbow brushing the ribs, blade squeezing back. 2) Pause 1 s. 3) Lower slowly to the full stretch without the torso twisting open. 4) All reps one side, swap. Do the side with the WEAKER-feeling lat first.","breathing":"Exhale on the row; brace holds the torso square.","rom":"Full hang to hip.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: chest-supported row.","alternative":"Chest-supported row; cable row.","errors":"Torso rotating open; yanking; rounding the back; shrugging.","lumbar":"Three points of contact stay planted; the spine stays table-flat. Bench support + brace makes this the safest heavy unilateral pull; keep the torso square.","shoulder":"Elbow path close to the body suits most shoulders.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Supported unilateral loading principle"},{"id":72,"name":"45-degree hip extension (glute-focused, Phase 3+)","cat":"Hypertrophy - glutes/hamstrings","muscles":"Glutes, hamstrings; secondary: Spinal erectors (isometric)","purpose":"Hip-hinge isolation on the bench - glute and hamstring growth with a rounded-upper-back trick that keeps the lumbar spine neutral and quiet.","equipment":"45-degree back extension bench","setup":"Face down, pads at hip crease. Pads BELOW the hip bones so the hips can fold freely. Feet anchored, toes turned out slightly (glute bias).","startpos":"Arms crossed, upper back deliberately relaxed/slightly rounded, chin tucked - the hinge happens at the HIPS only.","exec":"1) Lower by folding at the hips until the hamstrings stretch (torso ~60-80 degrees down). 2) Squeeze the GLUTES to raise the torso back to the straight-body line - not a centimetre past. 3) Pause 1 s squeezing. The lumbar spine stays in the same neutral-ish shape the entire time; only the hips open and close.","breathing":"Exhale up; light brace throughout.","rom":"Hip-fold stretch to body-line; never hyperextended.","progression":"Reps 10->15, then hold a plate (+2.5-5 kg).","regression":"Reduce range; return to glute bridges. Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable pull-through; hip thrust.","errors":"Arching up past body-line; hinging from the back instead of the hips; jerking.","lumbar":"Introduced Phase 3 only, after the back-extension iso holds are established. The glute-focused (rounded-upper-back, hips-only) style specifically minimises lumbar erector strain vs the 'back extension' style.","shoulder":"None.","leftleg":"Even drive through both feet; note left hamstring/glute fatigue difference.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Glute-biased hip extension; progression from iso holds"},{"id":73,"name":"Preacher curl (EZ-bar or machine)","cat":"Hypertrophy - biceps","muscles":"Biceps; secondary: Forearms","purpose":"Strict biceps work with the upper arms locked on a pad - zero cheating, zero back involvement.","equipment":"Preacher bench + EZ-bar, or preacher machine","setup":"Seated, chest against pad, upper arms on the slope. Adjust seat so armpits sit snugly over the pad top, upper arms flat on the slope. Grip the EZ-bar at the angled grips, hands shoulder-width.","startpos":"Arms nearly straight down the pad (stop just short of fully locked), wrists neutral.","exec":"1) Curl the bar up until forearms are just past vertical. 2) Squeeze 1 s. 3) Lower slowly (3-4 s) to the near-straight start - the lowering half is where this exercise earns its keep. 4) Chest stays on the pad.","breathing":"Exhale up.","rom":"Near-straight to just-past-vertical.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Machine curl; incline DB curl.","errors":"Bouncing out of the bottom; lifting elbows off the pad; leaning back.","lumbar":"Never drop fast into the fully straight arm - control the last quarter. Chest support removes the back entirely.","shoulder":"Elbow-friendly if the bottom is controlled.","leftleg":"None.","stop":"Stop at any sharp elbow or forearm pain.","source":"Strict isolation; supported positions principle"},{"id":74,"name":"Trap-bar deadlift from raised blocks (Phase 4, gated)","cat":"Hypertrophy/strength - hinge compound","muscles":"Glutes, quads, hamstrings; secondary: Traps, forearms, whole core","purpose":"The graduation lift: a real deadlift pattern with the friendliest possible spine mechanics - neutral grip, load beside you, raised start.","equipment":"Trap bar (hex bar), blocks/steps raising the handles ~5-10 cm","setup":"Standing inside the bar. Bar on blocks so the handles sit mid-shin-to-knee height. Stand centred, feet hip-width.","startpos":"Hinge down with the dowel-drill mechanics, grip both handles, chest tall, back neutral, lats set ('protect your armpits'), brace HARD.","exec":"1) Push the floor away, standing up in one piece - hips and chest rise together. 2) Stand tall, glutes squeezed - no lean-back. 3) Hinge back down with control to the blocks, reset the brace, repeat. Every rep starts from a dead stop with a fresh brace.","breathing":"Big breath + hard brace before EVERY rep; exhale through the top half.","rom":"Blocks to standing; range lowers only across weeks of proof.","progression":"+5 kg when all reps crisp at RIR 3+ for 2 sessions; stays >=2 RIR through Week 16; NO 1RM testing this programme.","regression":"Return to DB RDL. Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"DB RDL; leg press + back extension combo.","errors":"Jerking off the blocks; rounding as fatigue builds (fatigue shifts lifters into flexion - why sets stay at 5-8 reps); rep-to-rep touch-and-go bouncing; ego loading from memory of old numbers.","lumbar":"Dead-stop reps with a fresh brace each time; sets capped at 8 reps to keep fatigue from degrading form. The final exam of the 16 weeks - only reached through every gate before it. Neutral grip beside the body roughly halves the lever arm vs a straight bar.","shoulder":"Neutral handles - shoulder-friendly.","leftleg":"Even drive; if the left leg's push feels absent, stop and note it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Any next-morning symptom rise = drop back one load step for a week.","source":"Aasa 2015; RTP timelines (approx. month 5-6 = weeks 13-16); NIOSH fatigue-flexion data"}],"presc":[{"id":0,"ex":0,"sets":"2","reps":"","dur":"5 breaths + 5 brace holds","rest":"none","rir":"","rpe":"","tempo":"4 s in, 6 s out","load":"Bodyweight only.","notes":""},{"id":1,"ex":1,"sets":"1","reps":"","dur":"8-10 slow cycles","rest":"none","rir":"","rpe":"","tempo":"3-4 s per direction","load":"Bodyweight.","notes":""},{"id":2,"ex":2,"sets":"1","reps":"10-12","dur":"","rest":"none","rir":"","rpe":"","tempo":"1 s up, 2 s hold, 2 s down","load":"Bodyweight.","notes":""},{"id":3,"ex":3,"sets":"1","reps":"5/side x 5 s hold","dur":"","rest":"none","rir":"","rpe":"","tempo":"2 s out, 5 s hold, 2 s back","load":"Bodyweight. If shaky, start with leg-only.","notes":""},{"id":4,"ex":4,"sets":"1","reps":"","dur":"8-10 gentle cycles","rest":"none","rir":"","rpe":"","tempo":"3-4 s per cycle","load":"Bodyweight.","notes":""},{"id":5,"ex":5,"sets":"1","reps":"8-10","dur":"","rest":"none","rir":"","rpe":"","tempo":"3 s up, 3 s down","load":"Bodyweight.","notes":""},{"id":6,"ex":6,"sets":"1","reps":"","dur":"2-3 min","rest":"none","rir":"","rpe":"","tempo":"Brisk but easy","load":"Bodyweight.","notes":""},{"id":7,"ex":7,"sets":"1","reps":"","dur":"3-4 spots x 2-3 breaths","rest":"30 s","rir":"","rpe":"","tempo":"2-3 breaths per spot","load":"Bodyweight.","notes":""},{"id":8,"ex":8,"sets":"2","reps":"10","dur":"","rest":"45 s","rir":"","rpe":"","tempo":"2 s down, 2 s up, 2 s plus","load":"Wall angle.","notes":""},{"id":9,"ex":9,"sets":"2","reps":"","dur":"10-12/side","rest":"45 s","rir":"","rpe":"","tempo":"2 s up, 1 s pause, 3 s down","load":"1-2 kg (yes, that light).","notes":""},{"id":10,"ex":10,"sets":"2","reps":"","dur":"6 trios","rest":"60 s","rir":"","rpe":"","tempo":"2 s up, 1 s squeeze, 2 s down each le 'use strict';
const LS_KEY = 'ptapp_v1';
let storageOK = true;
let S = { gaps: [], logs: {}, lights: {}, metrics: {} };
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) S = Object.assign(S, JSON.parse(raw));
  if (!Array.isArray(S.gaps)) S.gaps = [];
  if (!S.metrics || typeof S.metrics !== 'object') S.metrics = {};
} catch (e) { storageOK = false; }
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { if (storageOK) { storageOK = false; toast('⚠️ Saving unavailable — export your data before closing'); } }
}

/* ---------- date helpers ---------- */
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d, 12); }
function iso(dt) { return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function addD(isoStr, n) { const d = pd(isoStr); d.setDate(d.getDate()+n); return iso(d); }
function todayISO() { return iso(new Date()); }
function fmt(isoStr) { const d = pd(isoStr); return DOWS[d.getDay()] + ' ' + d.getDate() + ' ' + MONS[d.getMonth()]; }

/* ---------- programme lookups ---------- */
const DAYS = DATA.days, EX = DATA.exercises, PR = DATA.presc, PH = DATA.phases;
/* Postponed dates are "gaps": programme days occupy calendar dates in order,
   skipping every date in S.gaps. */
let _eff = null;
function effArr() {
  if (_eff) return _eff;
  const gaps = new Set(S.gaps);
  _eff = []; let d = DAYS[0].date;
  for (let i = 0; i < DAYS.length; ) {
    if (gaps.has(d)) { d = addD(d, 1); continue; }
    _eff.push(d); i++; d = addD(d, 1);
  }
  return _eff;
}
function invalidateEff() { _eff = null; }
function effDate(i) { return effArr()[i]; }
function dayByEff(isoStr) { return effArr().indexOf(isoStr); }
function isGap(isoStr) { return S.gaps.indexOf(isoStr) !== -1; }
const COMPS = [
  { k:'morning',     label:'Morning Routine',      icon:'☀️', time:'On waking · 10–15 min' },
  { k:'foundation',  label:'Foundation & Injury Prevention', icon:'🛡️', time:'~30 min' },
  { k:'hypertrophy', label:'Hypertrophy',          icon:'🏋️', time:'~30 min' },
  { k:'prebed',      label:'Pre-Bed Routine',      icon:'🌙', time:'30–60 min before sleep · 10–15 min' }
];
function compMeta(k) { return COMPS.find(c => c.k === k); }

/* ---------- log access ---------- */
function dayLog(i) { const d = DAYS[i].date; if (!S.logs[d]) S.logs[d] = {}; return S.logs[d]; }
function exLog(i, pid, create) {
  const dl = dayLog(i);
  if (!dl[pid] && create) dl[pid] = { sets: [], pain: null, note: '', done: false, ts: null };
  return dl[pid];
}
function isRepBased(p) { return /\d/.test(p.reps); }
function exDone(i, pid) { const l = (S.logs[DAYS[i].date]||{})[pid]; return !!(l && l.done); }
function compProgress(i, k) {
  const list = DAYS[i][k];
  const done = list.filter(pid => exDone(i, pid)).length;
  return [done, list.length];
}
function dayProgress(i) {
  let t = 0, d = 0;
  COMPS.forEach(c => { const [a,b] = compProgress(i, c.k); d += a; t += b; });
  return [d, t];
}
function lastPerformance(exId, beforeIdx) {
  for (let i = beforeIdx - 1; i >= 0; i--) {
    const dl = S.logs[DAYS[i].date]; if (!dl) continue;
    for (const pid of Object.keys(dl)) {
      if (PR[pid] && PR[pid].ex === exId) {
        const l = dl[pid];
        const sets = (l.sets||[]).filter(s => s && (s.w != null || s.r != null || s.d));
        if (sets.length || l.done) return { idx: i, log: l, sets };
      }
    }
  }
  return null;

/* ---------- tempo timer ---------- */
function midOfRange(str) {
  const m = String(str).match(/(\d+)(?:\s*-\s*(\d+))?/);
  if (!m) return null;
  return m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1];
}
function parseTempoPhases(tempo) {
  if (!tempo || !/\d\s*s\b/.test(tempo)) return null;
  const phases = [];
  tempo.split(',').forEach(seg => {
    seg = seg.trim(); if (!seg) return;
    const m = seg.match(/^(?:~)?(\d+)(?:\s*-\s*(\d+))?\s*s\s+(.+)$/);
    if (m) {
      const dur = m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1];
      let label = m[3].replace(/\beach .*$/,'').trim();
      phases.push({ label: label || 'move', dur: Math.max(1, dur) });
    } else {
      const m2 = seg.match(/^(controlled|slow)\s+(.+)$/i);
      if (m2) phases.push({ label: m2[2].trim(), dur: 2 });
    }
  });
  return phases.length ? phases : null;
}
function parseTimeSec(str) {
  if (!str) return null;
  let m = String(str).match(/(\d+)(?:\s*-\s*(\d+))?\s*min/i);
  if (m) return (m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1]) * 60;
  m = String(str).match(/(\d+)(?:\s*-\s*(\d+))?\s*s\b/);
  if (m) return m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1];
  return null;
}
function timerCfg(p) {
  const ex = EX[p.ex];
  const sides = /\/\s*side|per side|per leg|per arm|\/\s*leg|\/\s*arm/i.test((p.reps || '') + ' ' + (p.dur || ''));
  const sets = parseInt(p.sets) || 1;
  const restSec = parseTimeSec(p.rest) || 0;
  if (isRepBased(p)) {
    const phases = parseTempoPhases(p.tempo);
    if (!phases) return null;
    const reps = midOfRange(p.reps);
    if (!reps) return null;
    return { title: ex.name, mode: 'reps', sets, reps, phases, restSec, sides, tempo: p.tempo };
  }
  const holdSec = parseTimeSec(p.dur) || parseTimeSec(p.tempo);
  if (!holdSec) return null;
  return { title: ex.name, mode: 'time', sets, holdSec, restSec, sides, tempo: p.dur || p.tempo };
}
const T = { on: false, iv: null, wl: null };
function vib(pat) { try { if (navigator.vibrate) navigator.vibrate(pat); } catch (e) {} }
async function wakeOn() { try { T.wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
function wakeOff() { try { if (T.wl) { T.wl.release(); T.wl = null; } } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (T.on && document.visibilityState === 'visible' && !T.paused) wakeOn();
});
function timerQueueForSet(cfg) {
  const q = [{ kind: 'ready', label: 'Get ready', dur: 5 }];
  const work = [];
  if (cfg.mode === 'reps') {
    for (let r = 1; r <= cfg.reps; r++) cfg.phases.forEach(ph => work.push({ kind: 'phase', label: ph.label, dur: ph.dur, rep: r }));
  } else {
    work.push({ kind: 'phase', label: 'Hold / work', dur: cfg.holdSec, rep: 1 });
  }
  q.push(...work);
  if (cfg.sides) {
    q.push({ kind: 'switch', label: 'Switch sides', dur: 5 });
    work.forEach(w => q.push(Object.assign({}, w, { side2: true })));
  }
  return q;
}
function startTimer(cfg) {
  T.on = true; T.cfg = cfg; T.set = 1; T.q = timerQueueForSet(cfg); T.qi = 0; T.sec = 0;
  T.paused = false; T.doneAll = false;
  wakeOn(); vib(60);
  clearInterval(T.iv);
  T.iv = setInterval(timerTick, 1000);
  drawTimer();
}
function stopTimer() {
  T.on = false; clearInterval(T.iv); T.iv = null; wakeOff();
  document.getElementById('overlay').innerHTML = '';
}
function timerAdvance() {
  T.sec = 0; T.qi++;
  const cur = T.q[T.qi];
  if (!cur) { // work queue finished for this set
    if (T.set < T.cfg.sets) {
      vib([80, 60, 80]);
      if (T.cfg.restSec > 0) { T.q = [{ kind: 'rest', label: 'Rest', dur: T.cfg.restSec }]; T.qi = 0; }
      else { T.set++; T.q = timerQueueForSet(T.cfg); T.qi = 0; }
    } else {
      T.doneAll = true; clearInterval(T.iv); T.iv = null; vib([100, 70, 100, 70, 250]); wakeOff();
    }
    return;
  }
  if (cur.kind === 'phase' && T.cfg.mode === 'reps') {
    const prev = T.q[T.qi - 1];
    if (!prev || prev.kind !== 'phase' || prev.rep !== cur.rep) vib(35);
  } else vib(45);
}
function timerTick() {
  if (T.paused || T.doneAll) return;

  const cur = T.q[T.qi];
  if (cur && T.sec >= cur.dur) {
    if (cur.kind === 'rest') { T.set++; T.q = timerQueueForSet(T.cfg); T.qi = -1; }
    timerAdvance();
  }
  drawTimer();
}
function ensureTimerDOM() {
  const o = document.getElementById('overlay');
  if (o.querySelector('.tmr')) return;
  o.innerHTML =
    '<div class="tmr"><div class="hd"><div class="nm">' + esc(T.cfg.title) + '</div>' +
    '<div class="meta" id="t-meta"></div><div class="dots" id="t-dots"></div></div>' +
    '<div class="mid"><div class="phase" id="t-phase"></div>' +

    '<div class="ctl" id="t-ctl"></div></div>';
