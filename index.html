}
function drawTimerCtl() {
  const c = document.getElementById('t-ctl'); if (!c) return;
  c.innerHTML = T.doneAll
    ? '<button class="primary" onclick="A.timerEnd()">Log my sets</button>'
    : '<button onclick="A.timerPause()">' + (T.paused ? 'Resume' : 'Pause') + '</button>' +
      '<button onclick="A.timerSkip()">Skip ›</button>' +
      '<button class="exit" onclick="A.timerEnd()">End</button>';
}
function drawTimer() {
  if (!T.on) return;
  ensureTimerDOM();
  const cfg = T.cfg, cur = T.q[T.qi];
  let phaseCls = '', label = '', big = '', sub = '', repLine = '';
  if (T.doneAll) {
    label = 'Complete 🎉'; big = '✓'; sub = 'Nice work. Log your actual sets, reps and RIR below.';
  } else if (cur) {
    label = cur.label;
    phaseCls = cur.kind === 'rest' ? 'rest' : (cur.kind === 'ready' || cur.kind === 'switch') ? 'ready' : '';
    const remain = cur.dur - T.sec;
    if (cur.kind === 'rest') {
      const r = Math.max(0, remain);
      big = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0');
      sub = 'Next: set ' + (T.set + 1) + ' of ' + cfg.sets;
    } else if (cur.kind === 'ready' || cur.kind === 'switch') {
      big = String(Math.max(0, remain));
      sub = cur.kind === 'switch' ? 'Same again on the other side' : (cfg.mode === 'reps' ? 'Set ' + T.set + ' — ' + cfg.reps + ' reps at tempo' : 'Set ' + T.set);
    } else {
      big = String(Math.min(T.sec + 1, cur.dur));
      sub = cfg.tempo || '';
      if (cfg.mode === 'reps') repLine = 'Rep <b>' + cur.rep + '</b> of ' + cfg.reps + (cfg.sides ? (cur.side2 ? ' · second side' : ' · first side') : '');
    }
  }
  document.getElementById('t-meta').innerHTML = 'Set <b>' + Math.min(T.set, cfg.sets) + '</b> of ' + cfg.sets + (repLine ? ' · ' + repLine : '');
  document.getElementById('t-dots').innerHTML = Array.from({ length: cfg.sets }, (_, s) =>
    '<span class="' + (s + 1 < T.set || T.doneAll ? 'on' : s + 1 === T.set ? 'cur' : '') + '"></span>').join('');
  const ph = document.getElementById('t-phase');
  ph.className = 'phase ' + phaseCls; ph.textContent = label;
  document.getElementById('t-cnt').textContent = big;
  document.getElementById('t-sub').textContent = sub;
  if (T.doneAll && !document.querySelector('#t-ctl .primary')) drawTimerCtl();
}

/* ---------- view: metrics ---------- */
const METRICS = [
  { k: 'weight', label: 'Body weight', u: 'kg', s: 'wt' },
  { k: 'chest', label: 'Chest', u: 'cm', s: 'chest' },
  { k: 'waist', label: 'Waist (navel)', u: 'cm', s: 'waist' },
  { k: 'hips', label: 'Hips', u: 'cm', s: 'hips' },
  { k: 'armL', label: 'Upper arm — left', u: 'cm', s: 'arm L' },
  { k: 'armR', label: 'Upper arm — right', u: 'cm', s: 'arm R' },
  { k: 'thighL', label: 'Thigh — left (15 cm above kneecap)', u: 'cm', s: 'thigh L' },
  { k: 'thighR', label: 'Thigh — right (15 cm above kneecap)', u: 'cm', s: 'thigh R' },
  { k: 'calfL', label: 'Calf — left', u: 'cm', s: 'calf L' },
  { k: 'calfR', label: 'Calf — right', u: 'cm', s: 'calf R' }
];
function lastMetricBefore(k, dateISO) {
  const ds = Object.keys(S.metrics).filter(d => d < dateISO && S.metrics[d][k] != null).sort();
  return ds.length ? S.metrics[ds[ds.length - 1]][k] : null;
}
function vMetrics(dateArg) {
  drawNav('metrics');
  const date = dateArg || todayISO();
  const entry = S.metrics[date] || {};
  let html = '<div class="topbar"><h2 style="font-size:20px;padding:6px 0 2px">Measurements</h2></div>' +
    '<div class="card"><div style="display:flex;align-items:center;gap:10px;justify-content:space-between">' +
    '<span class="muted">Measuring on</span>' +
    '<input type="date" class="mdate" value="' + date + '" onchange="location.hash=\'metrics/\'+this.value">' +
    '</div><p class="tiny" style="margin:8px 0 2px">Measure relaxed, same time of day (ideally Thursday morning, per the programme). Grey = your previous reading. Fill only what you measured — it saves as you type.</p></div>' +
    '<div class="card">';
  METRICS.forEach(m => {
    const prev = lastMetricBefore(m.k, date);
    html += '<div class="mrow"><label>' + m.label + ' <span class="u">' + m.u + '</span></label>' +
      '<input type="number" inputmode="decimal" step="0.1" min="0" placeholder="' + (prev != null ? prev : '') + '" value="' + (entry[m.k] != null ? entry[m.k] : '') + '" onchange="A.setMetric(\'' + date + '\',\'' + m.k + '\',this.value)"></div>';
  });
  html += '</div>';
  const hist = Object.keys(S.metrics).filter(d => Object.keys(S.metrics[d]).length).sort().reverse();
  if (hist.length) {
    html += '<div class="phasehead">History</div><div class="card" style="padding:4px 16px">';
    hist.forEach(d => {
      const e = S.metrics[d];
      const vals = METRICS.filter(m => e[m.k] != null).map(m => m.s + ' ' + e[m.k]).join(' · ');
      html += '<div class="mhist"><span class="dt">' + fmt(d) + '</span>' +
        '<span class="vals" onclick="location.hash=\'metrics/' + d + '\'">' + esc(vals) + '</span>' +
        '<button class="del" onclick="A.delMetric(\'' + d + '\')">🗑</button></div>';
    });
    html += '</div>';
    html += '<button class="exportbtn" onclick="A.exportMetrics(true)">📤 Share measurements (CSV)</button>';
  }
  html += '<div style="height:16px"></div>';
  $app.innerHTML = html;
}

/* ---------- view: dictionary ---------- */
let dictQ = '';
function vDict() {
  drawNav('dict');
  const q = dictQ.toLowerCase();
  const items = EX.filter(e => !q || e.name.toLowerCase().includes(q) || e.muscles.toLowerCase().includes(q) || e.cat.toLowerCase().includes(q));
  let html = '<div class="topbar"><h2 style="font-size:20px;padding:6px 0 2px">Exercise dictionary</h2></div>' +
    '<input class="search" placeholder="Search ' + EX.length + ' exercises…" value="' + esc(dictQ) + '" oninput="A.dictSearch(this.value)">' +
    '<div class="card" style="padding:4px 16px">';
  items.forEach(e => {
    html += '<div class="exrow" onclick="location.hash=\'dict/' + e.id + '\'">' +
      '<div class="bd"><div class="nm">' + esc(e.name) + '</div><div class="sub">' + esc(e.muscles.split(';')[0]) + '</div></div><div class="arr">›</div></div>';
  });
  if (!items.length) html += '<p class="muted">No matches.</p>';
  html += '</div><div style="height:16px"></div>';
  $app.innerHTML = html;
  if (dictQ) { const s = $app.querySelector('.search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}
function vDictEntry(id) {
  drawNav('dict');
  const e = EX[id];
  const SECTIONS = [
    ['Equipment', e.equipment], ['Setup', e.setup], ['Starting position', e.startpos],
    ['How to perform', e.exec], ['Breathing & bracing', e.breathing], ['Range of motion', e.rom],
    ['Common errors', e.errors], ['Lumbar safety notes', e.lumbar], ['Shoulder safety notes', e.shoulder],
    ['Left-leg notes', e.leftleg], ['Stop cues — when to stop the set', e.stop],
    ['Progression rule', e.progression], ['Regression rule (easier options)', e.regression],
    ['Alternative exercise', e.alternative], ['Evidence / rationale', e.source]
  ].filter(s => s[1] && s[1] !== 'None.' && s[1] !== 'None');
  let html = '<button class="backlink" onclick="history.back()">‹ Back</button>' +
    '<div class="card"><div class="tiny">' + esc(e.cat) + '</div>' +
    '<h2 style="font-size:19px;margin:3px 0 6px">' + esc(e.name) + '</h2>' +
    '<div class="muted"><b style="color:var(--txt)">Muscles:</b> ' + esc(e.muscles) + '</div>' +
    '<div class="muted" style="margin-top:6px"><b style="color:var(--txt)">Why:</b> ' + esc(e.purpose) + '</div></div>';
  SECTIONS.forEach(s => {
    html += '<details class="acc"><summary>' + esc(s[0]) + '</summary><div class="bd">' + esc(s[1]) + '</div></details>';
  });
  html += '<div style="height:16px"></div>';
  $app.innerHTML = html;
}

/* ---------- view: progress / data ---------- */
function vProgress() {
  drawNav('prog');
  const t = todayISO();
  const ti = dayByEff(t);
  const curWeek = ti >= 0 ? DAYS[ti].week : (t < effDate(0) ? 1 : 16);
  let html = '<div class="topbar"><h2 style="font-size:20px;padding:6px 0 2px">Your data</h2></div>';
  html += shiftBannerHTML();
  for (let w = curWeek; w >= Math.max(1, curWeek - 1); w--) {
    const wdays = DAYS.map((d, i) => [d, i]).filter(x => x[0].week === w);
    html += '<div class="phasehead">Week ' + w + (w === curWeek ? ' · current' : '') + '</div><div class="card" style="padding:4px 16px">';
    wdays.forEach(([d, i]) => {
      const [a, b] = dayProgress(i);
      const light = S.lights[d.date];
      const st = a === 0 ? '<span style="color:var(--faint)">—</span>' :
        (a === b ? '<span style="color:var(--green)">✓ ' + a + '/' + b + '</span>' : '<span style="color:var(--amber)">' + a + '/' + b + '</span>');
      html += '<div class="weekrow" onclick="location.hash=\'day/' + effDate(i) + '\'">' +
        '<span class="dt">' + fmt(effDate(i)) + '</span><span>' + esc(d.focus.split('(')[0].trim()) + '</span>' +
        '<span class="st">' + (light ? (light === 'G' ? '🟢' : light === 'A' ? '🟠' : '🔴') + ' ' : '') + st + '</span></div>';
    });
    html += '</div>';
  }
  html += '<div class="phasehead">Export for Friday review</div>' +
    '<button class="exportbtn" onclick="A.exportCSV(true)">📤 Share training log (CSV)</button>' +
    '<button class="exportbtn" onclick="A.exportCSV(false)">⬇️ Download training log (CSV)</button>' +
    '<button class="exportbtn" onclick="A.exportMetrics(true)">📏 Share measurements (CSV)</button>' +
    '<p class="tiny" style="margin:4px 2px">Send these CSVs to Claude in the “My Personal Trainer” project each Friday for your weekly review — the measurements feed the dashboard.</p>' +
    '<div class="phasehead">Backup</div>' +
    '<button class="exportbtn" onclick="A.backup()">💾 Download full backup (JSON)</button>' +
    '<button class="exportbtn" onclick="document.getElementById(\'restoreFile\').click()">📥 Restore from backup</button>' +
    '<input type="file" id="restoreFile" accept=".json" style="display:none" onchange="A.restore(this)">' +
    '<div class="phasehead">Danger zone</div><div class="dangerzone">' +
    '<button class="exportbtn" onclick="A.wipe()">🗑 Erase all logged data</button></div>' +
    '<p class="tiny" style="margin:8px 2px">' + esc(DATA.version) + ' · data stays on this phone only' + (storageOK ? '' : ' · ⚠️ storage unavailable in this browser — export after every session') + '</p>' +
    '<div style="height:16px"></div>';
  $app.innerHTML = html;
}

/* ---------- actions ---------- */
window.A = {
  moveDay(n) { viewDate = addD(viewDate, n); location.hash = 'day/' + viewDate; if (location.hash === '#day/' + viewDate) render(); },
  jumpToday() { viewDate = todayISO(); location.hash = 'day/' + viewDate; },
  setLight(i, L) {
    const d = DAYS[i].date;
    S.lights[d] = S.lights[d] === L ? null : L; save(); render();
  },
  postpone() {
    modal('Postpone to tomorrow?',
      'Today becomes a rest day, and today\'s session plus the <b>entire remaining programme</b> move forward one day. Nothing is skipped — Week 16 just ends a day later.',
      'Postpone', () => {
        const t = todayISO();
        if (S.gaps.indexOf(t) === -1) S.gaps.push(t);
        invalidateEff(); save(); toast('Programme moved +1 day 👍'); viewDate = t; render();
      });
  },
  unshift() {
    modal('Undo postponement?', 'The most recent postponed day is removed and the programme moves back one day to its earlier schedule.', 'Move back',
      () => { S.gaps.pop(); invalidateEff(); save(); render(); });
  },
  setVal(i, pid, s, f, v) {
    const l = exLog(i, pid, true);
    while (l.sets.length <= s) l.sets.push({});
    l.sets[s][f] = v === '' ? null : (f === 'rir' ? v : parseFloat(v));
    l.ts = l.ts || new Date().toISOString(); save();
  },
  toggleSet(i, pid, s) {
    const l = exLog(i, pid, true);
    while (l.sets.length <= s) l.sets.push({});
    l.sets[s].d = !l.sets[s].d;
    l.ts = new Date().toISOString(); save(); render();
  },
  addSet(i, pid) {
    const l = exLog(i, pid, true);
    const n = Math.max(parseInt(PR[pid].sets) || 1, l.sets.length);
    while (l.sets.length < n + 1) l.sets.push({});
    save(); render();
  },
  setPain(i, pid, v, el) {
    const l = exLog(i, pid, true); l.pain = +v; save();
    document.getElementById('painval').textContent = v;
  },
  setNote(i, pid, v) { const l = exLog(i, pid, true); l.note = v; save(); },
  markDone(i, pid, idx, k) {
    const l = exLog(i, pid, true);
    l.done = !l.done;
    if (l.done) {
      const n = parseInt(PR[pid].sets) || 1;
      while (l.sets.length < n) l.sets.push({});
      l.sets.forEach(s => s.d = true);
      l.ts = new Date().toISOString();
    }
    save();
    const list = DAYS[i][k];
    if (l.done && idx < list.length - 1) location.replace('#ex/' + i + '/' + k + '/' + (idx + 1));
    else if (l.done) { toast('🎉 ' + compMeta(k).label + ' finished'); history.back(); }
    else render();
  },
  dictSearch(v) { dictQ = v; vDict(); },
  startTimer(pid) {
    const cfg = timerCfg(PR[pid]); if (!cfg) return;
    startTimer(cfg);
  },
  timerPause() {
    T.paused = !T.paused;
    if (T.paused) wakeOff(); else wakeOn();
    drawTimerCtl(); drawTimer();
  },
  timerSkip() {
    const cur = T.q[T.qi];
    if (cur && cur.kind === 'rest') { T.set++; T.q = timerQueueForSet(T.cfg); T.qi = -1; }
    timerAdvance(); drawTimer();
  },
  timerEnd() {
    stopTimer();
    const logCard = document.querySelector('.setrow');
    if (logCard) logCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  setMetric(date, k, v) {
    if (!S.metrics[date]) S.metrics[date] = {};
    if (v === '') delete S.metrics[date][k];
    else S.metrics[date][k] = parseFloat(v);
    if (!Object.keys(S.metrics[date]).length) delete S.metrics[date];
    save();
  },
  delMetric(date) {
    modal('Delete these measurements?', fmt(date) + ' — this entry will be removed.', 'Delete', () => {
      delete S.metrics[date]; save();
      location.hash = 'metrics'; render();
    });
  },
  exportMetrics(share) {
    const dates = Object.keys(S.metrics).filter(d => Object.keys(S.metrics[d]).length).sort();
    if (!dates.length) return toast('No measurements yet');
    const rows = [['date'].concat(METRICS.map(m => m.k + '_' + (m.u === 'kg' ? 'kg' : 'cm')))];
    dates.forEach(d => rows.push([d].concat(METRICS.map(m => S.metrics[d][m.k] != null ? S.metrics[d][m.k] : ''))));
    const csv = rows.map(r => r.join(',')).join('\n');
    const name = 'measurements_' + todayISO() + '.csv';
    const file = new File([csv], name, { type: 'text/csv' });
    if (share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Measurements' }).catch(() => {});
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('CSV downloaded');
    }
  },
  exportCSV(share) {
    const rows = [['week','day','planned_date','logged_at','traffic_light','component','exercise','set','planned_sets','planned_reps_or_duration','target_rir','weight_kg','reps_done','rir','set_done','exercise_completed','pain_0_10','notes']];
    DAYS.forEach((d, i) => {
      const dl = S.logs[d.date]; if (!dl) return;
      COMPS.forEach(c => d[c.k].forEach(pid => {
        const l = dl[pid]; if (!l) return;
        const p = PR[pid], ex = EX[p.ex];
        const hasData = l.done || l.pain != null || (l.note || '') !== '' || (l.sets || []).some(s => s && (s.w != null || s.r != null || s.d));
        if (!hasData) return;
        const nSets = Math.max(parseInt(p.sets) || 1, (l.sets || []).length);
        for (let s = 0; s < nSets; s++) {
          const sl = (l.sets && l.sets[s]) || {};
          rows.push([d.week, d.dow, d.date, l.ts ? l.ts.slice(0, 10) : '', S.lights[d.date] || '', compMeta(c.k).label, ex.name, s + 1,
            p.sets, p.reps || p.dur, p.rir, sl.w != null ? sl.w : '', sl.r != null ? sl.r : '', sl.rir != null && sl.rir !== '' ? sl.rir : '',
            sl.d ? 1 : 0, l.done ? 1 : 0, s === 0 && l.pain != null ? l.pain : '', s === 0 ? (l.note || '') : '']);
        }
      }));
    });
    if (rows.length === 1) return toast('Nothing logged yet');
    const csv = rows.map(r => r.map(v => { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
    const name = 'training_log_' + todayISO() + '.csv';
    const file = new File([csv], name, { type: 'text/csv' });
    if (share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Training log' }).catch(() => {});
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('CSV downloaded');
    }
  },
  backup() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
    a.download = 'trainer_backup_' + todayISO() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Backup downloaded');
  },
  restore(input) {
    const f = input.files[0]; if (!f) return;
    f.text().then(txt => {
      try {
        const obj = JSON.parse(txt);
        if (typeof obj.logs !== 'object' || obj.logs === null) throw 0;
        S = Object.assign({ gaps: [], logs: {}, lights: {}, metrics: {} }, obj);
        if (!Array.isArray(S.gaps)) S.gaps = [];
        if (!S.metrics || typeof S.metrics !== 'object') S.metrics = {};
        invalidateEff(); save();
        toast('Backup restored ✓'); render();
      } catch (e) { toast('That file is not a valid backup'); }
    });
    input.value = '';
  },
  wipe() {
    modal('Erase everything?', 'All logged weights, reps, pain scores and postponements on this phone will be deleted. Export a backup first!', 'Erase', () => {
      S = { gaps: [], logs: {}, lights: {}, metrics: {} }; invalidateEff(); save(); toast('All data erased'); render();
    });
  }
};

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
render();

</script>
