<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c101a">
<title>My Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0c101a; --card:#151b28; --card2:#1c2434; --line:#252f44;
  --txt:#e8ecf4; --dim:#8b96ab; --faint:#5c6579;
  --acc:#a5b4fc; --acc-deep:#818cf8; --acc-ink:#10142a;
  --green:#4ade80; --amber:#fbbf24; --red:#f87171;
  --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px; line-height:1.45; overscroll-behavior-y:contain}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit}
h1,h2,h3{margin:0;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* top date bar */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,transparent);
  padding:10px 0 6px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.datebar .nav{width:44px;height:44px;border-radius:12px;background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:20px}
.datebar .mid{flex:1;text-align:center}
.datebar .mid .d1{font-size:17px;font-weight:700}
.datebar .mid .d2{font-size:12.5px;color:var(--dim)}
.todaybtn{display:block;margin:6px auto 0;font-size:13px;color:var(--acc);
  background:var(--card);border-radius:99px;padding:5px 14px}
.todaybtn.hide{display:none}

/* generic cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin:10px 0}
.chip{display:inline-block;background:var(--card2);border-radius:8px;
  padding:3px 9px;font-size:12.5px;color:var(--dim);margin:2px 4px 2px 0}
.chip b{color:var(--txt);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}
.progress{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.muted{color:var(--dim);font-size:13.5px}
.tiny{color:var(--faint);font-size:12px}

/* routine cards on day view */
.rcard{display:flex;align-items:center;gap:14px}
.rcard .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex:none;background:var(--card2)}
.rcard .bd{flex:1;min-width:0}
.rcard .arr{color:var(--faint);font-size:20px}
.rcard h3{font-size:16.5px}
.donebadge{color:var(--green);font-weight:700}

/* traffic light */
.lights{display:flex;gap:8px;margin-top:10px}
.lights button{flex:1;border-radius:12px;padding:9px 0;font-size:13px;font-weight:700;
  background:var(--card2);color:var(--dim);border:1.5px solid transparent}
.lights button.g.on{background:rgba(74,222,128,.14);color:var(--green);border-color:var(--green)}
.lights button.a.on{background:rgba(251,191,36,.14);color:var(--amber);border-color:var(--amber)}
.lights button.r.on{background:rgba(248,113,113,.14);color:var(--red);border-color:var(--red)}
.lightnote{font-size:12.5px;margin-top:8px;color:var(--dim)}

/* postpone */
.postpone{width:100%;border-radius:14px;padding:13px;text-align:center;font-weight:600;
  background:var(--card);border:1px dashed var(--line);color:var(--dim);font-size:14.5px}
.shiftbanner{background:rgba(165,180,252,.1);border:1px solid rgba(165,180,252,.35);
  border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--acc);margin:10px 0}
.shiftbanner button{color:var(--acc);font-weight:700;text-decoration:underline}

/* exercise list rows */
.exrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.exrow .num{width:30px;height:30px;border-radius:99px;background:var(--card2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--dim)}
.exrow.done .num{background:rgba(74,222,128,.15);color:var(--green)}
.exrow .bd{flex:1;min-width:0}
.exrow .nm{font-weight:600;font-size:15px}
.exrow .sub{font-size:12.5px;color:var(--dim);margin-top:1px}
.exrow .arr{color:var(--faint)}

/* exercise page */
.exhead{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.exhead .nav{width:40px;height:40px;border-radius:12px;background:var(--card);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:18px}
.exhead .nav[disabled]{opacity:.25}
.exhead .mid{flex:1;text-align:center}
.exhead .mid .k{font-size:12px;color:var(--dim)}
.exhead .mid h2{font-size:17px;line-height:1.25}
.chips{margin:10px 0 2px}
.setrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.setrow .sn{width:44px;flex:none;font-size:13px;font-weight:700;color:var(--dim)}
.setrow input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:10px;color:var(--txt);padding:10px 8px;text-align:center;font-size:16px;-moz-appearance:textfield}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setrow .f{flex:1;min-width:0}
.setrow select{background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:10px 4px;font-size:15px;width:100%;text-align:center}
.setrow .ck{width:46px;height:46px;flex:none;border-radius:12px;background:var(--card2);
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--faint)}
.setrow .ck.on{background:rgba(74,222,128,.15);border-color:var(--green);color:var(--green)}
.collabels{display:flex;gap:8px;margin:2px 0 -4px}
.collabels span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.addset{font-size:13px;color:var(--acc);font-weight:600;margin-top:6px}
.lastline{font-size:12.5px;color:var(--dim);background:var(--card2);border-radius:10px;
  padding:7px 11px;margin:8px 0}
textarea.note{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:10px;font-size:14.5px;min-height:54px;resize:vertical}
.painrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.painrow input[type=range]{flex:1;accent-color:var(--acc)}
.painval{width:56px;text-align:center;font-weight:800;font-size:17px;border-radius:10px;
  background:var(--card2);padding:7px 0}
.bigbtn{display:block;width:100%;border-radius:99px;padding:15px;text-align:center;
  font-size:16px;font-weight:700;background:var(--acc);color:var(--acc-ink);margin:14px 0 6px}
.bigbtn.done{background:rgba(74,222,128,.15);color:var(--green);border:1.5px solid var(--green)}
.bigbtn.sec{background:var(--card);color:var(--acc);border:1.5px solid var(--acc-deep)}
.bigbtn.start{background:linear-gradient(135deg,var(--acc),var(--acc-deep));color:var(--acc-ink);
  display:flex;align-items:center;justify-content:center;gap:8px}
.linkbtn{display:block;width:100%;text-align:center;color:var(--acc);font-weight:600;
  font-size:14.5px;padding:10px}

/* tempo timer overlay */
.tmr{position:fixed;inset:0;z-index:70;background:#090c14;display:flex;flex-direction:column;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.tmr .hd{text-align:center}
.tmr .hd .nm{font-size:16px;font-weight:700}
.tmr .hd .meta{color:var(--dim);font-size:14px;margin-top:4px}
.tmr .hd .meta b{color:var(--txt)}
.tmr .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tmr .phase{font-size:34px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.tmr .phase.rest{color:var(--green)}
.tmr .phase.ready{color:var(--amber)}
.tmr .cnt{font-size:110px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tmr .sub{color:var(--dim);font-size:14px;text-align:center;max-width:320px}
.tmr .dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.tmr .dots span{width:9px;height:9px;border-radius:99px;background:var(--card2)}
.tmr .dots span.on{background:var(--acc)}
.tmr .dots span.cur{background:var(--amber)}
.tmr .ctl{display:flex;gap:10px}
.tmr .ctl button{flex:1;border-radius:14px;padding:15px;font-size:15px;font-weight:700;
  background:var(--card);border:1px solid var(--line);color:var(--txt)}
.tmr .ctl button.primary{background:var(--acc);color:var(--acc-ink);border:none}
.tmr .ctl button.exit{color:var(--red)}

/* metrics */
.mrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.mrow label{flex:1;font-size:14.5px}
.mrow label .u{color:var(--faint);font-size:12px}
.mrow input{width:110px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:10px 8px;text-align:center;font-size:16px;-moz-appearance:textfield}
.mrow input::-webkit-outer-spin-button,.mrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mdate{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
  padding:9px 12px;font-size:15px;color-scheme:dark}
.mhist{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.mhist:last-child{border-bottom:none}
.mhist .dt{font-weight:700;font-size:13.5px;width:84px;flex:none}
.mhist .vals{flex:1;color:var(--dim);font-size:12.5px}
.mhist .del{color:var(--faint);font-size:16px;padding:6px}

/* accordions */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin:8px 0;overflow:hidden}
details.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;font-weight:600;font-size:15px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"+";color:var(--acc);font-size:19px;font-weight:400}
details.acc[open] summary:after{content:"–"}
details.acc .bd{padding:0 15px 13px;color:#c6cddb;font-size:14.5px;white-space:pre-wrap}

/* dictionary */
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  color:var(--txt);padding:12px 15px;font-size:15px;margin:8px 0}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:600;
  font-size:14px;padding:8px 0}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,17,26,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bnav .in{max-width:560px;margin:0 auto;display:flex}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--faint);padding:4px 0;font-weight:600}
.bnav button.on{color:var(--acc)}
.bnav svg{width:23px;height:23px}

/* modal confirm */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.7);display:flex;
  align-items:center;justify-content:center;padding:24px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px;max-width:340px;width:100%}
.modal h3{font-size:17px;margin-bottom:8px}
.modal p{color:var(--dim);font-size:14px;margin:0 0 16px}
.modal .row{display:flex;gap:10px}
.modal .row button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:14.5px}
.modal .cancel{background:var(--card2);color:var(--txt)}
.modal .ok{background:var(--acc);color:var(--acc-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 18px;
  border-radius:99px;font-size:14px;z-index:60;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.phasehead{margin:14px 0 2px;font-size:13px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.5px}
.weekrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.weekrow:last-child{border-bottom:none}
.weekrow .dt{width:86px;flex:none;color:var(--dim);font-size:13px}
.weekrow .st{margin-left:auto;font-size:12px;font-weight:700}
.exportbtn{display:block;width:100%;border-radius:14px;padding:14px;text-align:center;
  font-weight:700;font-size:15px;background:var(--card);border:1px solid var(--line);
  color:var(--acc);margin:10px 0}
.dangerzone{border-color:rgba(248,113,113,.3)}
.dangerzone .exportbtn{color:var(--red)}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<nav class="bnav"><div class="in" id="bnav"></div></nav>
<div id="overlay"></div>

<script>
const DATA = {"version":"v1.0 (2026-07-30)","phases":[{"name":"Phase 1 - Re-Entry & Movement Restoration","next":"Phase 2 adds goblet squats, short-range DB RDLs, heavier carries and straight-leg side planks."},{"name":"Phase 2 - Capacity & Volume Accumulation","next":"Phase 3 adds heavier 6-10 rep machine work, full-range RDLs, split squats and DB rows."},{"name":"Phase 3 - Progressive Hypertrophy Loading","next":"Phase 4 gates in the trap-bar deadlift and adds drop-set/rest-pause finishers on safe isolation work."},{"name":"Phase 4 - Advanced Hypertrophy & Consolidation","next":"Post-programme: transition to long-term training per Week 16 reassessment; barbell progressions continue only through the same gates."}],"exercises":[{"id":0,"name":"Diaphragmatic breathing with brace practice","cat":"Breathing / core activation","muscles":"Diaphragm, deep core (transverse abdominis); secondary: Pelvic floor","purpose":"Wake up the breathing-bracing system that protects the spine; calm morning stiffness.","equipment":"None (floor or bed)","setup":"Lying on back, knees bent, feet flat. Lie on a mat or firm bed. Place one hand on your chest and one on your belly.","startpos":"Back relaxed in its natural gentle arch, knees bent about 90 degrees, feet hip-width.","exec":"1) Breathe in slowly through the nose for about 4 seconds, letting the belly hand rise while the chest hand stays fairly still. 2) Breathe out through pursed lips for about 6 seconds. 3) After 5 easy breaths, add the brace: as you exhale, lightly tense the whole waist (20-30% effort) as if about to be poked, hold 5 seconds while breathing shallowly, then relax.","breathing":"This exercise IS the breathing work; never hold your breath hard.","rom":"No spinal movement.","progression":"Increase brace holds from 5 s to 10 s; progress to practising the brace seated and standing.","regression":"Breathing only, no brace.","alternative":"Crocodile breathing (lying face down, forehead on hands).","errors":"Chest-dominant breathing; bracing so hard you cannot breathe.","lumbar":"Completely low risk; do on the bed if getting to the floor is stiff first thing. Foundation skill for every lift in this programme.","shoulder":"None.","leftleg":"None.","stop":"None specific; this should always be comfortable.","source":"McGill 2001; JOSPT CPG 2021"},{"id":1,"name":"Cat-camel (mid-range)","cat":"Spinal mobility","muscles":"Spinal segmental movement, paraspinals; secondary: Abdominals","purpose":"Gentle, unloaded spinal motion to reduce morning stiffness without stressing the healing disc.","equipment":"Mat","setup":"Hands and knees (quadruped). Hands under shoulders, knees under hips, spine in its natural position.","startpos":"Neutral back, eyes down, weight even between hands and knees.","exec":"1) Slowly round your back up toward the ceiling a COMFORTABLE amount (about 60-70% of what feels possible), letting the head drop gently. 2) Slowly reverse, letting the belly sink and chest lift, again stopping short of end range. 3) Move continuously and smoothly; this is motion, not stretching. Do 8-10 slow cycles.","breathing":"Breathe out as you round, in as you dip. No bracing needed.","rom":"Deliberately MID-range only for the first 8 weeks; do not force either end.","progression":"Gradually allow slightly larger range from Phase 3 if completely symptom-free.","regression":"Smaller range, or pelvic tilts lying on back.","alternative":"Standing gentle pelvic tilts.","errors":"Forcing end-range; moving fast; pushing into pain.","lumbar":"Morning discs are fully hydrated and most stressed by end-range bending - stay mid-range. Key point: motion is the goal, not range. Keep it pain-free.","shoulder":"Take weight through flat palms; shorten the time if wrists or shoulders complain.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill; Adams 1987 diurnal disc mechanics"},{"id":2,"name":"Glute bridge","cat":"Glute activation","muscles":"Gluteus maximus; secondary: Hamstrings, deep core","purpose":"Switch the glutes on after sleep so hips, not the lower back, do the day's work.","equipment":"Mat","setup":"Lying on back, knees bent. Feet flat, hip-width, heels about a hand-length from your fingertips when arms are by your sides.","startpos":"Lightly brace; back rests in neutral.","exec":"1) Push through the whole foot and squeeze the glutes to lift the hips until knees-hips-shoulders form a straight line. 2) Do NOT arch the lower back to get higher. 3) Pause 2 s squeezing hard. 4) Lower with control. 10-12 reps.","breathing":"Before each rep, take a breath into your belly and lightly tense your midsection as if about to be nudged (about 20-30% effort). Breathe out slowly through the effort phase without losing that tension.","rom":"Stop the lift where the glutes finish it; never force height with the back.","progression":"Progress to feet-elevated bridge, then single-leg bridge (Phase 2+).","regression":"Smaller lift height; hands pressing floor.","alternative":"Standing glute squeeze.","errors":"Arching the lower back; pushing through toes; rushing.","lumbar":"If you feel it mainly in the lower back, lower the height and re-brace. One of the safest early hip loaders; hips move, spine stays quiet.","shoulder":"None.","leftleg":"Push evenly through both feet; notice if the left side works less - that awareness matters.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Cochrane 2014 early active rehab; McGill"},{"id":3,"name":"Bird-dog (morning version)","cat":"Core / motor control","muscles":"Spinal stabilisers (multifidus, erectors), glutes; secondary: Shoulders, abdominals","purpose":"Teach the spine to stay still while arms and legs move - the core skill of safe lifting.","equipment":"Mat","setup":"Hands and knees. Hands under shoulders, knees under hips, neutral spine. Imagine a cup of water resting on your lower back.","startpos":"Gentle brace, eyes down.","exec":"1) Slowly reach one arm forward and the OPPOSITE leg back until both are level with the torso - no higher. 2) Hold 5 s without letting the hips tip or the back arch. 3) Return with control and swap sides. 5 reps per side in the morning.","breathing":"Before each rep, take a breath into your belly and lightly tense your midsection as if about to be nudged (about 20-30% effort). Breathe out slowly through the effort phase without losing that tension.","rom":"Arm and leg to horizontal only.","progression":"Longer holds (to 10 s); later draw small squares with the outstretched hand/foot.","regression":"Leg-only slides, keeping toes on the floor.","alternative":"Dead bug (on back).","errors":"Arching the back as the leg lifts; twisting the hips; rushing.","lumbar":"Quality beats quantity; stop the set when form degrades. Cornerstone spine-sparing stability drill (McGill big three).","shoulder":"Keep the supporting shoulder pushed gently away from the floor.","leftleg":"When the LEFT leg is the moving leg, expect it to be harder to control - go slower on that side; do the left side first.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill big three"},{"id":4,"name":"Femoral nerve slider (gentle)","cat":"Neural mobility","muscles":"Femoral nerve mobility (front of thigh); secondary: Hip flexors, quadriceps","purpose":"Gently glide the healing L3 nerve so it moves freely without stretch or irritation.","equipment":"Chair or side-lying on mat","setup":"Side-lying, affected (left) side up, hips and knees bent. Lie on your right side, both knees bent toward the chest, head resting on arm or pillow.","startpos":"Hold the left shin or thigh lightly with the left hand.","exec":"1) Gently take the left hip backward (thigh moving behind you) while bending the knee a little more - AND at the same time look UP/extend your neck gently. 2) Then bring the thigh forward and straighten the knee slightly while tucking your chin. 3) This alternation 'slides' the nerve rather than stretching it. Slow and rhythmic, 8-10 cycles. You may feel a light pull on the front of the thigh - never pain, burning or tingling.","breathing":"Relaxed breathing throughout.","rom":"Small, always short of any symptom.","progression":"Slightly larger range over weeks ONLY if completely symptom-free.","regression":"Smaller range, or just gentle knee bends lying on side.","alternative":"Seated sciatic slider if the physiotherapist prefers.","errors":"Turning it into a quad/hip-flexor stretch; pushing into tingling.","lumbar":"Sliders, never 'tensioners': movement at one end while the other end releases. Do not arch the lower back to increase the movement.","shoulder":"None.","leftleg":"Directly targets the operated L3 nerve path; confirm with your physiotherapist that they are happy for this to be included.","stop":"Stop at once if you feel electric pain, tingling, numbness or symptoms that linger afterwards - report to your physiotherapist.","source":"Basson 2017 JOSPT MA; post-microdiscectomy neural mobilisation RCT 2020"},{"id":5,"name":"Scapular wall slide","cat":"Shoulder activation","muscles":"Serratus anterior, lower trapezius; secondary: Rotator cuff","purpose":"Wake the shoulder-blade muscles that keep pressing and pulling pain-free.","equipment":"Wall","setup":"Standing, back to wall. Stand with head, upper back and bottom lightly on a wall, feet a foot-length forward. Forearms on the wall in a 'goal-post' shape if tolerated, otherwise start with backs of hands only.","startpos":"Ribs down (do not arch the back off the wall), gentle chin tuck.","exec":"1) Slide the arms slowly up the wall as far as they go WITHOUT the back arching or the shoulders shrugging into pain. 2) Pause 1 s. 3) Slide down, finishing by squeezing the shoulder blades gently down and back. 8-10 reps.","breathing":"Exhale on the way up; keep ribs down.","rom":"Only the range where the back stays on the wall and pain stays under 3/10.","progression":"Add a light band around wrists pulling apart; progress range.","regression":"Smaller range; face the wall instead and slide hands up.","alternative":"Prone (face-down) arm slides on a bed.","errors":"Arching the lower back; shrugging; forcing painful range.","lumbar":"Mild stiffness is fine; pinching pain is a signal to shorten the range. Keeping ribs down doubles as anti-extension core practice.","shoulder":"Primary daily drill for the shoulder programme; range will grow over weeks.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Cools 2013 scapular rehab algorithm"},{"id":6,"name":"Easy march / walk","cat":"Circulation","muscles":"Whole body, hip flexors, calves; secondary: Cardiovascular system","purpose":"Raise temperature and blood flow; let the spine settle into the day before any loading.","equipment":"None","setup":"Standing. Clear floor space or a hallway.","startpos":"Tall posture, relaxed shoulders.","exec":"March on the spot or walk briskly around the house/outside for 2-3 minutes, swinging the arms naturally. Lift the knees to a comfortable height only.","breathing":"Natural breathing.","rom":"Comfortable.","progression":"Extend toward 5 minutes or take a longer morning walk when time allows.","regression":"Slow stroll.","alternative":"Stationary bike, very easy, 3 minutes.","errors":"None significant.","lumbar":"Very low risk. Walking is one of the best tolerated activities after lumbar surgery - use it freely through the day.","shoulder":"None.","leftleg":"Notice left-leg swing and push-off; report any foot slap, catching or giving-way to your physiotherapist.","stop":"Stop if leg symptoms (pain/tingling below the knee or in the thigh) appear.","source":"EFORT 2023; Cochrane 2014"},{"id":7,"name":"Thoracic extension over foam roller","cat":"Thoracic mobility","muscles":"Mid-back extension; secondary: Chest, abs (lengthening)","purpose":"Restore upper-back extension so overhead and pressing positions stop wedging the lower back and shoulders.","equipment":"Foam roller, mat","setup":"Lying on back, roller across the mid-back. Roller horizontal under the shoulder-blade area, knees bent, feet flat, hands supporting the HEAD (not pulling), hips ON the floor.","startpos":"Elbows pointing up, ribs relaxed.","exec":"1) Gently arch the UPPER back over the roller, letting the head drop back a little into the hands. 2) Pause 2-3 breaths at a comfortable stretch. 3) Return, move the roller one segment up or down, repeat over 3-4 spots between shoulder blades and lower ribs. HIPS STAY DOWN - if the hips rise, the arch has moved into the lower back.","breathing":"Long exhales as you extend.","rom":"Gentle; upper back only.","progression":"Slightly more range; add arm reach-overs (Phase 3).","regression":"Roller higher only (between the blades); smaller arch; or seated chair-back extensions.","alternative":"Cat-camel focusing on the dip phase between the shoulder blades.","errors":"Hinging at the lower back (hips lifting); rolling onto the lower back; pulling the neck.","lumbar":"NEVER position the roller under the lower back. The roller must stay above the bottom ribs at all times.","shoulder":"Great pre-press mobiliser.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Thoracic mobility literature; active drills over manipulation (2018 SR)"},{"id":8,"name":"Wall push-up plus (serratus)","cat":"Scapular control - serratus","muscles":"Serratus anterior; secondary: Chest, core","purpose":"Teach the shoulder blade to hug the ribcage - the missing link in many painful pressing shoulders.","equipment":"Wall","setup":"Standing push-up position against wall. Hands on the wall at shoulder height/width, feet back so the body leans in at ~30 degrees.","startpos":"Body in one line, ribs down, light brace.","exec":"1) Do a slow wall push-up. 2) At the TOP, keep the elbows straight and push the upper back away from the wall an extra few centimetres, letting the shoulder blades slide around the ribs ('the plus'). 3) Pause 2 s, let the blades come back, repeat.","breathing":"Exhale on the push and the plus.","rom":"Full comfortable push-up + the extra protraction.","progression":"Steeper angle (hands on bench) -> knees push-up plus -> quadruped scap push-up.","regression":"Just the 'plus' part, no push-up.","alternative":"Quadruped scapular push-up.","errors":"Sagging hips; shrugging; bending elbows during the plus.","lumbar":"Pain-free arc only. Brace keeps the body plank-straight.","shoulder":"Builds the upward-rotation support painful shoulders lack; keep the range comfortable.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Cools 2013; serratus rehab literature"},{"id":9,"name":"Side-lying external rotation","cat":"Rotator cuff strength","muscles":"Rotator cuff (infraspinatus/teres minor); secondary: Rear deltoid","purpose":"Directly load the cuff muscles that keep the ball centred in the socket during pressing.","equipment":"Light dumbbell (1-4 kg), rolled towel","setup":"Side-lying. Lie on your right side, LEFT elbow pinned to your side over a small rolled towel, elbow bent 90 degrees, light DB in the left hand, forearm across the belly.","startpos":"Shoulder blade gently set back and down.","exec":"1) Keeping the elbow glued to the towel, rotate the forearm up and away from the belly like a gate opening, until the forearm points roughly at the ceiling-forward diagonal. 2) Pause 1 s. 3) Lower slowly (3 s). Complete reps, swap sides.","breathing":"Exhale as you rotate up.","rom":"Belly to ~45-60 degrees past vertical of the forearm arc, pain under 3/10.","progression":"Double progression 10->15 reps then +1 kg.","regression":"No weight; smaller arc.","alternative":"Cable/band external rotation standing, elbow at side.","errors":"Elbow drifting off the towel; using momentum; too heavy too soon.","lumbar":"Cuff muscles are small - loads stay humble and tempos slow. None.","shoulder":"Core cuff-capacity builder; expect a deep, small-muscle burn, not joint pain.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"RCRSP progressive loading (Lewis, Holmgren 2012)"},{"id":10,"name":"Incline Y-T-W raises","cat":"Scapular control / posterior shoulder","muscles":"Lower trapezius, mid trapezius, rear deltoids; secondary: Rotator cuff","purpose":"Balanced strength for the muscles that anchor the shoulder blade in every press and pull.","equipment":"Incline bench (30-45 degrees), very light DBs or none","setup":"Chest-supported face-down on incline bench. Chest on the pad, feet planted, arms hanging, neck long (nose toward the pad).","startpos":"Shoulder blades gently drawn down away from the ears.","exec":"1) 'Y': raise both arms up-and-out at ~45 degrees, thumbs up, to shoulder line height. Lower. 2) 'T': raise straight out to the sides, thumbs up. Lower. 3) 'W': pull elbows down and back, squeezing the blades, hands making a W. Lower. That trio = 1 rep. Move slowly; the chest stays on the pad.","breathing":"Exhale on each raise.","rom":"To body line; never force height.","progression":"8->12 trios, then +1 kg.","regression":"One letter at a time; smaller range.","alternative":"Band pull-aparts + band W.","errors":"Shrugging; throwing the weights; lifting the chest off the pad.","lumbar":"Light is right - these muscles respond to precision, not load. Chest support removes all lumbar load - ideal post-surgery.","shoulder":"Cornerstone scap-control drill; skip any letter that pinches and note it.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Cools 2013; scapular loading evidence"},{"id":11,"name":"Dead bug","cat":"Core - anti-extension","muscles":"Deep abdominals (transverse, rectus); secondary: Hip flexors","purpose":"Teach the ribs and pelvis to stay connected while the legs move - the anti-arching skill used in pressing.","equipment":"Mat","setup":"Lying on back, arms up, hips and knees at 90/90. Lower back gently in contact with the floor (natural, not forced flat), arms reaching to the ceiling.","startpos":"Brace so the back's contact with the floor does not change.","exec":"1) Slowly lower the RIGHT heel to tap the floor while the left stays up (option: lower the opposite arm overhead at the same time). 2) The lower back must not peel up or press down. 3) Return, swap sides. Alternate for the prescribed reps.","breathing":"Exhale slowly as the leg lowers.","rom":"Only as far as the back stays quiet - shorten if it arches.","progression":"Heel taps -> straight-leg lowers -> arm+leg together -> light band between hands and feet.","regression":"Smaller range; feet taps closer to the body.","alternative":"90/90 breathing with heels on a chair.","errors":"Back arching off the floor; holding breath; moving fast.","lumbar":"Range is dictated entirely by back stillness. Trains exactly the control that stops the back arching under presses and carries.","shoulder":"Arms can stay vertical if overhead movement irritates the shoulders.","leftleg":"Note any control difference when the LEFT leg lowers; do a couple of extra left reps if it lags.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Anti-extension core literature; Martuscello 2013"},{"id":12,"name":"Front plank (progression series)","cat":"Core - anti-extension endurance","muscles":"Abdominals; secondary: Shoulders, glutes, quads","purpose":"Whole-front-line endurance in a spine-neutral position.","equipment":"Mat","setup":"Forearms and toes (Phase 1: forearms and knees). Elbows under shoulders, forearms parallel. Phase 1 uses knees down.","startpos":"Straight line ear-shoulder-hip-knee/ankle; glutes and quads lightly squeezed; brace.","exec":"1) Hold the line for the prescribed time, breathing shallowly. 2) No sagging hips, no hips in the air. 3) Rest and repeat.","breathing":"Shallow steady breathing.","rom":"None - pure hold.","progression":"Knees 2x30 s -> toes 20 s -> 45 s -> feet elevated or single-leg lift 5 s each -> body-saw (Phase 4, small range).","regression":"Shorter holds, knees down, or incline plank on a bench.","alternative":"Incline plank (hands on bench).","errors":"Sagging; head dropping; breath holding.","lumbar":"End the hold the moment the hips start to sag - that is the set's true end. Neutral held under tension = safe anti-extension work.","shoulder":"Incline version if shoulders are irritable that day.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill; core endurance literature"},{"id":13,"name":"Machine chest press (neutral or moderate grip)","cat":"Hypertrophy - horizontal press","muscles":"Chest (pectorals); secondary: Front deltoids, triceps","purpose":"Main chest builder with the back supported and the load path fixed - maximum stimulus, minimum spine and shoulder stress.","equipment":"Chest press machine","setup":"Seated, back on pad. Set the seat so the handles sit at mid-chest height. Choose the neutral (palms-facing) grips if available - they are kinder to the shoulders. Sit with head, upper back and hips on the pad, feet planted.","startpos":"Shoulder blades gently pulled back and down INTO the pad, holding them there for the whole set. Grip at moderate width (hands roughly in line with the shoulders, not wider than ~1.5 shoulder widths).","exec":"1) Brace lightly, exhale and press the handles until the arms are long but elbows not slammed straight. 2) Squeeze the chest 1 s. 3) Lower slowly (3 s) until a comfortable stretch crosses the chest - stop short of any shoulder pinch. 4) Press again without bouncing.","breathing":"Exhale on the press, inhale on the lower; keep a light brace so the lower back does not arch off the pad.","rom":"Deep as comfortable into the chest stretch, elbows stopping around body line if shoulders are cranky.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: floor-supported DB press.","alternative":"Flat dumbbell press (feet up, back flat) or push-up variations.","errors":"Shoulders rolling forward off the pad; bouncing at the stretch; arching the lower back; flaring elbows fully wide.","lumbar":"Blades back-and-down on the pad; stretch, don't pinch. Back stays in full contact with the pad; no arch-pressing.","shoulder":"Neutral/moderate grip and a controlled depth are your two shoulder levers; use the pain rule (<=5/10, settled by morning).","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Haugen 2023 machine equivalence; grip-width shoulder loads (2024 modelling)"},{"id":14,"name":"Pec-deck fly (machine)","cat":"Hypertrophy - chest isolation","muscles":"Chest; secondary: Front deltoids","purpose":"Chest isolation with a deep loaded stretch - the lengthened position is where growth is cheapest.","equipment":"Pec-deck machine","setup":"Seated, back on pad. Seat height so handles are at mid-chest; start-position adjusters so the hands begin only slightly behind the chest line (not extreme).","startpos":"Back on pad, blades set, slight elbow bend locked in.","exec":"1) Bring the handles together in a wide hug until they nearly touch. 2) Squeeze the chest 1 s. 3) Open slowly (3 s) into a comfortable stretch - deep but never pinching the front of the shoulder. 4) Repeat without letting the stack crash.","breathing":"Exhale as hands come together.","rom":"Emphasise the stretched half; cap depth at shoulder comfort.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: cable fly at mid height.","alternative":"Cable fly; floor DB fly (short range).","errors":"Setting the start range too deep; bending/straightening elbows (turning it into a press); shrugging.","lumbar":"Set the range limiter conservatively the first week. Stay tall on the pad; no wriggling.","shoulder":"One of the easiest chest moves to tune for shoulder comfort via the range limiter.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Lengthened-position hypertrophy evidence (Kassiano/Maeo)"},{"id":15,"name":"Dumbbell lateral raise","cat":"Hypertrophy - side delts","muscles":"Side (lateral) deltoids; secondary: Traps","purpose":"Direct side-delt size - the width-builder - with tiny joint stress when done strictly.","equipment":"Light dumbbells","setup":"Standing (or seated on amber back days). Stand tall, soft knees, ribs down, DBs by the sides, palms in.","startpos":"Slight forward tilt of the torso (5-10 degrees), light brace.","exec":"1) Raise both arms out to the sides, elbows very slightly bent, LEADING WITH THE ELBOWS, until the upper arms are roughly parallel with the floor (hands no higher than shoulders). 2) Pause 1 s. 3) Lower slowly (3 s) resisting the drop. 4) No swinging - if you must swing, the DBs are too heavy.","breathing":"Exhale up.","rom":"To shoulder height; below any pinch point.","progression":"Double progression 10->15 reps then +1-2 kg (small jumps; this move punishes big jumps).","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: cable lateral raise from behind the body.","alternative":"Cable lateral raise; machine lateral raise.","errors":"Shrugging; swinging the torso; hands above shoulders; thumbs pointing hard down (can pinch).","lumbar":"Keep thumbs level or slightly up if any pinch. Seated version on any amber back day.","shoulder":"Usually well tolerated even by cranky shoulders below shoulder height; a staple here.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Delt hypertrophy convention; shoulder-safe arcs"},{"id":16,"name":"Seated dumbbell shoulder press (neutral grip)","cat":"Hypertrophy - vertical press","muscles":"Front and side deltoids; secondary: Triceps, upper chest","purpose":"Overhead pressing strength and delt size, seated with back support and palms facing for shoulder comfort.","equipment":"Upright bench (75-85 degrees), dumbbells","setup":"Seated, back supported. Bench nearly upright. DBs to shoulders via thigh kick-up. Feet planted wide.","startpos":"DBs at shoulder height just outside the shoulders, PALMS FACING EACH OTHER (neutral), forearms vertical, ribs down, light brace.","exec":"1) Press both DBs up and slightly together until arms are long overhead - stop just short of locked, and only as high as is pain-free. 2) Lower slowly (3 s) to shoulder height. 3) Repeat. If full overhead is uncomfortable, work in the pain-free arc only (even 3/4 range grows delts).","breathing":"Exhale on the press; brace stops the lower back arching.","rom":"Pain-free arc; partial overhead range is acceptable and effective.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: landmine-style press or high-incline DB press.","alternative":"High-incline (60 degree) DB press; machine shoulder press with neutral grips.","errors":"Arching the lower back as fatigue builds; flaring palms forward if it pinches; pressing behind the head.","lumbar":"The upright pad + brace protects the lumbar spine; respect the pain-free arc. If you feel the lower back arching off the pad, the DBs are too heavy today.","shoulder":"Neutral grip and a slight forward lean of the arms are the friendliest overhead path; skip overhead entirely on amber shoulder days and do more lateral raises instead.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Grip/angle modification evidence; RCRSP rules"},{"id":17,"name":"Slow breathing, ~6 breaths per minute","cat":"Relaxation / recovery","muscles":"Autonomic nervous system (relaxation response); secondary: Diaphragm","purpose":"Shift the body into recovery mode and improve sleep quality.","equipment":"Bed or mat, optional timer app","setup":"Lying comfortably, or reclined. Dim light, no screen, comfortable position, one hand on belly.","startpos":"Eyes closed.","exec":"Breathe in through the nose ~4-5 s, out through the nose or pursed lips ~5-6 s, so each full breath takes about 10 s (6 per minute). Continue 5 minutes. If the mind wanders, return attention to the belly rising and falling.","breathing":"This is the exercise.","rom":"None.","progression":"Extend to 10 minutes on hard-training days.","regression":"Any comfortable slow breathing.","alternative":"Guided breathing app at 6/min.","errors":"Forcing huge breaths; falling into fast shallow breathing.","lumbar":"If light-headed, breathe normally for a minute and restart smaller. A good moment to mentally review the day's back symptoms for the diary.","shoulder":"None.","leftleg":"None.","stop":"None.","source":"Laborde 2022 HRV MA; slow-breathing sleep SR"},{"id":18,"name":"Doorway chest stretch (gentle)","cat":"Flexibility","muscles":"Chest (pectorals); secondary: Front shoulder","purpose":"Ease pressing-day chest tightness and help the shoulders sit back naturally.","equipment":"Doorway","setup":"Standing in a doorway. Forearm on the door frame, elbow at shoulder height or slightly BELOW (kinder to painful shoulders).","startpos":"Feet staggered, ribs down.","exec":"1) Gently turn the body away from the arm until a light stretch crosses the chest. 2) Hold 30 s, breathing slowly. 3) Swap sides. Intensity 3-4/10, no pinching in the shoulder.","breathing":"Slow.","rom":"Gentle; elbow below shoulder height reduces shoulder stress.","progression":"Slightly higher elbow position in later phases if pain-free.","regression":"Hands-behind-back gentle chest opener.","alternative":"Lying on a rolled towel along the spine, arms resting out.","errors":"Elbow too high; leaning aggressively; shrugging.","lumbar":"A painful shoulder prefers below-shoulder-height angles. Do not let the lower back arch as you lean in.","shoulder":"Skip on any day the shoulders are above 3/10 at rest; use the lying towel version instead.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Shoulder rehab literature (Lewis/Cools); Warneke 2024"},{"id":19,"name":"Open-book thoracic rotation (gentle)","cat":"Mobility","muscles":"Mid-back (thoracic) rotation; secondary: Chest, neck","purpose":"Keep the mid-back moving so the lower back and shoulders are not forced to compensate.","equipment":"Mat, pillow","setup":"Side-lying, knees stacked and bent to 90 degrees. Lie on your side, pillow under head, knees together at 90/90, arms straight in front, palms together.","startpos":"Knees pressed lightly together (they must stay together throughout).","exec":"1) Slide the top hand along the bottom arm, then open the top arm up and across toward the floor behind you, letting the mid-back and head rotate. 2) Keep both knees glued together so the rotation comes from the MID-back, not the lower back. 3) Pause 2 breaths at a comfortable end point, return. 6 slow reps per side.","breathing":"Exhale as you open.","rom":"Comfortable range; the knees staying together caps lumbar rotation automatically.","progression":"Slightly greater range and longer pauses over the weeks.","regression":"Simply reach the top arm to the ceiling and slightly back.","alternative":"Seated rotations with arms crossed.","errors":"Letting the top knee lift (that shifts rotation into the lower back); forcing the arm to the floor.","lumbar":"Knees together is the non-negotiable safety rule here. Designed to rotate the mid-back while sparing the operated segment.","shoulder":"Stay short of any shoulder pinch; a folded towel under the top arm's landing zone helps.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Hip/thoracic-spine compensation literature"},{"id":20,"name":"Figure-4 glute stretch (lying)","cat":"Flexibility","muscles":"Glutes, deep hip rotators; secondary: Lower back (indirect ease)","purpose":"Release hip tension from the day's training without twisting the spine.","equipment":"Mat or bed","setup":"Lying on back. Both knees bent, feet flat.","startpos":"Cross the left ankle over the right knee.","exec":"1) Reach through and hold the back of the right thigh with both hands. 2) Gently draw the right thigh toward you until a comfortable stretch appears in the left buttock. 3) Keep the tailbone down and back relaxed on the floor. Hold 30-45 s per side, easy breathing.","breathing":"Slow, relaxed.","rom":"Gentle stretch only, 3-4/10 intensity.","progression":"Slightly deeper over the weeks as comfort allows.","regression":"Foot on a wall instead of holding the thigh.","alternative":"Seated figure-4 lean (later phases only).","errors":"Pulling so hard the pelvis lifts and the low back rounds.","lumbar":"Keep the tailbone heavy on the floor to protect the spine. Tailbone stays down = spine stays neutral.","shoulder":"None.","leftleg":"Often tighter or 'different' on the operated side; note asymmetry in the diary.","stop":"Stop if any tingling or radiating symptoms into the leg.","source":"Warneke 2024 stretch dose MA"},{"id":21,"name":"Body scan + symptom review","cat":"Relaxation / monitoring","muscles":"Nervous system","purpose":"Downshift for sleep and capture the day's symptom data while it is fresh.","equipment":"Bed, tracker sheet nearby","setup":"Lying in bed. Lights low, tracker within reach.","startpos":"Comfortable sleeping position.","exec":"1) Spend 2-3 minutes moving attention slowly from feet to head, releasing tension at each stop. 2) Then rate and record in the tracker: back pain now, left-leg symptoms, shoulder pain, and anything unusual from today. 3) Lights out.","breathing":"Slow and natural.","rom":"None.","progression":"None needed.","regression":"Just the three symptom ratings.","alternative":"Guided body-scan audio.","errors":"Skipping the recording step.","lumbar":"None. Next-morning symptoms are a key programme steering signal - the diary makes them usable.","shoulder":"Include shoulder rating.","leftleg":"Include left-leg rating.","stop":"None.","source":"Monitoring literature (session-RPE/wellness)"},{"id":22,"name":"Knee-to-wall ankle mobilisation","cat":"Ankle mobility","muscles":"Ankle dorsiflexion (calf, soleus, joint)","purpose":"Free the ankles so squats and stairs stop forcing the back and hips to compensate; doubles as the weekly measurement test.","equipment":"Wall, ruler or tape measure","setup":"Half-kneeling facing a wall. Left foot flat, toes ~8 cm from the wall; right knee on a cushion behind.","startpos":"Front heel firmly down.","exec":"1) Drive the front knee straight toward (or slightly outside) the wall WITHOUT the heel lifting. 2) Touch the wall, pause 1 s, return. 10 slow reps per side. 3) Weekly test: find the greatest toe-to-wall distance where the knee still touches - record it for each leg.","breathing":"Natural.","rom":"Heel-down range only.","progression":"Move the foot back 1 cm when 10 easy touches; light hand pressure on the knee later.","regression":"Move the foot closer to the wall.","alternative":"Standing calf/soleus stretch on a step (gentle).","errors":"Heel lifting; knee diving inward; forcing pain in the front of the ankle.","lumbar":"A pinch at the FRONT of the ankle means back off, not push harder. None.","shoulder":"None.","leftleg":"Expect the left ankle to differ; measure BOTH sides weekly - the gap is a progress marker.","stop":"Stop if front-ankle pinching persists; note it for the physio.","source":"WBLT validity (Hoch 2019)"},{"id":23,"name":"90/90 hip switch","cat":"Hip mobility - rotation","muscles":"Hip internal and external rotators; secondary: Glutes, adductors","purpose":"Restore hip rotation so twisting tasks come from the hips, not the operated lumbar segment.","equipment":"Mat","setup":"Sitting on the floor. Sit with the left leg in front bent 90 degrees (shin across) and the right leg to the side bent 90 degrees (shin behind).","startpos":"Sit tall on both sit-bones, hands lightly on the floor for support.","exec":"1) Keeping the chest tall, slowly lift both knees and rotate them together to the other side, so the legs swap roles. 2) Move slowly through the middle; let the feet pivot. 3) Pause 2 s each side, feeling the hips - NOT the back - rotate. 8-10 total switches.","breathing":"Exhale during the switch.","rom":"Comfortable; use hands for support as needed.","progression":"Hands off the floor -> hold torso lean over the front shin (Phase 3) -> add reach.","regression":"Lean back on both hands; smaller range.","alternative":"Supine (on back) hip rotations, feet wide.","errors":"Collapsing the chest; forcing knees to the floor; rotating from the waist.","lumbar":"Support with the hands generously in early weeks. Sitting tall keeps the lumbar spine quiet while the hips rotate.","shoulder":"None.","leftleg":"Note if the left hip feels tighter or weaker in the switch; do a couple of extra slow switches toward that side.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Hip-spine relationship SRs 2019"},{"id":24,"name":"Hip hinge with dowel (pattern drill)","cat":"Movement pattern - hinge","muscles":"Glutes, hamstrings (pattern learning); secondary: Spinal erectors (isometric)","purpose":"Re-learn bending through the hips with a perfectly quiet spine - the master pattern behind every future deadlift.","equipment":"Broomstick or dowel","setup":"Standing. Hold the dowel vertically behind your back: one hand behind the neck, one behind the lower back. The stick must touch three points - head, mid-back, tailbone.","startpos":"Feet hip-width, soft knees, ribs down, light brace.","exec":"1) Push the hips straight BACK as if closing a car door with your bottom, letting the chest tip forward. 2) Keep all three contact points on the stick; knees stay softly bent, shins vertical. 3) Descend only as far as the hips allow (usually torso ~45 degrees) - the moment the stick loses contact, you have gone too far. 4) Squeeze the glutes to stand tall.","breathing":"Inhale and brace at the top; exhale up.","rom":"Hips-back to ~45-degree torso or wherever contact is kept.","progression":"Add reps -> close eyes for 2-3 reps -> progress to kettlebell/DB Romanian deadlift when 15 perfect reps are easy for 2 sessions.","regression":"Smaller range; hinge to a chair (hips touch, stand).","alternative":"Wall-butt-touch hinge.","errors":"Bending the knees into a squat; rounding the back (stick loses tailbone or head); overarching.","lumbar":"This drill IS the safety system for later loading - master it unloaded. The three-point stick contact guarantees a neutral spine while the hips move.","shoulder":"None.","leftleg":"Weight even through both feet; note any drift toward the right side.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Aasa 2015 technique-gated hinge; McGill"},{"id":25,"name":"Terminal knee extension with band (TKE)","cat":"Left-leg rehab - quad activation","muscles":"Quadriceps (especially inner portion, VMO)","purpose":"Re-awaken the left quad's last few degrees of straightening - the part nerve compression switches off first.","equipment":"Medium band anchored low (rack/table leg)","setup":"Standing, band behind the knee. Loop the band around a solid anchor at knee height, step the LEFT leg into it so the band sits in the crease behind the knee, then step back until the band is taut. Foot flat.","startpos":"Slight bend in the left knee against the band's pull; hands on hips or light support.","exec":"1) Squeeze the thigh to straighten the knee FULLY, feeling the muscle just above the kneecap switch on. 2) Hold the lockout 3 s, actively squeezing. 3) Let the band bend the knee slightly, repeat. All reps left, then a lighter set right for balance.","breathing":"Exhale on the squeeze.","rom":"Last 20-30 degrees of knee straightening.","progression":"Longer holds -> stronger band -> progress emphasis to leg extensions and step-downs.","regression":"Seated quad squeezes (leg straight, push knee down into a towel, hold 5 s).","alternative":"Seated straight-leg lift with 3 s quad squeeze.","errors":"Letting the hip do the work; not reaching a full, hard lockout; leaning back.","lumbar":"This should burn the thigh gently, nothing more. Stand tall; no back arching.","shoulder":"None.","leftleg":"THE foundational left-quad wake-up drill; also a daily self-test - if the lockout feels weaker than yesterday, flag it (possible neural symptom).","stop":"Stop if knee pain, or any tingling/numbness down the leg - record it.","source":"Quad activation post-radiculopathy; Ghahreman 2002 recovery windows"},{"id":26,"name":"Lateral step-down (low box)","cat":"Left-leg rehab - control","muscles":"Quadriceps, glutes (single leg); secondary: Calves, core","purpose":"Single-leg control under body weight - the bridge between rehab drills and real single-leg strength.","equipment":"Low step or box (10-15 cm to start)","setup":"Standing on the box on one leg. Stand tall on the box on the LEFT leg, right leg hanging off the side, hands out or on light support.","startpos":"Level pelvis, tall chest, left kneecap tracking over the middle toes.","exec":"1) Bend the left knee and hips to lower the right heel slowly toward the floor (3-4 s). 2) Touch the heel lightly - do NOT stand on it. 3) Push back up through the left leg. All reps left, then right matches the left's reps.","breathing":"Exhale on the way up.","rom":"Heel-touch depth; reduce box height if control is poor.","progression":"Higher box (to 20 cm) -> remove hand support -> slow to 5 s lowering -> hold a light DB at chest (Phase 4).","regression":"Lower box; fingertip support; partial range.","alternative":"Sit-to-stand from a high chair, left-leg emphasis.","errors":"Knee collapsing inward; pelvis dropping on the free side; dropping fast; pushing off the bottom foot.","lumbar":"Mirror or phone video is genuinely useful - knee-over-toes line is the thing to watch. Stay tall; no torso side-lean to cheat.","shoulder":"None.","leftleg":"Signature left-leg control exercise; the LEFT working side always goes first and sets the rep count.","stop":"Stop if the knee wobbles uncontrollably, or any back/leg nerve symptom appears.","source":"Unilateral control rehab literature"},{"id":27,"name":"Side plank (progression series)","cat":"Core - anti-lateral-flexion","muscles":"Obliques, quadratus lumborum; secondary: Glute medius, shoulder stabilisers","purpose":"Build the side-core endurance that protects the spine during carries and single-leg work; key left-right symmetry measure.","equipment":"Mat","setup":"Side-lying on forearm. Elbow directly under shoulder, forearm across. PHASE 1 VERSION: knees bent 90 degrees, hips stacked. PHASE 2+: legs straight, feet staggered or stacked.","startpos":"Body in a straight line from head to knees (or feet), free hand on hip.","exec":"1) Brace, then lift the hips until head-shoulder-hip-knee form a straight line. 2) Hold the prescribed time breathing shallowly - do not let the hips sag or roll. 3) Lower with control, swap sides. Always do the LEFT-side-down hold first and match the right to it.","breathing":"Shallow steady breathing during holds.","rom":"Straight-line hold; no movement.","progression":"Knees version to 2x30 s per side -> straight-leg version 10-15 s -> build to 45-60 s -> add top-leg raise.","regression":"Shorter holds; back to knees version.","alternative":"Standing suitcase iso-hold against a wall.","errors":"Hips sagging; rolling forward; shoulder shrugging into the ear.","lumbar":"Shoulder must stay packed (pushed away from the ear). Targets quadratus lumborum with minimal disc compression (McGill).","shoulder":"If the support shoulder is irritable, do the wall suitcase iso-hold instead that day.","leftleg":"Track left-down vs right-down hold times weekly - aim within ~10% of each other.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Also stop if shoulder pain exceeds 3/10.","source":"McGill big three + endurance norms 1999"},{"id":28,"name":"Leg press (45-degree or horizontal)","cat":"Hypertrophy - quads/glutes compound","muscles":"Quadriceps, glutes; secondary: Hamstrings, adductors, calves","purpose":"The programme's main heavy leg builder - big loads for the thighs while the back rests fully supported.","equipment":"Leg press machine","setup":"Seated/reclined, back and hips on pad. Sit in, LOWER BACK AND HIPS PRESSED FULLY INTO THE PAD, feet on the platform hip-to-shoulder width, mid-height placement. Handles gripped lightly.","startpos":"Knees bent ~90 degrees at the start catch (or press to long legs first, machine depending).","exec":"1) Lower the platform slowly (3 s) by bending the knees toward the chest - ONLY as deep as the hips stay glued to the pad. The moment the tailbone starts to curl up off the pad, that is 2 cm past your depth. 2) Pause briefly. 3) Press through the whole foot to long legs WITHOUT slamming the knees straight. 4) Never fully lock and never let the safety catch slam.","breathing":"Inhale lowering, exhale pressing; keep the light brace.","rom":"Depth capped by the pelvis staying on the pad (butt-wink rule).","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 5 kg (or smallest machine increment) and restart at the bottom of the range. Add depth ONLY when the pelvis stays down.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: wall sit or goblet box squat.","alternative":"Hack squat (Phase 3+); goblet squat; wall sit.","errors":"Going so deep the pelvis curls (this flexes the lumbar spine under load - the one error to never make here); locking knees; feet too low (knee stress); half-lowering.","lumbar":"THE depth rule: hips never leave the pad. Have a phone film the first sessions. Best-tolerated heavy leg exercise post-lumbar-surgery WHEN the depth rule is obeyed; it removes axial load entirely.","shoulder":"None.","leftleg":"One-leg-at-a-time sets from Phase 2 (left first, right matches left). The strong right leg WILL try to push harder on two-leg sets - place feet symmetrically and check pressure evenly.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Spine-sparing selection; Haugen 2023; unilateral protocol"},{"id":29,"name":"Leg extension (machine)","cat":"Hypertrophy - quads isolation","muscles":"Quadriceps","purpose":"Direct quad isolation - the key tool for rebuilding the left thigh because nothing else can compensate.","equipment":"Leg extension machine","setup":"Seated, back on pad. Adjust so the knee joint lines up with the machine's pivot, pad on the lower shin, back firm on the rest. Set the start angle at a comfortable knee bend.","startpos":"Grip the handles lightly, sit tall, light brace.","exec":"1) Straighten the legs fully, pausing 1-2 s at the top squeezing the thighs HARD (the top squeeze is the point). 2) Lower slowly (3 s) to the start. 3) SINGLE-LEG sets: same rules, left leg first, right leg matches the left's reps and load.","breathing":"Exhale extending.","rom":"Comfortable bend to full lockout.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range. Left leg's progression drives both sides.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: TKE band work.","alternative":"Single-leg press top-half; TKE.","errors":"Kicking fast; butt lifting; half lockouts (the left needs FULL lockouts - that is where its deficit lives).","lumbar":"Smooth, full, deliberate lockouts. Back stays on the pad; no arching to heave.","shoulder":"None.","leftleg":"THE left-quad rebuilder. ALWAYS single-leg here from Week 1. Left first; right performs the left's reps/load only. Left gets the extra set when prescribed.","stop":"Stop at sharp knee pain or any leg tingling/numbness - record it.","source":"Unilateral atrophy protocol; L3-root quad focus (Ghahreman 2002)"},{"id":30,"name":"Hip adduction machine","cat":"Hypertrophy - adductors","muscles":"Adductors (inner thigh)","purpose":"Direct inner-thigh size - a major (and majorly neglected) contributor to overall leg mass.","equipment":"Adduction machine","setup":"Seated, pads inside knees. Sit tall, set the start width to a COMFORTABLE stretch (not maximal), pads on the inner knees.","startpos":"Legs apart at the set width.","exec":"1) Squeeze the knees together smoothly. 2) Pause 1 s. 3) Return slowly (3 s) to the stretch without slamming. Widen the start position gradually over the weeks as the stretch allows.","breathing":"Exhale squeezing in.","rom":"Comfortable stretch to full close.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range. Widen range as a separate progression.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Copenhagen plank short-lever (Phase 4); cable adduction.","errors":"Starting width too aggressive; jerking; sliding forward.","lumbar":"Set the range limiter modestly in week 1. Seated, supported, safe.","shoulder":"None.","leftleg":"Left-right effort should feel even; note if not.","stop":"Stop at groin pinching or any nerve symptom.","source":"Adductor coverage; lengthened-position principle"},{"id":31,"name":"Seated calf raise","cat":"Hypertrophy - calves (soleus)","muscles":"Soleus (deep calf); secondary: Gastrocnemius","purpose":"Builds the deep calf that bent-knee positions expose - half of complete calf development.","equipment":"Seated calf machine (or DBs on knees + step)","setup":"Seated, balls of feet on platform, pads on knees. Balls of both feet on the edge, pads snug on the lower thighs.","startpos":"Heels dropped into a FULL comfortable stretch.","exec":"1) From the deep stretch, press up onto the toes as high as possible. 2) Pause 2 s at the top squeezing. 3) Lower slowly (3 s) into the full stretch and pause 2 s there - the stretch pause is where calves grow. No bouncing, ever.","breathing":"Exhale up.","rom":"Maximum: deep stretch to full tiptoe.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Single-leg DB-on-knee version.","errors":"Bouncing out of the stretch (the universal calf error); partial reps; rushing.","lumbar":"Controlled stretch pauses; nothing else to it. Seated - spine fully quiet.","shoulder":"None.","leftleg":"SINGLE-LEG from Phase 2: left first, right matches. Calf girth is measured weekly - this is the exercise behind that number.","stop":"Stop at Achilles pain or cramping that will not release.","source":"Calf lengthened-position evidence (+14.9% vs 7.3%); L-R tracking"},{"id":32,"name":"Hamstring stretch with strap (gentle)","cat":"Flexibility","muscles":"Hamstrings; secondary: Calves","purpose":"Gradually restore hamstring length while keeping the healing nerve calm.","equipment":"Strap, belt or towel","setup":"Lying on back. Lie on your back, loop the strap around the left mid-foot, other leg bent with foot flat on the floor.","startpos":"Head down, shoulders relaxed.","exec":"1) Keeping a SLIGHT bend in the knee, raise the leg until a gentle stretch appears in the back of the thigh. 2) Hold 30 s breathing slowly. 3) Swap legs. Intensity no more than 3-4/10 and absolutely no tingling, buzzing or 'electric' feeling.","breathing":"Slow, continuous.","rom":"Well short of maximum; the bent knee is deliberate.","progression":"Very gradually straighten the knee over the 16 weeks as symptoms allow.","regression":"Smaller range, more knee bend, or skip on symptomatic days.","alternative":"Seated gentle reach with long spine (Phase 3+ only).","errors":"Cranking the leg high; locking the knee; stretching into nerve symptoms.","lumbar":"With a recovering nerve root, hamstring 'stretch' must never reproduce leg symptoms. Keep the pelvis and lower back heavy on the floor.","shoulder":"None.","leftleg":"Left leg first; go gentler on the left if it is more sensitive.","stop":"Any tingling, numbness or electric sensation = stop immediately and note it in the diary.","source":"Judgement + neural mobilisation literature; Warneke 2024"},{"id":33,"name":"Half-kneeling hip flexor mobilisation","cat":"Hip mobility","muscles":"Hip flexors (front of hip); secondary: Glutes (of the front leg)","purpose":"Restore hip extension so walking and standing stop borrowing motion from the lower back.","equipment":"Mat or cushion under knee","setup":"Half-kneeling (one knee down). Left knee on a cushion, right foot flat in front, both knees at about 90 degrees. Hold a chair or wall for balance if needed.","startpos":"Tall torso, ribs down, gentle glute squeeze on the kneeling side.","exec":"1) Squeeze the kneeling-side glute and tuck the pelvis slightly under (like tucking a tail). 2) Shift the whole body a few centimetres forward until a gentle stretch appears at the FRONT of the kneeling hip - not in the back. 3) Hold 2 s, rock back. 8 slow rocks per side, or hold 30 s per side in the pre-bed version.","breathing":"Slow breathing; exhale as you shift forward.","rom":"Stop at a gentle stretch; the lower back must not arch.","progression":"Add an overhead reach with the same-side arm (Phase 3+).","regression":"Standing hip flexor stretch with hands on a wall.","alternative":"Couch-supported version only in later phases.","errors":"Arching the lower back instead of extending the hip; lunging too far.","lumbar":"The glute squeeze and pelvic tuck are what protect the spine - never skip them. Arching the back here mimics the exact compensation we are removing.","shoulder":"None.","leftleg":"Kneeling on the left knee also gives gentle pressure feedback; use extra padding if uncomfortable.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Hip-spine SRs 2019"},{"id":34,"name":"Band pull-apart","cat":"Scapular endurance","muscles":"Mid-traps, rear deltoids; secondary: Rotator cuff","purpose":"High-rep, low-stress posture and shoulder-health work; perfect warm-up and filler.","equipment":"Light resistance band","setup":"Standing. Hold the band at shoulder height, hands shoulder-width, palms down or thumbs up (thumbs-up is shoulder-friendlier).","startpos":"Tall, ribs down, arms long.","exec":"1) Keeping arms straight, pull the hands apart until the band touches the chest, squeezing the shoulder blades together. 2) Pause 1 s. 3) Return with control - do not let the band snap back.","breathing":"Exhale as you pull apart.","rom":"Full spread to chest touch, pain-free.","progression":"15->20 reps, then thicker band.","regression":"Partial range.","alternative":"Reverse pec-deck very light.","errors":"Shrugging; bending elbows; arching the back.","lumbar":"Very low risk. Ribs down prevents back arching.","shoulder":"A daily 'vitamin' for cranky shoulders.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm.","source":"Scapular loading literature"},{"id":35,"name":"Pallof press (anti-rotation)","cat":"Core - anti-rotation","muscles":"Obliques, deep core; secondary: Glutes, shoulders","purpose":"Resist twisting forces - the skill that protects the spine in carries, rows and daily life.","equipment":"Cable at chest height or band on a rack","setup":"Half-kneeling (Phase 1-2) then standing/split stance. Anchor at chest height. Half-kneel side-on to the anchor, inside knee down, cushion under knee. Hold the handle with both hands at the chest.","startpos":"Tall, ribs down, brace; the cable wants to twist you toward the anchor.","exec":"1) Press the hands slowly straight out from the chest until the arms are long. 2) Hold 3 s while the torso stays perfectly square. 3) Return to the chest with control. Complete all reps, then face the other way. Do the side that is HARDER to resist first (usually pressing away with the left side loaded).","breathing":"Exhale during the press-out; keep the brace.","rom":"Arms chest-to-long.","progression":"Double progression 8->12 reps then +2.5 kg; progress half-kneeling -> tall-kneeling -> standing -> split stance.","regression":"Shorter press-out; lighter band.","alternative":"Band anti-rotation hold (static).","errors":"Twisting toward the anchor; shrugging; arching.","lumbar":"Smooth press, no jerk. Anti-rotation without any spinal movement - ideal post-surgery core loading.","shoulder":"Keep hands at mid-chest; lower anchor slightly if shoulders complain.","leftleg":"Half-kneeling on the left knee doubles as left-hip loading.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Anti-rotation core evidence; McGill"},{"id":36,"name":"Bird-dog (training version)","cat":"Core - motor control","muscles":"Multifidus, erector spinae, glutes; secondary: Shoulders, abdominals","purpose":"Anti-rotation and spine-stillness under moving limbs; direct retraining for the operated segment's stabilisers.","equipment":"Mat","setup":"Hands and knees. Hands under shoulders, knees under hips, neutral spine.","startpos":"Brace lightly; imagine balancing a water bottle on the lower back.","exec":"1) Slowly extend one arm and the opposite leg to horizontal. 2) Hold 8-10 s, completely still. 3) Sweep the elbow and knee toward each other UNDER the body without touching the floor (Phase 2+), then re-extend. 4) Return and swap. Left leg extended = harder side; start there.","breathing":"Shallow breathing in holds; exhale on transitions.","rom":"Limbs to horizontal; spine still throughout.","progression":"Longer holds -> add the sweep -> hand/foot 'square drawing' -> light ankle weight (Phase 4).","regression":"Leg-only, or arm-only versions.","alternative":"Dead bug.","errors":"Hip hiking/rotating; lumbar arching as the leg lifts; rushing transitions.","lumbar":"If balance fails repeatedly, regress rather than wobble through. A primary rehab drill for the local spinal stabilisers after discectomy.","shoulder":"Keep the supporting shoulder packed.","leftleg":"The left-leg-extended side trains the operated side's chain; do it first and match right-side reps to it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill big three; motor control evidence (Saragiotto 2016)"},{"id":37,"name":"McGill curl-up","cat":"Core - anti-flexion endurance","muscles":"Rectus abdominis, obliques; secondary: Deep neck flexors","purpose":"Build front-core endurance with almost no load on the healing disc.","equipment":"Mat","setup":"Lying on back, one knee bent, one leg straight. Slide both hands, palms down, under the natural arch of the lower back. Bend one knee to about 90 degrees, keep the other leg straight.","startpos":"Elbows resting on the floor, neck long, tongue on the roof of the mouth.","exec":"1) Brace lightly. 2) Lift ONLY the head and shoulders a few centimetres - imagine head and chest rising as one block, the lower back does not flatten or move. 3) Hold ~10 s breathing shallowly. 4) Lower with control. Swap the bent leg halfway through the sets.","breathing":"Shallow breathing during the hold; never hold breath hard.","rom":"Tiny - a few centimetres. This is an endurance hold, not a sit-up.","progression":"Add reps per set (descending pyramid e.g. 5-3-2), then raise the elbows off the floor.","regression":"Shorter holds (5 s), head barely lifting.","alternative":"Dead bug (small range).","errors":"Doing a sit-up; flattening the back onto the hands; jutting the chin.","lumbar":"The hands under the back preserve the neutral arch - that is the point of them. Chosen precisely because it trains the abs while the lumbar spine stays still.","shoulder":"None.","leftleg":"None.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"McGill big three; Martuscello 2013"},{"id":38,"name":"Chest-supported row (machine or incline DB)","cat":"Hypertrophy - horizontal pull","muscles":"Lats, mid-back (rhomboids, mid-traps); secondary: Rear delts, biceps, forearms","purpose":"The programme's main back-thickness builder - full rowing stimulus with the spine completely unloaded by the chest pad.","equipment":"Chest-supported row machine, or incline bench + DBs","setup":"Chest on pad, feet planted. Set the pad so the handles are reachable at full arm stretch. Chest firm on the pad, feet braced.","startpos":"Arms long, blades relaxed forward (full stretch), neutral or overhand grip - neutral is shoulder-friendlier.","exec":"1) Drive the elbows back along the body line until the hands reach the lower ribs, squeezing the blades together. 2) Pause 1 s. 3) Return slowly (3 s) to the full stretch, letting the blades glide forward WITHOUT the chest leaving the pad. 4) No heaving - the chest pressed to the pad is the honesty test.","breathing":"Exhale on the pull.","rom":"Full stretch to full squeeze.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: single-arm DB row with bench support.","alternative":"Incline-bench DB row; seal row.","errors":"Chest lifting off the pad; shrugging; half-range stroking; wrist curling.","lumbar":"If the chest leaves the pad, the set is over. THE spine-safe row: the pad absorbs what a bent-over row would send to your disc.","shoulder":"Neutral grip, elbows ~45 degrees from the body; stop range short of any front-shoulder pinch.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Haugen 2023; spine-sparing selection principle"},{"id":39,"name":"Lat pulldown (neutral grip)","cat":"Hypertrophy - vertical pull","muscles":"Lats; secondary: Biceps, mid-back, rear delts","purpose":"Back width with a stretch-loaded overhead position - the safe stand-in for pull-ups until later phases.","equipment":"Lat pulldown station, neutral-grip bar or D-handles","setup":"Seated, thighs under pads. Thigh pads snug. Grab the neutral-grip handles (palms facing) at just-outside-shoulder width.","startpos":"Arms long overhead, feeling the lats stretch, slight backward lean (10-15 degrees) held constant, chest proud, light brace.","exec":"1) Pull the handles down to the top of the chest, driving the elbows down-and-back. 2) Squeeze the lats 1 s. 3) Return slowly (3 s) to the full overhead stretch, letting the blades rise at the top. 4) The torso angle must not change - no swinging back.","breathing":"Exhale on the pull down.","rom":"Full stretch at top to upper-chest at bottom.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR
