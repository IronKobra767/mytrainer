ht BACK, letting the bar slide down the thighs; knees stay softly bent. 2) Continue until you feel a strong hamstring stretch with the back keeping its shape (bar around mid-shin for most people). 3) Squeeze the glutes to stand tall - hips finish forward, no back arch. 4) Re-brace every rep.","breathing":"Breathe in and set a light brace (20-30% tension around the waist) before each rep; breathe out through the effort. Never hold your breath hard.","rom":"Thigh to mid-shin, limited by the back keeping its shape - never forced to the floor.","progression":"+2.5-5 kg when all sets are crisp at target RIR for 2 sessions. Range and load never progress in the same week.","regression":"Dumbbell RDL; shorten range to knee height; or seated leg curl only.","alternative":"Dumbbell RDL; 45-degree hip extension.","errors":"Rounding at the bottom; turning it into a squat; jerking off the turn; looking up hard; ego loading.","lumbar":"Bar stays in contact with the legs. Sets of 6-10, >=2 RIR always. If you cannot feel the hamstrings stretching, the hips are not going back far enough.","shoulder":"Long arms, set blades - shoulder quiet.","leftleg":"Even foot pressure; note if the left hamstring stretch feels different.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Aasa 2015; Maeo 2021 (long-length hamstring training); von Arx 2021 (load close to body lowers shear)"},{"id":81,"name":"Lying dumbbell triceps extension","cat":"Hypertrophy - triceps","muscles":"Triceps (all heads)","purpose":"Heavy-feeling triceps stretch work lying fully supported - the shoulder-friendly overhead alternative.","equipment":"Flat bench, dumbbells","setup":"Lying on back on bench. Lie back with a DB in each hand pressed above the chest, palms facing each other, feet planted.","startpos":"Arms vertical, ribs down, back gently on the bench.","exec":"1) Keeping the upper arms STILL and tilted slightly back toward the head, bend the elbows to lower the DBs beside the ears/level of the forehead. 2) Feel the triceps stretch. 3) Straighten back to the top without the upper arms swinging.","breathing":"Exhale extending.","rom":"Full elbow bend to straight; upper arms still.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR.","alternative":"Cable pressdown; close-grip push-up (Phase 3+).","errors":"Upper arms swinging (turns it into a pullover); flaring; lowering to the chest.","lumbar":"DBs, not a bar - each arm finds its own path and there is nothing to drop on your face. Fully supported.","shoulder":"Usually comfortable even when overhead pressing is not.","leftleg":"None.","stop":"Stop at sharp elbow pain.","source":"Triceps long-head loading, supported"},{"id":82,"name":"Copenhagen plank (short lever)","cat":"Adductor strength / side core","muscles":"Adductors, obliques; secondary: glute medius","purpose":"Adductor strength with side-core work - the adductors are a major but neglected part of leg size and hip stability. Short-lever version from Week 6.","equipment":"Flat bench; mat","setup":"Side plank with the top leg on a bench. Lie on your side, forearm under the shoulder, TOP knee/lower thigh resting on the bench, bottom leg bent underneath.","startpos":"Body in a straight line from head to top knee.","exec":"1) Squeeze the top leg's inner thigh into the bench and lift the hips until the body is straight. 2) Hold for the prescribed time (or do slow 3 s dips). 3) Lower with control. Swap sides - LEFT leg on top first.","breathing":"Steady shallow breathing.","rom":"Straight line hold.","progression":"15 s -> 30 s holds -> 8 slow dips -> long-lever version (ankle on the bench, Week 9+).","regression":"Side plank from knees; adductor machine.","alternative":"Hip adduction machine.","errors":"Hips sagging; rolling forward; groin pain (stop).","lumbar":"Shoulder packed; hips in line.","shoulder":"If the support shoulder is irritable, do the adduction machine instead that day.","leftleg":"Left leg on top first; match the right to it.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement. Stop at any groin pain above 3/10.","source":"Adductor coverage; core ladder L3"},{"id":83,"name":"Seated dumbbell shoulder press (neutral grip)","cat":"Hypertrophy - vertical press","muscles":"Front and side deltoids; secondary: Triceps, upper chest","purpose":"Overhead pressing strength and delt size, seated with back support and palms facing for shoulder comfort.","equipment":"Upright bench (75-85 degrees), dumbbells","setup":"Seated, back supported. Bench nearly upright. DBs to shoulders via thigh kick-up. Feet planted wide.","startpos":"DBs at shoulder height just outside the shoulders, PALMS FACING EACH OTHER (neutral), forearms vertical, ribs down, light brace.","exec":"1) Press both DBs up and slightly together until arms are long overhead - stop just short of locked, and only as high as is pain-free. 2) Lower slowly (3 s) to shoulder height. 3) Repeat. If full overhead is uncomfortable, work in the pain-free arc only (even 3/4 range grows delts).","breathing":"Exhale on the press; brace stops the lower back arching.","rom":"Pain-free arc; partial overhead range is acceptable and effective.","progression":"Double progression: when you hit the top of the rep range on ALL sets at the target RIR for 2 sessions in a row, add 2.5 kg (or smallest increment) and restart at the bottom of the range.","regression":"Reduce load ~10-20%, or move to the listed alternative; on amber days do 1 fewer set at +1 RIR. Alternative: landmine-style press or high-incline DB press.","alternative":"High-incline (60 degree) DB press; machine shoulder press with neutral grips.","errors":"Arching the lower back as fatigue builds; flaring palms forward if it pinches; pressing behind the head.","lumbar":"The upright pad + brace protects the lumbar spine; respect the pain-free arc. If you feel the lower back arching off the pad, the DBs are too heavy today.","shoulder":"Neutral grip and a slight forward lean of the arms are the friendliest overhead path; skip overhead entirely on amber shoulder days and do more lateral raises instead.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 5/10, pain is sharp or pinching, or pain spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Grip/angle modification evidence; RCRSP rules"},{"id":84,"name":"Hanging knee raise","cat":"Core - dynamic flexion (advanced)","muscles":"Lower abdominals, hip flexors; secondary: grip, lats","purpose":"The loaded progression of the reverse crunch - dynamic trunk flexion with the whole body's weight, once the isometric and floor levels are solid.","equipment":"Pull-up bar","setup":"Hanging from the bar, blades down. Grip the bar, step off the box, pull the shoulder blades down (active hang).","startpos":"Legs together, slight forward lean of the body.","exec":"1) Curl the pelvis under and lift the knees toward the chest, rolling the lower back into a curl at the top (2 s up). 2) Pause 1 s. 3) Lower slowly (3 s) without swinging; the pelvis un-tucks last.","breathing":"Exhale lifting.","rom":"Knees to chest with a pelvic tuck; no swinging.","progression":"6 -> 12 reps -> straighter legs (Week 9+).","regression":"Reverse crunch on the floor; captain's chair if available.","alternative":"Reverse crunch.","errors":"Swinging; lifting the legs without tucking the pelvis (hip flexors only); shrugging.","lumbar":"Introduced Week 5-6. Step off the box; never drop.","shoulder":"Active hang position throughout.","leftleg":"None.","stop":"Stop the set if shoulder pain exceeds 3/10, is sharp or pinching, or spreads down the arm. Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Core ladder L3; Short 2025"},{"id":85,"name":"Standing cable rotation with hip drive (Phase 4)","cat":"Core - rotational strength","muscles":"Obliques, glutes, hips; secondary: shoulders","purpose":"The final rung of the core ladder: rotational power driven by the hips with the trunk transmitting the force - the movement of real life and sport, earned through the anti-rotation levels first.","equipment":"Cable at chest height, D-handle","setup":"Standing side-on to the stack, athletic stance. Handle in both hands at chest height, arms slightly bent, feet shoulder-width, knees soft.","startpos":"Brace, hips square to start.","exec":"1) Rotate the whole body away from the stack by pivoting the back foot and turning the HIPS - the arms follow, staying in front of the chest. 2) The trunk turns as one unit with the hips; the lower back does not twist on its own. 3) Return under control. Complete reps, switch sides.","breathing":"Exhale on the rotation.","rom":"Comfortable; hips lead, spine follows as a unit.","progression":"8 -> 12 reps then +2.5 kg; faster on the way out, slow back.","regression":"Half-kneeling chop; Pallof press.","alternative":"Half-kneeling chop/lift.","errors":"Twisting from the waist with the hips locked; arms pulling instead of the body turning; leaning.","lumbar":"Introduced Week 9 only. Hips drive; the lumbar spine moves with the pelvis, not against it. Never combine with a flexed spine.","shoulder":"Hands at chest height.","leftleg":"Pivot evenly on both sides.","stop":"Stop immediately if: sharp back pain, any pain radiating into the leg, new numbness or tingling, or loss of control of the movement.","source":"Core ladder L4 (Short 2025); Ellestad 2024"}],"presc":[{"id" /* ---------- date helpers ---------- */
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d, 12); }
function iso(dt) { return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function addD(isoStr, n) { const d = pd(isoStr); d.setDate(d.getDate()+n); return iso(d); }

function fmt(isoStr) { const d = pd(isoStr); return DOWS[d.getDay()] + ' ' + d.getDate() + ' ' + MONS[d.getMonth()]; }

/* ---------- log access ---------- */
function dayLog(i) { const d = DAYS[i].date; if (!S.logs[d]) S.logs[d] = {}; return S.logs[d]; }
function exLog(i, pid, create) {
  const dl = dayLog(i);
  if (!dl[pid] && create) dl[pid] = { sets: [], pain: null, note: '', done: false, ts: null };
  return dl[pid];
}
function isRepBased(p) { return /\d/.test(p.reps); }
function exDone(i, pid) { const l = (S.logs[DAYS[i].date]||{})[pid]; return !!(l && l.done); }
function compProgress(i, k) { const list = DAYS[i][k]; return [list.filter(pid => exDone(i, pid)).length, list.length]; }
function dayProgress(i) { let t = 0, d = 0; COMPS.forEach(c => { const [a,b] = compProgress(i, c.k); d += a; t += b; }); return [d, t]; }
function dayDone(i) { const [a, b] = dayProgress(i); return b > 0 && a === b; }
function lastPerformance(exId, beforeIdx) {
  for (let i = beforeIdx - 1; i >= 0; i--) {
    const dl = S.logs[DAYS[i].date]; if (!dl) continue;
    for (const pid of Object.keys(dl)) {
      if (PR[pid] && PR[pid].ex === exId) {
        const l = dl[pid];
        const sets = (l.sets||[]).filter(s => s && (s.w != null || s.r != null || s.d));
        if (sets.length || l.done) return { idx: i, log: l, sets };

}
function streak() {
  // consecutive fully-completed programme days ending at the most recent completed day (gaps ignored)
  const t = todayISO(); let n = 0;

/* ---------- tempo timer ---------- */
function midOfRange(str) { const m = String(str).match(/(\d+)(?:\s*-\s*(\d+))?/); if (!m) return null; return m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1]; }
function parseTempoPhases(tempo) {
  if (!tempo || !/\d\s*s\b/.test(tempo)) return null;
  const phases = [];
  tempo.split(',').forEach(seg => {
    seg = seg.trim(); if (!seg) return;
    const m = seg.match(/^(?:~)?(\d+)(?:\s*-\s*(\d+))?\s*s\s+(.+)$/);
    if (m) { const dur = m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1]; let label = m[3].replace(/\beach .*$/,'').trim(); phases.push({ label: label || 'move', dur: Math.max(1, dur) }); }
    else { const m2 = seg.match(/^(controlled|slow)\s+(.+)$/i); if (m2) phases.push({ label: m2[2].trim(), dur: 2 }); }
  });
  return phases.length ? phases : null;
}
function parseTimeSec(str) {
  if (!str) return null;
  let m = String(str).match(/(\d+)(?:\s*-\s*(\d+))?\s*min/i);
  if (m) return (m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1]) * 60;
  m = String(str).match(/(\d+)(?:\s*-\s*(\d+))?\s*s\b/);
  if (m) return m[2] ? Math.round((+m[1] + +m[2]) / 2) : +m[1];
  return null;
}
function timerCfg(p) {
  const ex = EX[p.ex];
  const sides = /\/\s*side|per side|per leg|per arm|\/\s*leg|\/\s*arm|each\/side/i.test((p.reps || '') + ' ' + (p.dur || ''));
  const sets = parseInt(p.sets) || 1;
  const restSec = parseTimeSec(p.rest) || 0;
  if (isRepBased(p)) {
    const phases = parseTempoPhases(p.tempo); if (!phases) return null;
    const reps = midOfRange(p.reps); if (!reps) return null;
    return { title: ex.name, mode: 'reps', sets, reps, phases, restSec, sides, tempo: p.tempo };
  }
  const holdSec = parseTimeSec(p.dur) || parseTimeSec(p.tempo);
  if (!holdSec) return null;
  return { title: ex.name, mode: 'time', sets, holdSec, restSec, sides, tempo: p.dur || p.tempo };
}
const T = { on: false, iv: null, wl: null };
function vib(pat) { try { if (navigator.vibrate) navigator.vibrate(pat); } catch (e) {} }
async function wakeOn() { try { T.wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
function wakeOff() { try { if (T.wl) { T.wl.release(); T.wl = null; } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (T.on && document.visibilityState === 'visible' && !T.paused) wakeOn(); });
function timerQueueForSet(cfg) {
  const q = [{ kind: 'ready', label: 'Get ready', dur: 5 }]; const work = [];
  if (cfg.mode === 'reps') { for (let r = 1; r <= cfg.reps; r++) cfg.phases.forEach(ph => work.push({ kind: 'phase', label: ph.label, dur: ph.dur, rep: r })); }
  else work.push({ kind: 'phase', label: 'Hold / work', dur: cfg.holdSec, rep: 1 });
  q.push(...work);
  if (cfg.sides) { q.push({ kind: 'switch', label: 'Switch sides', dur: 5 }); work.forEach(w => q.push(Object.assign({}, w, { side2: true }))); }
  return q;
}
function startTimer(cfg) {
  T.on = true; T.cfg = cfg; T.set = 1; T.q = timerQueueForSet(cfg); T.qi = 0; T.sec = 0; T.paused = false; T.doneAll = false;
  wakeOn(); vib(60); clearInterval(T.iv); T.iv = setInterval(timerTick, 1000); drawTimer();
}
function stopTimer() { T.on = false; clearInterval(T.iv); T.iv = null; wakeOff(); document.getElementById('overlay').innerHTML = ''; }
function timerAdvance() {
  T.sec = 0; T.qi++;
  const cur = T.q[T.qi];
  if (!cur) {
    if (T.set < T.cfg.sets) { vib([80, 60, 80]); if (T.cfg.restSec > 0) { T.q = [{ kind: 'rest', label: 'Rest', dur: T.cfg.restSec }]; T.qi = 0; } else { T.set++; T.q = timerQueueForSet(T.cfg); T.qi = 0; } }
    else { T.doneAll = true; clearInterval(T.iv); T.iv = null; vib([100, 70, 100, 70, 250]); wakeOff(); }
    return;
  }
  if (cur.kind === 'phase' && T.cfg.mode === 'reps') { const prev = T.q[T.qi - 1]; if (!prev || prev.kind !== 'phase' || prev.rep !== cur.rep) vib(35); } else vib(45);
}
function timerTick() {
  if (T.paused || T.doneAll) return;
  T.sec++;
  const cur = T.q[T.qi];
  if (cur && T.sec >= cur.dur) { if (cur.kind === 'rest') { T.set++; T.q = timerQueueForSet(T.cfg); T.qi = -1; } timerAdvance(); }
  drawTimer();
}
function ensureTimerDOM() {
  const o = document.getElementById('overlay'); if (o.querySelector('.tmr')) return;
  o.innerHTML = '<div class="tmr"><div class="hd"><div class="nm">' + esc(T.cfg.title) + '</div><div class="meta" id="t-meta"></div><div class="dots" id="t-dots"></div></div>' +
    '<div class="mid"><div class="phase" id="t-phase"></div><div class="cnt" id="t-cnt"></div><div class="sub" id="t-sub"></div></div><div class="ctl" id="t-ctl"></div></div>';
  drawTimerCtl();
}
function drawTimerCtl() {
  const c = document.getElementById('t-ctl'); if (!c) return;
  c.innerHTML = T.doneAll ? '<button class="primary" onclick="A.timerEnd()">Log my sets</button>'
    : '<button onclick="A.timerPause()">' + (T.paused ? 'Resume' : 'Pause') + '</button><button onclick="A.timerSkip()">Skip ›</button><button class="exit" onclick="A.timerEnd()">End</button>';
}
function drawTimer() {
  if (!T.on) return; ensureTimerDOM();
  const cfg = T.cfg, cur = T.q[T.qi];
  let phaseCls = '', label = '', big = '', sub = '', repLine = '';
  if (T.doneAll) { label = 'Complete 🎉'; big = '✓'; sub = 'Nice work. Log your actual sets, reps and RIR.'; }
  else if (cur) {
    label = cur.label; phaseCls = cur.kind === 'rest' ? 'rest' : (cur.kind === 'ready' || cur.kind === 'switch') ? 'ready' : '';
    const remain = cur.dur - T.sec;
    if (cur.kind === 'rest') { const r = Math.max(0, remain); big = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); sub = 'Next: set ' + (T.set + 1) + ' of ' + cfg.sets; }
    else if (cur.kind === 'ready' || cur.kind === 'switch') { big = String(Math.max(0, remain)); sub = cur.kind === 'switch' ? 'Same again on the other side' : (cfg.mode === 'reps' ? 'Set ' + T.set + ' — ' + cfg.reps + ' reps at tempo' : 'Set ' + T.set); }
    else { big = String(Math.min(T.sec + 1, cur.dur)); sub = cfg.tempo || ''; if (cfg.mode === 'reps') repLine = 'Rep <b>' + cur.rep + '</b> of ' + cfg.reps + (cfg.sides ? (cur.side2 ? ' · second side' : ' · first side') : ''); }
  }
  document.getElementById('t-meta').innerHTML = 'Set <b>' + Math.min(T.set, cfg.sets) + '</b> of ' + cfg.sets + (repLine ? ' · ' + repLine : '');
  document.getElementById('t-dots').innerHTML = Array.from({ length: cfg.sets }, (_, s) => '<span class="' + (s + 1 < T.set || T.doneAll ? 'on' : s + 1 === T.set ? 'cur' : '') + '"></span>').join('');
  const ph = document.getElementById('t-phase'); ph.className = 'phase ' + phaseCls; ph.textContent = label;
  document.getElementById('t-cnt').textContent = big; document.getElementById('t-sub').textContent = sub;
  if (T.doneAll && !document.querySelector('#t-ctl .primary')) drawTimerCtl();
}

  { k: 'slpR', label: 'Single-leg press 8RM — right', u: 'kg', s: 'SLP R', g: 'Assessment (every 4 weeks)' }
];
function lastMetricBefore(k, dateISO) { const ds = Object.keys(S.metrics).filter(d => d < dateISO && S.metrics[d][k] != null).sort(); return ds.length ? S.metrics[ds[ds.length - 1]][k] : null; }
function latestMetric(k) { const ds = Object.keys(S.metrics).filter(d => S.metrics[d][k] != null).sort(); return ds.length ? { d: ds[ds.length - 1], v: S.metrics[ds[ds.length - 1]][k] } : null; }
function vMetrics(dateArg) {
  drawNav('metrics');

  let html = '<div class="topbar"><div class="pagetitle">Measurements</div></div>' +

    '<p class="tiny" style="margin:8px 0 2px">Girths: same tape, same landmarks, mornings. Thigh & calf weekly (Day 7); the assessment block every 4 weeks. Grey = previous reading. Saves as you type.</p></div>';
  let g = null;
  METRICS.forEach(m => {
    if (m.g !== g) { if (g) html += '</div>'; g = m.g; html += '<div class="phasehead">' + g + '</div><div class="card">'; }
    const prev = lastMetricBefore(m.k, date);
    html += '<div class="mrow"><label>' + m.label + ' <span class="u">' + m.u + '</span></label>' +
      '<input type="number" inputmode="decimal" step="0.1" min="0" placeholder="' + (prev != null ? prev : '') + '" value="' + (entry[m.k] != null ? entry[m.k] : '') + '" onchange="A.setMetric(\'' + date + '\',\'' + m.k + '\',this.value)"></div>';
  });
  html += '</div>';
  const hist = Object.keys(S.metrics).filter(d => Object.keys(S.metrics[d]).length).sort().reverse();
  if (hist.length) {
    html += '<div class="phasehead">History</div><div class="card" style="padding:4px 16px">';
    hist.forEach(d => {
      const e = S.metrics[d];

    });
    html += '</div><button class="exportbtn" onclick="A.exportMetrics(true)">📤 Share measurements (CSV)</button>';
  }
  html += '<div class="spacer"></div>';

}

/* ---------- view: progress ---------- */
const PR_KEYS = ['Trap-bar deadlift', 'Kettlebell deadlift', 'Hack squat (machine)', 'Leg press (45-degree or horizontal)', 'Single-leg leg press (left priority)',
  'Leg extension (machine)', 'Machine chest press (neutral or moderate grip)', 'Lat pulldown (neutral grip)', 'Chest-supported row (machine or incline DB)', 'Seated leg curl (machine)', 'Landmine press (half-kneeling or standing)'];
function bestSets() {
  const best = {};
  DAYS.forEach((d, i) => {
    const dl = S.logs[d.date]; if (!dl) return;
    Object.keys(dl).forEach(pid => {
      const p = PR[pid]; if (!p) return; const nm = EX[p.ex].name;
      (dl[pid].sets || []).forEach(s => {
        if (s && s.w != null && s.r != null) {
          const score = s.w * (1 + s.r / 30);  // Epley-style estimate, used only for ranking
          if (!best[nm] || score > best[nm].score) best[nm] = { score, w: s.w, r: s.r, date: effDate(i) };
        }
      });
    });
  });
  return best;
}
function sparkline(values) {
  if (values.length < 2) return '';
  const w = 320, h = 70, pad = 6;
  const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
  const pts = values.map((v, i) => [pad + i * (w - 2 * pad) / (values.length - 1), h - pad - (v - min) / span * (h - 2 * pad)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><path d="' + path + '" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/></svg>';
}
function vProgress() {
  drawNav('prog');
  const t = todayISO();
  const ti = dayByEff(t);
  const curWeek = ti >= 0 ? DAYS[ti].week : (t < effDate(0) ? 1 : DAYS[DAYS.length - 1].week);
  const done = sessionsDone();
  const toGo = Math.max(0, daysBetween(t, TARGET));
  let html = '<div class="topbar"><div class="pagetitle">Progress</div></div>' + shiftBannerHTML();
  html += '<div class="card hero"><div class="eyebrow">Programme 2 · Rebuild &amp; Grow</div>' +
    '<div class="stats" style="margin-top:10px"><div class="stat acc"><div class="v num">' + toGo + '</div><div class="k">days to 1 Dec</div></div>' +
    '<div class="stat"><div class="v num">' + done + '<span class="tiny">/' + DAYS.length + '</span></div><div class="k">sessions completed</div></div>' +
    '<div class="stat"><div class="v num">' + streak() + '</div><div class="k">day streak</div></div></div>' +
    '<div class="progress" style="margin-top:14px"><div style="width:' + Math.round(done / DAYS.length * 100) + '%"></div></div>' +
    '<div class="tiny" style="margin-top:6px">' + Math.round(done / DAYS.length * 100) + '% of the programme banked</div></div>';
  // bodyweight sparkline
  const wds = Object.keys(S.metrics).filter(d => S.metrics[d].weight != null).sort();
  if (wds.length) {
    const vals = wds.map(d => S.metrics[d].weight);
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-size:15px">Body weight</h3><span class="muted num">' + vals[vals.length - 1] + ' kg · ' + fmt(wds[wds.length - 1]) + '</span></div>' +
      (vals.length > 1 ? sparkline(vals) + '<div class="tiny">' + fmt(wds[0]) + ' → ' + fmt(wds[wds.length - 1]) + ' · change ' + (vals[vals.length - 1] - vals[0] >= 0 ? '+' : '') + (vals[vals.length - 1] - vals[0]).toFixed(1) + ' kg</div>' : '<div class="tiny">Add a second weigh-in to see the trend.</div>') + '</div>';
  }
  // thigh symmetry
  const tl = latestMetric('thighL'), tr = latestMetric('thighR');
  if (tl && tr) {
    const gap = (tl.v - tr.v), sym = Math.round(tl.v / tr.v * 1000) / 10;
    html += '<div class="card"><h3 style="font-size:15px">Left-leg gap</h3><div class="stats" style="margin-top:8px">' +
      '<div class="stat"><div class="v num">' + tl.v + '</div><div class="k">thigh L (cm)</div></div><div class="stat"><div class="v num">' + tr.v + '</div><div class="k">thigh R (cm)</div></div>' +
      '<div class="stat ' + (sym >= 97 ? 'acc' : '') + '"><div class="v num">' + sym + '%</div><div class="k">symmetry (target ≥97%)</div></div></div>' +
      '<div class="tiny" style="margin-top:8px">Gap ' + (gap >= 0 ? '+' : '') + gap.toFixed(1) + ' cm · latest ' + fmt(tl.d) + '. Baseline 14 Aug: 39.4 vs 42.5 cm (−3.1 cm, 92.8%).</div></div>';
  }
  // PRs
  const best = bestSets();
  const prs = PR_KEYS.filter(k => best[k]);
  if (prs.length) {
    html += '<div class="card" style="padding:8px 16px"><h3 style="font-size:15px;margin:6px 0 2px">Best working sets</h3>';
    prs.forEach(k => { const b = best[k]; html += '<div class="pr"><span class="nm">' + esc(k) + '</span><span class="v num">' + b.w + ' kg × ' + b.r + '</span><span class="d">' + fmt(b.date) + '</span></div>'; });
    html += '</div>';
  }
  for (let w = curWeek; w >= Math.max(1, curWeek - 1); w--) {
    const wdays = DAYS.map((d, i) => [d, i]).filter(x => x[0].week === w);
    html += '<div class="phasehead">Week ' + w + (w === curWeek ? ' · current' : '') + '</div><div class="card" style="padding:4px 16px">';
    wdays.forEach(([d, i]) => {
      const [a, b] = dayProgress(i); const light = S.lights[d.date];
      const st = a === 0 ? '<span style="color:var(--faint)">—</span>' : (a === b ? '<span style="color:var(--green)">✓ ' + a + '/' + b + '</span>' : '<span style="color:var(--yellow)">' + a + '/' + b + '</span>');
      html += '<div class="weekrow" onclick="location.hash=\'day/' + effDate(i) + '\'"><span class="dt">' + fmt(effDate(i)) + '</span><span>' + esc(d.focus.split(' - ')[0].split('(')[0].trim()) + '</span>' +
        '<span class="st">' + (light ? (light === 'G' ? '🟢' : light === 'A' ? '🟠' : '🔴') + ' ' : '') + st + '</span></div>';
    });
    html += '</div>';
  }
  html += '<div class="phasehead">Export for review</div>' +
    '<button class="exportbtn" onclick="A.exportCSV(true)">📤 Share training log (CSV)</button>' +
    '<button class="exportbtn" onclick="A.exportCSV(false)">⬇️ Download training log (CSV)</button>' +
    '<button class="exportbtn" onclick="A.exportMetrics(true)">📏 Share measurements (CSV)</button>' +
    '<button class="exportbtn" onclick="A.exportCheckin(true)">📝 Share daily check-ins (CSV)</button>' +
    '<p class="tiny" style="margin:4px 2px">Send these three CSVs to Claude in the “My Personal Trainer” project for each review.</p>' +
    '<div class="phasehead">Backup</div><button class="exportbtn" onclick="A.backup()">💾 Download full backup (JSON)</button>' +
    '<button class="exportbtn" onclick="document.getElementById(\'restoreFile\').click()">📥 Restore from backup</button>' +
    '<input type="file" id="restoreFile" accept=".json" style="display:none" onchange="A.restore(this)">' +
    '<div class="phasehead">Danger zone</div><div class="dangerzone"><button class="exportbtn" onclick="A.wipe()">🗑 Erase all logged data</button></div>' +
    '<p class="tiny" style="margin:8px 2px">' + esc(DATA.version) + ' · app v3.0 · data stays on this phone only' + (storageOK ? '' : ' · ⚠️ storage unavailable — export after every session') + '</p><div class="spacer"></div>';
  $app.innerHTML = html;
}

/* ---------- CSV helpers ---------- */
function shareOrDownload(csv, name, title) {
  const file = new File([csv], name, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('CSV downloaded');
}
function csvLine(r) { return r.map(v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }

/* ---------- actions ---------- */
window.A = {
  moveDay(n) { viewDate = addD(viewDate, n); location.hash = 'day/' + viewDate; if (location.hash === '#day/' + viewDate) render(); },
  jumpToday() { viewDate = todayISO(); location.hash = 'day/' + viewDate; },
  setLight(i, L) { const d = DAYS[i].date; S.lights[d] = S.lights[d] === L ? null : L; save(); render(); },
  postpone() {
    modal('Postpone to tomorrow?', 'Today becomes a rest day, and today\'s session plus the <b>entire remaining programme</b> move forward one day. Nothing is skipped — the finish date just moves a day later.', 'Postpone', () => {
      const t = todayISO(); if (S.gaps.indexOf(t) === -1) S.gaps.push(t);
      invalidateEff(); save(); toast('Programme moved +1 day 👍'); viewDate = t; render();
    });
  },
  unshift() { modal('Undo postponement?', 'The most recent postponed day is removed and the programme moves back one day.', 'Move back', () => { S.gaps.pop(); invalidateEff(); save(); render(); }); },
  setVal(i, pid, s, f, v) { const l = exLog(i, pid, true); while (l.sets.length <= s) l.sets.push({}); l.sets[s][f] = v === '' ? null : (f === 'rir' ? v : parseFloat(v)); l.ts = l.ts || new Date().toISOString(); save(); },
  toggleSet(i, pid, s) { const l = exLog(i, pid, true); while (l.sets.length <= s) l.sets.push({}); l.sets[s].d = !l.sets[s].d; l.ts = new Date().toISOString(); save(); render(); },
  addSet(i, pid) { const l = exLog(i, pid, true); const n = Math.max(parseInt(PR[pid].sets) || 1, l.sets.length); while (l.sets.length < n + 1) l.sets.push({}); save(); render(); },
  setPain(i, pid, v, el) { const l = exLog(i, pid, true); l.pain = +v; save(); const pv = document.getElementById('painval'); pv.textContent = v; pv.className = 'painval ' + (v >= 5 ? 'r' : v >= 3 ? 'a' : ''); },
  setNote(i, pid, v) { const l = exLog(i, pid, true); l.note = v; save(); },
  setCheckin(i, k, v) {
    const d = DAYS[i].date; if (!S.checkin[d]) S.checkin[d] = {};
    if (k === 'note') S.checkin[d].note = v; else if (k === 'walk') S.checkin[d].walk = +v; else S.checkin[d][k] = v === '' ? null : parseFloat(v);
    save(); if (k === 'walk') render();
  },
  markDone(i, pid, idx, k) {
    const l = exLog(i, pid, true); l.done = !l.done;
    if (l.done) { const n = parseInt(PR[pid].sets) || 1; while (l.sets.length < n) l.sets.push({}); l.sets.forEach(s => s.d = true); l.ts = new Date().toISOString(); }
    save();
    const list = DAYS[i][k];
    if (l.done && idx < list.length - 1) location.replace('#ex/' + i + '/' + k + '/' + (idx + 1));
    else if (l.done) { toast('🎉 ' + compMeta(k).label + ' finished' + (dayDone(i) ? ' — day complete!' : '')); history.back(); }
    else render();
  },
  dictSearch(v) { dictQ = v; vDict(); },
  startTimer(pid) { const cfg = timerCfg(PR[pid]); if (!cfg) return; startTimer(cfg); },
  timerPause() { T.paused = !T.paused; if (T.paused) wakeOff(); else wakeOn(); drawTimerCtl(); drawTimer(); },
  timerSkip() { const cur = T.q[T.qi]; if (cur && cur.kind === 'rest') { T.set++; T.q = timerQueueForSet(T.cfg); T.qi = -1; } timerAdvance(); drawTimer(); },
  timerEnd() { stopTimer(); const logCard = document.querySelector('.setrow'); if (logCard) logCard.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  setMetric(date, k, v) { if (!S.metrics[date]) S.metrics[date] = {}; if (v === '') delete S.metrics[date][k]; else S.metrics[date][k] = parseFloat(v); if (!Object.keys(S.metrics[date]).length) delete S.metrics[date]; save(); },
  delMetric(date) { modal('Delete these measurements?', fmt(date) + ' — this entry will be removed.', 'Delete', () => { delete S.metrics[date]; save(); location.hash = 'metrics'; render(); }); },
  exportMetrics(share) {
    const dates = Object.keys(S.metrics).filter(d => Object.keys(S.metrics[d]).length).sort();
    if (!dates.length) return toast('No measurements yet');
    const unit = m => m.u === 'kg' ? 'kg' : m.u === 'cm' ? 'cm' : m.u === 's' ? 's' : 'deg';
    const rows = [['date'].concat(METRICS.map(m => m.k + '_' + unit(m)))];
    dates.forEach(d => rows.push([d].concat(METRICS.map(m => S.metrics[d][m.k] != null ? S.metrics[d][m.k] : ''))));
    shareOrDownload(rows.map(csvLine).join('\n'), 'measurements_' + todayISO() + '.csv', 'Measurements');
  },
  exportCheckin(share) {
    const rows = [['date','programme_day','week','sleep_h','readiness_1_10','back_pain_0_10','session_rpe_0_10','walk_20min','traffic_light','note']];
    DAYS.forEach((d, i) => {
      const c = S.checkin[d.date]; if (!c) return;
      rows.push([effDate(i), d.day, d.week, c.sleep != null ? c.sleep : '', c.ready != null ? c.ready : '', c.back != null ? c.back : '', c.rpe != null ? c.rpe : '', c.walk != null ? c.walk : '', S.lights[d.date] || '', c.note || '']);
    });
    if (rows.length === 1) return toast('No check-ins yet');
    shareOrDownload(rows.map(csvLine).join('\n'), 'checkin_' + todayISO() + '.csv', 'Daily check-ins');
  },
  exportCSV(share) {
    const rows = [['week','day','planned_date','logged_at','traffic_light','component','exercise','set','planned_sets','planned_reps_or_duration','target_rir','weight_kg','reps_done','rir','set_done','exercise_completed','pain_0_10','notes']];
    DAYS.forEach((d, i) => {
      const dl = S.logs[d.date]; if (!dl) return;
      COMPS.forEach(c => d[c.k].forEach(pid => {
        const l = dl[pid]; if (!l) return;
        const p = PR[pid], ex = EX[p.ex];
        const hasData = l.done || l.pain != null || (l.note || '') !== '' || (l.sets || []).some(s => s && (s.w != null || s.r != null || s.d));
        if (!hasData) return;
        const nSets = Math.max(parseInt(p.sets) || 1, (l.sets || []).length);
        for (let s = 0; s < nSets; s++) {
          const sl = (l.sets && l.sets[s]) || {};
          rows.push([d.week, 'D' + ((d.day - 1) % 7 + 1) + ' ' + d.dow, d.date, l.ts ? l.ts.slice(0, 10) : '', S.lights[d.date] || '', compMeta(c.k).label, ex.name, s + 1,
            p.sets, p.reps || p.dur, p.rir, sl.w != null ? sl.w : '', sl.r != null ? sl.r : '', sl.rir != null && sl.rir !== '' ? sl.rir : '',
            sl.d ? 1 : 0, l.done ? 1 : 0, s === 0 && l.pain != null ? l.pain : '', s === 0 ? (l.note || '') : '']);
        }
      }));
    });
    if (rows.length === 1) return toast('Nothing logged yet');
    if (share) shareOrDownload(rows.map(csvLine).join('\n'), 'training_log_' + todayISO() + '.csv', 'Training log');
    else { const csv = rows.map(csvLine).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'training_log_' + todayISO() + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('CSV downloaded'); }
  },
  backup() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'trainer_backup_' + todayISO() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('Backup downloaded'); },
  restore(input) {
    const f = input.files[0]; if (!f) return;
    f.text().then(txt => {
      try {
        const obj = JSON.parse(txt); if (typeof obj.logs !== 'object' || obj.logs === null) throw 0;
        S = Object.assign({ gaps: [], logs: {}, lights: {}, metrics: {}, checkin: {} }, obj);
        if (!Array.isArray(S.gaps)) S.gaps = []; if (!S.metrics || typeof S.metrics !== 'object') S.metrics = {}; if (!S.checkin || typeof S.checkin !== 'object') S.checkin = {};
        invalidateEff(); save(); toast('Backup restored ✓'); render();
      } catch (e) { toast('That file is not a valid backup'); }
    });
    input.value = '';
  },
  wipe() { modal('Erase everything?', 'All logged weights, reps, pain scores, check-ins and postponements on this phone will be deleted. Export a backup first!', 'Erase', () => { S = { gaps: [], logs: {}, lights: {}, metrics: {}, checkin: {} }; invalidateEff(); save(); toast('All data erased'); render(); }); }
};

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
render();
